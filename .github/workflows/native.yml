# App desktop nativo (desktop-native/, Rust/GPUI): compila Linux e Windows e publica numa release FIXA
# `native-latest`, reescrita a cada push na main — o mesmo esquema do `dist-latest` do ci.yml. O app lê o
# `native-latest.json` dessa release para oferecer o "Atualizar" (desktop-native/src/update.rs).
# O canal de testes (`beta`) publica na pré-release `native-beta`, que é a que o app procura quando o servidor da
# máquina está no canal dessa branch. O manifesto mantém o nome em toda release.
# `check` (build e test em debug, Linux) roda em todo push; `build` + `publish` só na main e no canal.
# `workflow_dispatch` em outra branch compila sem publicar. Trocar o canal é trocar `beta` aqui, no server.yml e
# nos *-macos.yml. O build está no native-build.yml. O macOS roda à parte, no native-macos.yml, depois que este
# run termina, e acrescenta os arquivos dele ao manifesto desta versão: nada daqui espera por ele.
name: Native

on:
  push:
    branches: ["**"]
    paths:
      - "desktop-native/**"
      - "crates/hangar-api/**"
      - "crates/hangar-workspace/**"
      # As versões do hangar-api vêm do [workspace.dependencies] daqui.
      - "crates/Cargo.toml"
      - "messages/**"
      - "VERSION"
      - ".github/workflows/native.yml"
      - ".github/workflows/native-build.yml"
  workflow_dispatch:

# Na main e no canal cada run tem o próprio grupo: quem cancela o run que um push novo substituiu são os jobs
# `check`, `build` e `cache-release` (concorrência por job); o `publish` tem grupo próprio sem cancelamento, então
# nunca é cortado no meio do upload, e run com build cancelado não publica (o `publish` exige `check` e `build`).
# Onde não publica, o push novo cancela o run anterior inteiro.
concurrency:
  group: ${{ (github.ref_name == 'main' || github.ref_name == 'beta') && format('native-run-{0}', github.run_id) || format('native-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'beta' }}

jobs:
  # `build` e não `check` do cargo: confere o mesmo binário e deixa as dependências no perfil que o `test` reaproveita.
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: native-check-${{ github.ref_name }}
      cancel-in-progress: true
    # `actions: write` apaga as cópias antigas do cache que este job grava.
    permissions:
      contents: read
      actions: write
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: desktop-native
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Mesma lista do build do native-build.yml.
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libzstd-dev rpm
      - uses: actions/cache/restore@v4
        id: cache-check
        with:
          path: &cache-check |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-native/target
          key: native-check-${{ runner.os }}-${{ hashFiles('desktop-native/Cargo.lock', 'desktop-native/rust-toolchain.toml') }}-${{ hashFiles('desktop-native/vendor/**') }}
          restore-keys: native-check-${{ runner.os }}-
      # Mesmo motivo do passo de igual nome no native-build.yml: sem isto o GPUI vendorizado recompilava a cada push.
      - name: Reaproveitar o vendor do cache
        if: steps.cache-check.outputs.cache-hit == 'true'
        run: git ls-files -z vendor | xargs -0 touch -t 200001010000
      - run: cargo build --locked
      - run: cargo test --locked
      - if: &grava-check github.ref == 'refs/heads/main' && steps.cache-check.outputs.cache-hit != 'true'
        run: ../scripts/podar-target --cache target
      - uses: actions/cache/save@v4
        if: *grava-check
        with:
          path: *cache-check
          key: ${{ steps.cache-check.outputs.cache-primary-key }}
      # Chave nova não substitui a velha: sem apagar, cada mudança no vendor ou no Cargo.lock deixava outra cópia
      # até o teto de 10 GB do repositório, e o GitHub despejava o cache que a main estava usando. Por último e sem
      # derrubar o job: falha aqui só deixa as cópias antigas, com aviso. Só apaga com a chave nova já gravada
      # (o `cache/save` que falha só avisa, e apagar então deixaria o próximo push sem cache).
      - name: Apagar cópias antigas do cache
        if: *grava-check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIXO: native-check-${{ runner.os }}-
          CHAVE: ${{ steps.cache-check.outputs.cache-primary-key }}
        run: |
          set -o pipefail
          lista() { gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$1" --limit 100 --json key --jq '.[].key'; }
          gravada=$(lista "$CHAVE") || { echo "::warning::não consegui listar o cache $CHAVE; as cópias antigas ficam"; exit 0; }
          grep -qxF -- "$CHAVE" <<<"$gravada" || { echo "::warning::o cache $CHAVE não aparece gravado; as cópias antigas ficam"; exit 0; }
          antigas=$(lista "$PREFIXO") || { echo "::warning::não consegui listar o cache $PREFIXO; as cópias antigas ficam"; exit 0; }
          while IFS= read -r k; do
            [ -z "$k" ] || [ "$k" = "$CHAVE" ] || gh cache delete "$k" --repo "$GITHUB_REPOSITORY" || echo "::warning::não apaguei o cache $k"
          done <<<"$antigas"

  # Build e cache de release (este só na main), no native-build.yml. Falha do Windows não segura a release do Linux.
  build:
    if: github.ref_name == 'main' || github.ref_name == 'beta' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/native-build.yml
    permissions:
      contents: read
      actions: write
    with:
      branch: ${{ github.ref_name }}
      sistemas: >-
        [
          {"os": "ubuntu-latest", "platform": "linux-x86_64", "exe": "", "experimental": false},
          {"os": "windows-latest", "platform": "windows-x86_64", "exe": ".exe", "experimental": true}
        ]

  # Só este job escreve, como o `publica-dist` do ci.yml. Teste vermelho no `check` segura a publicação.
  publish:
    needs: [check, build]
    if: startsWith(github.ref, 'refs/heads/') && (github.ref_name == 'main' || github.ref_name == 'beta')
    runs-on: ubuntu-latest
    concurrency:
      group: native-publish-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: out
          merge-multiple: true
      # sha256 com o NOME PURO (como o release.yml) e o manifesto calculados aqui, num sistema só, para os
      # arquivos saírem no mesmo formato. A versão é a mesma conta do build.rs sobre o mesmo commit.
      - name: sha256 e manifesto
        run: |
          test -f out/Hangar-linux-x86_64 || { echo "sem o binário do Linux, nada a publicar"; exit 1; }
          version="$(tr -d '[:space:]' < VERSION).$(git rev-list --count HEAD)"
          # A API que este app exige do servidor; sem ela o app não sabe se pode se atualizar sozinho.
          requires_api=$(sed -n 's/^pub const CLIENT_API: u32 = \([0-9][0-9]*\);.*/\1/p' crates/hangar-api/src/lib.rs)
          test -n "$requires_api" || { echo "::error::CLIENT_API não encontrado em crates/hangar-api/src/lib.rs"; exit 1; }
          cd out
          for f in Hangar-*; do sha256sum "$f" > "$f.sha256"; done
          jq -n --arg version "$version" --arg commit "$GITHUB_SHA" --argjson requires_api "$requires_api" \
            '{version: $version, commit: $commit, requires_api: $requires_api, files: [inputs | capture("^(?<sha>[0-9a-f]{64})  (?<name>.+)$") | {(.name): .sha}] | add}' \
            -R Hangar-*.sha256 > native-latest.json
          cat native-latest.json
      # O manifesto sobe por ÚLTIMO: até ele trocar, o app ainda vê o sha antigo e recusa o binário novo em vez de
      # instalar um par trocado. Sistema que não compilou desta vez fica com o arquivo anterior na release (build
      # instável não apaga o único binário dele) e fora do manifesto; as notas da release avisam quem baixa à mão.
      # O macOS entra depois, pelo native-macos.yml, que troca a linha dele nas notas.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version out/native-latest.json)
          # Mesma limpeza do release_tag() do desktop-native/src/update.rs: mudar uma exige mudar a outra.
          if [ "$GITHUB_REF_NAME" = main ]; then
            tag=native-latest
            title="Hangar desktop v$version"
            kind=(--latest)
          else
            tag="native-${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
            if [ "$tag" = native-latest ]; then
              echo "::error::a branch '$GITHUB_REF_NAME' vira o tag native-latest, que é a release da main; renomeie a branch"
              exit 1
            fi
            title="Hangar desktop v$version (branch $GITHUB_REF_NAME)"
            kind=(--prerelease --latest=false)
          fi
          # O commit da versão anterior vem do manifesto ainda publicado: ele só é trocado no fim deste passo.
          previous=$(gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p native-latest.json -O - | jq -r '.commit // empty') || {
            echo "::warning::manifesto anterior indisponível; as notas saem sem 'O que mudou'"
            previous=""
          }
          changes=""
          if test -n "$previous" && git cat-file -e "$previous^{commit}" 2>/dev/null; then
            changes=$(git log --no-merges -n 40 --format='- %s' "$previous..$GITHUB_SHA" -- desktop-native crates/hangar-api crates/hangar-workspace VERSION .github/workflows/native.yml .github/workflows/native-build.yml)
          fi
          notes=$(cat <<'EOF'
          ## Hangar para desktop

          App nativo do Hangar para acompanhar e comandar as sessões do Claude Code, Codex e dos outros agentes direto do computador, ligado ao servidor Hangar desta máquina ou de outras.

          ### Qual arquivo baixar

          | Sistema | Arquivo |
          |---|---|
          | Windows (x64) | `Hangar-windows-x86_64.zip` |
          | macOS (Apple Silicon) | `Hangar-macos-aarch64.zip` |
          | macOS (Intel) | `Hangar-macos-x86_64.zip` |
          | Linux (x64) | `Hangar-linux-x86_64.deb` (Ubuntu 24.04+, Debian 13+, Mint 22+), `Hangar-linux-x86_64.rpm` (Fedora 40+, openSUSE Tumbleweed) ou `Hangar-linux-x86_64.tar.gz` (glibc 2.39 ou mais nova) |

          ### Como instalar

          - **Windows:** descompacte e abra `Hangar.exe`. Se o SmartScreen avisar que o app não é reconhecido, use "Mais informações" e depois "Executar assim mesmo".
          - **macOS:** descompacte e arraste `Hangar.app` para Aplicativos. Na primeira vez, abra com o botão direito e escolha "Abrir": o app não é assinado.
          - **Linux:** abra o `.deb` ou o `.rpm` com dois cliques (a loja de programas instala). Quem prefere o terminal: `tar xzf Hangar-linux-x86_64.tar.gz` e depois `./install-linux.sh`.

          Instalado, o app mostra um botão de atualizar quando sai versão nova. Os binários não são assinados; confira pelo `.sha256` ao lado de cada arquivo.
          EOF
          )
          if test -n "$changes"; then
            notes+=$'\n\n'"### O que mudou"$'\n\n'"$changes"
          fi
          if [ "$tag" != native-latest ]; then
            notes+=$'\n\n'"### Canal de testes"$'\n\n'"Reescrita a cada push na branch $GITHUB_REF_NAME. O app troca para esta release quando o servidor da máquina está no canal de testes dessa branch; a versão estável é a native-latest."
          fi
          notes+=$'\n\n'"### Esta versão"$'\n\n'"Versão $version ($GITHUB_SHA). Linux: arquivo desta versão."
          if test -f out/Hangar-windows-x86_64.exe; then
            notes+=$'\n'"Windows: arquivo desta versão."
          else
            notes+=$'\n'"Windows: não houve arquivo desta versão; se houver arquivo nesta página, é de uma publicação anterior. Não corresponde ao manifesto desta versão."
          fi
          # O native-macos.yml troca estas linhas quando publica o macOS desta versão.
          for platform in macOS 'macOS Intel'; do
            notes+=$'\n'"$platform: compilado à parte, depois desta publicação; enquanto esta linha estiver assim, o arquivo nesta página é de uma publicação anterior e não corresponde ao manifesto desta versão."
          done
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${kind[@]}" \
                 --title "$title" \
                 --notes "$notes"
          cd out
          gh release upload "$tag" Hangar-* --repo "$GITHUB_REPOSITORY" --clobber
          # A tag fica fixa (o atualizador do app lê `native-latest` ou `native-<branch>`); o título mostra a versão publicada.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          gh release upload "$tag" native-latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null

# App desktop nativo (desktop-native/, Rust/GPUI). Conferir e publicar são jobs separados:
# - `check` (cargo build + cargo test, Linux, sem --release) roda em todo push e PR que toque estes caminhos.
# - `build` + `publish` só na main e no canal de testes. A main compila Linux, Windows e macOS e publica na release
#   FIXA `native-latest`, cujo `native-latest.json` alimenta o "Atualizar" (desktop-native/src/update.rs). O canal
#   compila Linux e Windows e publica na pré-release `native-<branch>` (fora de [A-Za-z0-9._-] vira `-`), que o app
#   procura quando o servidor da máquina está no canal dessa branch. O manifesto mantém o nome em toda release.
# Canal de testes hoje: hangar-server-parte1. Trocar o canal é trocar esse nome aqui e no server.yml.
# `workflow_dispatch` em outra branch compila Linux e Windows sem publicar, para conferir o build de release.
name: Native

on:
  push:
    branches: ["**"]
    paths: &paths
      - "desktop-native/**"
      - "crates/hangar-api/**"
      - "crates/hangar-workspace/**"
      # As versões do hangar-api vêm do [workspace.dependencies] daqui.
      - "crates/Cargo.toml"
      - "messages/**"
      - "VERSION"
      - ".github/workflows/native.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

# Dois pushes seguidos não publicam ao mesmo tempo: o segundo espera, e a release termina no commit mais novo.
# Onde não publica, o push novo cancela a conferência do anterior.
concurrency:
  group: native-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'hangar-server-parte1' }}

jobs:
  # PR de branch deste repositório já roda pelo push; aqui só os de fork.
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop-native
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libzstd-dev
      # Só a main e o canal gravam cache: cópia por branch estourava os 10 GB do repositório e o GitHub despejava
      # justamente as da main. As outras branches leem o da main.
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-native/target
          key: native-check-${{ runner.os }}-${{ hashFiles('desktop-native/Cargo.lock', 'desktop-native/rust-toolchain.toml') }}
          restore-keys: native-check-${{ runner.os }}-
      # `build` e não `check`: confere o mesmo binário e deixa as dependências no perfil que o `test` reaproveita;
      # o `check` refazia todas elas só em metadados.
      - run: cargo build --locked
      - run: cargo test --locked
      - if: steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'hangar-server-parte1')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-native/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'hangar-server-parte1'))
    strategy:
      fail-fast: false
      matrix:
        # macOS só na main: as máquinas do canal de testes são Linux e Windows.
        os: ${{ fromJSON(github.ref_name == 'main' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # Windows e macOS nunca foram compilados antes deste workflow: falha deles não segura a release do Linux.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop-native
        shell: bash
    env:
      PLATFORM: ${{ fromJSON('{"ubuntu-latest":"linux-x86_64","windows-latest":"windows-x86_64","macos-latest":"macos-aarch64"}')[matrix.os] }}
      EXE: ${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      # Histórico inteiro: a versão embutida é `VERSION` + número de commits, e clone raso contaria 1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libzstd-dev
      # O rustup do runner lê o rust-toolchain.toml (1.98.1) no primeiro cargo. actions/cache e não rust-cache: a
      # política do repositório só libera actions do GitHub e de criadores verificados.
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-native/target
          key: native-${{ runner.os }}-${{ hashFiles('desktop-native/Cargo.lock', 'desktop-native/rust-toolchain.toml') }}
          restore-keys: native-${{ runner.os }}-
      # Perfil do tools/build-otimizado.sh: é o binário que o usuário roda.
      - run: cargo build --locked --release
        env:
          # A branch embutida faz o app trocar de canal mesmo para uma versão de contagem menor (update.rs).
          HANGAR_NATIVE_CHANNEL: ${{ github.ref_name }}
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      - if: steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-native/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # Binário cru com nome limpo (o que o app baixa para se atualizar) + arquivo compactado para quem baixa à mão.
      # O binário cru mantém o nome usado pelo atualizador. O arquivo manual leva o lançador/ícone no Linux,
      # o executável com ícone incorporado no Windows e o pacote .app com ICNS no macOS.
      - name: Empacotar
        run: |
          name=Hangar-$PLATFORM
          mkdir -p out stage
          cp "target/release/hangar-native$EXE" "out/$name$EXE"
          case "$RUNNER_OS" in
            Linux)
              install -m755 target/release/hangar-native stage/hangar
              install -m755 tools/install-linux.sh stage/install-linux.sh
              install -m644 assets/brand/icon.png stage/icon.png
              tar -czf "out/$name.tar.gz" -C stage hangar install-linux.sh icon.png
              ;;
            Windows) cp target/release/hangar-native.exe stage/Hangar.exe && (cd stage && 7z a -tzip "../out/$name.zip" Hangar.exe) ;;
            macOS)
              tools/package-macos.sh target/release/hangar-native stage/Hangar.app
              (cd stage && zip -qr "../out/$name.zip" Hangar.app)
              ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ env.PLATFORM }}
          path: desktop-native/out/*
          retention-days: 1

  # Só este job escreve, como o `publica-dist` do ci.yml.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/heads/') && (github.ref_name == 'main' || github.ref_name == 'hangar-server-parte1')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: out
          merge-multiple: true
      # sha256 com o NOME PURO (como o release.yml) e o manifesto calculados aqui, num sistema só, para os três
      # saírem no mesmo formato. A versão é a mesma conta do build.rs sobre o mesmo commit.
      - name: sha256 e manifesto
        run: |
          test -f out/Hangar-linux-x86_64 || { echo "sem o binário do Linux, nada a publicar"; exit 1; }
          version="$(tr -d '[:space:]' < VERSION).$(git rev-list --count HEAD)"
          cd out
          for f in Hangar-*; do sha256sum "$f" > "$f.sha256"; done
          jq -n --arg version "$version" --arg commit "$GITHUB_SHA" \
            '{version: $version, commit: $commit, files: [inputs | capture("^(?<sha>[0-9a-f]{64})  (?<name>.+)$") | {(.name): .sha}] | add}' \
            -R Hangar-*.sha256 > native-latest.json
          cat native-latest.json
      # O manifesto sobe por ÚLTIMO: até ele trocar, o app ainda vê o sha antigo e recusa o binário novo em vez de
      # instalar um par trocado. Sistema que não compilou desta vez fica com o arquivo anterior na release (build
      # instável não apaga o único binário dele) e fora do manifesto; as notas da release avisam quem baixa à mão.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version out/native-latest.json)
          # Mesma limpeza do release_tag() do desktop-native/src/update.rs: mudar uma exige mudar a outra.
          if [ "$GITHUB_REF_NAME" = main ]; then
            tag=native-latest
            title="Hangar desktop v$version"
            kind=(--latest)
          else
            tag="native-${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
            if [ "$tag" = native-latest ]; then
              echo "::error::a branch '$GITHUB_REF_NAME' vira o tag native-latest, que é a release da main; renomeie a branch"
              exit 1
            fi
            title="Hangar desktop v$version (branch $GITHUB_REF_NAME)"
            kind=(--prerelease --latest=false)
          fi
          # O commit da versão anterior vem do manifesto ainda publicado: ele só é trocado no fim deste passo.
          previous=$(gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p native-latest.json -O - | jq -r '.commit // empty') || {
            echo "::warning::manifesto anterior indisponível; as notas saem sem 'O que mudou'"
            previous=""
          }
          changes=""
          if test -n "$previous" && git cat-file -e "$previous^{commit}" 2>/dev/null; then
            changes=$(git log --no-merges -n 40 --format='- %s' "$previous..$GITHUB_SHA" -- desktop-native crates/hangar-api crates/hangar-workspace VERSION .github/workflows/native.yml)
          fi
          notes=$(cat <<'EOF'
          ## Hangar para desktop

          App nativo do Hangar para acompanhar e comandar as sessões do Claude Code, Codex e dos outros agentes direto do computador, ligado ao servidor Hangar desta máquina ou de outras.

          ### Qual arquivo baixar

          | Sistema | Arquivo |
          |---|---|
          | Windows (x64) | `Hangar-windows-x86_64.zip` |
          | macOS (Apple Silicon) | `Hangar-macos-aarch64.zip` |
          | Linux (x64) | `Hangar-linux-x86_64.tar.gz` |

          ### Como instalar

          - **Windows:** descompacte e abra `Hangar.exe`. Se o SmartScreen avisar que o app não é reconhecido, use "Mais informações" e depois "Executar assim mesmo".
          - **macOS:** descompacte e arraste `Hangar.app` para Aplicativos. Na primeira vez, abra com o botão direito e escolha "Abrir": o app não é assinado.
          - **Linux:** `tar xzf Hangar-linux-x86_64.tar.gz` e depois `./install-linux.sh`, que instala o app, o ícone e o atalho no menu.

          Instalado, o app mostra um botão de atualizar quando sai versão nova. Os binários não são assinados; confira pelo `.sha256` ao lado de cada arquivo.
          EOF
          )
          if test -n "$changes"; then
            notes+=$'\n\n'"### O que mudou"$'\n\n'"$changes"
          fi
          if [ "$tag" != native-latest ]; then
            notes+=$'\n\n'"### Canal de testes"$'\n\n'"Reescrita a cada push na branch $GITHUB_REF_NAME. O app troca para esta release quando o servidor da máquina está no canal de testes dessa branch; a versão estável é a native-latest."
          fi
          notes+=$'\n\n'"### Esta versão"$'\n\n'"Versão $version ($GITHUB_SHA). Linux: arquivo desta versão."
          for spec in 'Windows:Hangar-windows-x86_64.exe' 'macOS:Hangar-macos-aarch64'; do
            platform=${spec%%:*}
            file=${spec#*:}
            if test -f "out/$file"; then
              notes+=$'\n'"$platform: arquivo desta versão."
            else
              notes+=$'\n'"$platform: não houve arquivo desta versão; se houver arquivo nesta página, é de uma publicação anterior. Não corresponde ao manifesto desta versão."
            fi
          done
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${kind[@]}" \
                 --title "$title" \
                 --notes "$notes"
          cd out
          gh release upload "$tag" Hangar-* --repo "$GITHUB_REPOSITORY" --clobber
          # A tag fica fixa (o atualizador do app lê `native-latest` ou `native-<branch>`); o título mostra a versão publicada.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          gh release upload "$tag" native-latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null

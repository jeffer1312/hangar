# App desktop nativo (desktop-native/, Rust/GPUI): compila Linux, Windows e macOS e publica numa release FIXA
# `native-latest`, reescrita a cada push na main — o mesmo esquema do `dist-latest` do ci.yml. O app lê o
# `native-latest.json` dessa release para oferecer o "Atualizar" (desktop-native/src/update.rs).
# O canal de testes (`beta`) publica na pré-release `native-beta`, que é a que o app procura quando o servidor da
# máquina está no canal dessa branch. O manifesto mantém o nome em toda release.
# `check` (build e test em debug, Linux) roda em todo push; `build` + `publish` só na main e no canal.
# `workflow_dispatch` em outra branch compila sem publicar. Trocar o canal é trocar `beta` aqui e no server.yml.
name: Native

on:
  push:
    branches: ["**"]
    paths:
      - "desktop-native/**"
      - "crates/hangar-api/**"
      - "crates/hangar-workspace/**"
      # As versões do hangar-api vêm do [workspace.dependencies] daqui.
      - "crates/Cargo.toml"
      - "messages/**"
      - "VERSION"
      - ".github/workflows/native.yml"
  workflow_dispatch:

# Dois pushes seguidos não publicam ao mesmo tempo: o segundo espera, e a release termina no commit mais novo.
# Onde não publica, o push novo cancela a conferência do anterior.
concurrency:
  group: ${{ github.ref_name == 'main' && 'native-latest' || format('native-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'beta' }}

jobs:
  # `build` e não `check` do cargo: confere o mesmo binário e deixa as dependências no perfil que o `test` reaproveita.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: desktop-native
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: &apt-linux |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libzstd-dev rpm
      - uses: actions/cache/restore@v4
        id: cache-check
        with:
          path: &cache-check |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-native/target
          key: native-check-${{ runner.os }}-${{ hashFiles('desktop-native/Cargo.lock', 'desktop-native/rust-toolchain.toml') }}-${{ hashFiles('desktop-native/vendor/**') }}
          restore-keys: native-check-${{ runner.os }}-
      - run: cargo build --locked
      - run: cargo test --locked
      - if: &grava-check github.ref == 'refs/heads/main' && steps.cache-check.outputs.cache-hit != 'true'
        run: ../scripts/podar-target --cache target
      - uses: actions/cache/save@v4
        if: *grava-check
        with:
          path: *cache-check
          key: ${{ steps.cache-check.outputs.cache-primary-key }}

  build:
    if: github.ref_name == 'main' || github.ref_name == 'beta' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            exe: ""
            experimental: false
          # Windows e macOS nunca foram compilados antes deste workflow: falha deles não segura a release do Linux.
          - os: windows-latest
            platform: windows-x86_64
            exe: ".exe"
            experimental: true
          - os: macos-latest
            platform: macos-aarch64
            exe: ""
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
    # Perfil do cargo: a main publica o binário do usuário com o `dist` (LTO completo, uma unidade de código);
    # a pré-release de branch, com o `release` comum, que sai em minutos.
    env:
      PERFIL: ${{ github.ref == 'refs/heads/main' && 'dist' || 'release' }}
    defaults:
      run:
        working-directory: desktop-native
        shell: bash
    steps:
      # Histórico inteiro: a versão embutida é `VERSION` + número de commits, e clone raso contaria 1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: runner.os == 'Linux'
        run: *apt-linux
      # O rustup do runner lê o rust-toolchain.toml (1.98.1) no primeiro cargo. actions/cache e não rust-cache: a
      # política do repositório só libera actions do GitHub e de criadores verificados.
      # Só a main grava; as outras branches leem o dela. Cada branch gravando a própria cópia estourava o limite de
      # cache do repositório e o GitHub despejava a da main. O perfil entra na chave: com LTO as dependências saem
      # em bitcode, e o cache da main (dist) não serve à branch (release), que lê o do job `cache-release`.
      # O vendor do GPUI também: com ele igual ao do cache, o passo seguinte o reaproveita.
      - uses: actions/cache/restore@v4
        id: cache-rust
        with:
          path: &cache-native |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-native/target
          key: &chave-native native-${{ runner.os }}-${{ env.PERFIL }}-${{ hashFiles('desktop-native/Cargo.lock', 'desktop-native/rust-toolchain.toml') }}-${{ hashFiles('desktop-native/vendor/**') }}
          restore-keys: &chave-native-parcial |
            native-${{ runner.os }}-${{ env.PERFIL }}-${{ hashFiles('desktop-native/Cargo.lock', 'desktop-native/rust-toolchain.toml') }}-
            native-${{ runner.os }}-${{ env.PERFIL }}-
      # O cargo julga crate de caminho pela data dos arquivos, e o checkout novo data tudo de agora: o GPUI
      # vendorizado recompilava inteiro a cada push, com o cache achado. Só com a chave exata (vendor igual ao
      # compilado no cache) a data antiga é verdade.
      - name: Reaproveitar o vendor do cache
        if: steps.cache-rust.outputs.cache-hit == 'true'
        run: git ls-files -z vendor | xargs -0 touch -t 200001010000
      - run: cargo build --locked --profile "$PERFIL"
        env:
          # A branch embutida faz o app trocar de canal mesmo para uma versão de contagem menor (update.rs).
          HANGAR_NATIVE_CHANNEL: ${{ github.ref_name }}
      # Binário cru com nome limpo (o que o app baixa para se atualizar) + arquivo compactado para quem baixa à mão.
      # O binário cru mantém o nome usado pelo atualizador. O arquivo manual leva o lançador/ícone no Linux,
      # o executável com ícone incorporado no Windows e o pacote .app com ICNS no macOS.
      - name: Empacotar
        run: |
          name=Hangar-${{ matrix.platform }}
          bin="target/$PERFIL/hangar-native"
          mkdir -p out stage
          cp "$bin${{ matrix.exe }}" "out/$name${{ matrix.exe }}"
          case "$RUNNER_OS" in
            Linux)
              install -m755 "$bin" stage/hangar
              install -m755 tools/install-linux.sh stage/install-linux.sh
              install -m644 assets/brand/icon.png stage/icon.png
              tar -czf "out/$name.tar.gz" -C stage hangar install-linux.sh icon.png
              # .deb e .rpm abrem pela loja de programas; a versão é a mesma conta do build.rs.
              tools/package-linux.sh "$bin" "$(tr -d '[:space:]' < ../VERSION).$(git rev-list --count HEAD)" out "$name"
              ;;
            Windows) cp "$bin.exe" stage/Hangar.exe && (cd stage && 7z a -tzip "../out/$name.zip" Hangar.exe) ;;
            macOS)
              tools/package-macos.sh "$bin" stage/Hangar.app
              (cd stage && zip -qr "../out/$name.zip" Hangar.app)
              ;;
          esac
          ls -l out
      # Depois de empacotar: a poda tira o que é do app (recompila a cada push) e fica só o que o cache poupa.
      - if: &grava-native github.ref == 'refs/heads/main' && steps.cache-rust.outputs.cache-hit != 'true'
        run: ../scripts/podar-target --cache target
      - uses: actions/cache/save@v4
        if: *grava-native
        with:
          path: *cache-native
          key: ${{ steps.cache-rust.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: desktop-native/out/*
          retention-days: 1

  # O cache de release que a pré-release de branch lê. Só a main grava, e só quando as dependências, o
  # toolchain ou o vendor mudam (a chave não existe ainda); nos outros pushes o job termina na consulta.
  cache-release:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    permissions:
      contents: read
    env:
      PERFIL: release
    defaults:
      run:
        working-directory: desktop-native
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: consulta
        with:
          path: *cache-native
          key: *chave-native
          lookup-only: true
      - if: steps.consulta.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: *apt-linux
      # A base é o cache anterior do mesmo perfil: só o que mudou compila.
      - if: &falta-native steps.consulta.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: *cache-native
          key: *chave-native
          restore-keys: *chave-native-parcial
      - if: *falta-native
        run: |
          cargo build --locked --profile "$PERFIL"
          ../scripts/podar-target --cache target
      - if: *falta-native
        uses: actions/cache/save@v4
        with:
          path: *cache-native
          key: ${{ steps.consulta.outputs.cache-primary-key }}

  # Só este job escreve, como o `publica-dist` do ci.yml. Teste vermelho no `check` segura a publicação.
  publish:
    needs: [check, build]
    if: startsWith(github.ref, 'refs/heads/') && (github.ref_name == 'main' || github.ref_name == 'beta')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: out
          merge-multiple: true
      # sha256 com o NOME PURO (como o release.yml) e o manifesto calculados aqui, num sistema só, para os três
      # saírem no mesmo formato. A versão é a mesma conta do build.rs sobre o mesmo commit.
      - name: sha256 e manifesto
        run: |
          test -f out/Hangar-linux-x86_64 || { echo "sem o binário do Linux, nada a publicar"; exit 1; }
          version="$(tr -d '[:space:]' < VERSION).$(git rev-list --count HEAD)"
          cd out
          for f in Hangar-*; do sha256sum "$f" > "$f.sha256"; done
          jq -n --arg version "$version" --arg commit "$GITHUB_SHA" \
            '{version: $version, commit: $commit, files: [inputs | capture("^(?<sha>[0-9a-f]{64})  (?<name>.+)$") | {(.name): .sha}] | add}' \
            -R Hangar-*.sha256 > native-latest.json
          cat native-latest.json
      # O manifesto sobe por ÚLTIMO: até ele trocar, o app ainda vê o sha antigo e recusa o binário novo em vez de
      # instalar um par trocado. Sistema que não compilou desta vez fica com o arquivo anterior na release (build
      # instável não apaga o único binário dele) e fora do manifesto; as notas da release avisam quem baixa à mão.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version out/native-latest.json)
          # Mesma limpeza do release_tag() do desktop-native/src/update.rs: mudar uma exige mudar a outra.
          if [ "$GITHUB_REF_NAME" = main ]; then
            tag=native-latest
            title="Hangar desktop v$version"
            kind=(--latest)
          else
            tag="native-${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
            if [ "$tag" = native-latest ]; then
              echo "::error::a branch '$GITHUB_REF_NAME' vira o tag native-latest, que é a release da main; renomeie a branch"
              exit 1
            fi
            title="Hangar desktop v$version (branch $GITHUB_REF_NAME)"
            kind=(--prerelease --latest=false)
          fi
          # O commit da versão anterior vem do manifesto ainda publicado: ele só é trocado no fim deste passo.
          previous=$(gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p native-latest.json -O - | jq -r '.commit // empty') || {
            echo "::warning::manifesto anterior indisponível; as notas saem sem 'O que mudou'"
            previous=""
          }
          changes=""
          if test -n "$previous" && git cat-file -e "$previous^{commit}" 2>/dev/null; then
            changes=$(git log --no-merges -n 40 --format='- %s' "$previous..$GITHUB_SHA" -- desktop-native crates/hangar-api crates/hangar-workspace VERSION .github/workflows/native.yml)
          fi
          notes=$(cat <<'EOF'
          ## Hangar para desktop

          App nativo do Hangar para acompanhar e comandar as sessões do Claude Code, Codex e dos outros agentes direto do computador, ligado ao servidor Hangar desta máquina ou de outras.

          ### Qual arquivo baixar

          | Sistema | Arquivo |
          |---|---|
          | Windows (x64) | `Hangar-windows-x86_64.zip` |
          | macOS (Apple Silicon) | `Hangar-macos-aarch64.zip` |
          | Linux (x64) | `Hangar-linux-x86_64.deb` (Ubuntu 24.04+, Debian 13+, Mint 22+), `Hangar-linux-x86_64.rpm` (Fedora 40+, openSUSE Tumbleweed) ou `Hangar-linux-x86_64.tar.gz` (glibc 2.39 ou mais nova) |

          ### Como instalar

          - **Windows:** descompacte e abra `Hangar.exe`. Se o SmartScreen avisar que o app não é reconhecido, use "Mais informações" e depois "Executar assim mesmo".
          - **macOS:** descompacte e arraste `Hangar.app` para Aplicativos. Na primeira vez, abra com o botão direito e escolha "Abrir": o app não é assinado.
          - **Linux:** abra o `.deb` ou o `.rpm` com dois cliques (a loja de programas instala). Quem prefere o terminal: `tar xzf Hangar-linux-x86_64.tar.gz` e depois `./install-linux.sh`.

          Instalado, o app mostra um botão de atualizar quando sai versão nova. Os binários não são assinados; confira pelo `.sha256` ao lado de cada arquivo.
          EOF
          )
          if test -n "$changes"; then
            notes+=$'\n\n'"### O que mudou"$'\n\n'"$changes"
          fi
          if [ "$tag" != native-latest ]; then
            notes+=$'\n\n'"### Canal de testes"$'\n\n'"Reescrita a cada push na branch $GITHUB_REF_NAME. O app troca para esta release quando o servidor da máquina está no canal de testes dessa branch; a versão estável é a native-latest."
          fi
          notes+=$'\n\n'"### Esta versão"$'\n\n'"Versão $version ($GITHUB_SHA). Linux: arquivo desta versão."
          for spec in 'Windows:Hangar-windows-x86_64.exe' 'macOS:Hangar-macos-aarch64'; do
            platform=${spec%%:*}
            file=${spec#*:}
            if test -f "out/$file"; then
              notes+=$'\n'"$platform: arquivo desta versão."
            else
              notes+=$'\n'"$platform: não houve arquivo desta versão; se houver arquivo nesta página, é de uma publicação anterior. Não corresponde ao manifesto desta versão."
            fi
          done
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${kind[@]}" \
                 --title "$title" \
                 --notes "$notes"
          cd out
          gh release upload "$tag" Hangar-* --repo "$GITHUB_REPOSITORY" --clobber
          # A tag fica fixa (o atualizador do app lê `native-latest` ou `native-<branch>`); o título mostra a versão publicada.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          gh release upload "$tag" native-latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null

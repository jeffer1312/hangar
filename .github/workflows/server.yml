# hangar-server e hangar-cano (crates/, Rust). Testar e publicar são jobs separados, em paralelo:
# - `test` (cargo test em debug + suítes Python do runtime) roda em todo push e PR que toque estes caminhos.
# - `build` + `publish` só na main e no canal de testes. A main compila Linux, Windows e macOS e publica na release
#   FIXA `server-latest`, cujo `server-latest.json` o instalador e a atualização leem para conferir o sha256 de cada
#   binário. O canal compila Linux e Windows e publica na pré-release `server-<branch>` (fora de [A-Za-z0-9._-] vira
#   `-`), que o backend/app/rust_release.py procura quando o checkout está nessa branch.
# Canal de testes hoje: hangar-server-parte1. Trocar o canal é trocar esse nome aqui e no native.yml.
# `workflow_dispatch` em outra branch compila Linux e Windows sem publicar, para conferir o build de release.
name: Server

on:
  push:
    branches: ["**"]
    paths: &paths
      - "crates/**"
      - "backend/tests/fixtures/**"
      # A suíte de contrato do cano roda aqui contra o binário: mudar o cano.py ou ela também testa o Rust.
      - "backend/app/adapters/claude_headless/cano.py"
      - "backend/tests/test_claude_headless_cano.py"
      - "backend/app/runtime_process.py"
      - "backend/app/runtime_terminal.py"
      - "backend/app/runtime_coordinator.py"
      - "backend/app/rust_server.py"
      - "backend/tests/test_runtime_process.py"
      - "backend/tests/test_runtime_queue_terminal_v2.py"
      - "backend/tests/test_runtime_terminal_fix*.py"
      - "backend/tests/test_runtime_terminal_failure_policy.py"
      - "backend/tests/test_runtime_final_fixes.py"
      - "plugins/hangar/hooks/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

# Dois pushes seguidos não publicam ao mesmo tempo: o segundo espera, e a release termina no commit mais novo.
# Onde não publica, o push novo cancela a conferência do anterior.
concurrency:
  group: server-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'hangar-server-parte1' }}

jobs:
  # Testes em debug, não no perfil publicado: com LTO fat cada binário de teste passaria pela otimização do programa
  # inteiro. Correm ao lado do `build`; o manifesto leva todo sistema que compilou, como antes da separação.
  # PR de branch deste repositório já roda pelo push; aqui só os de fork.
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        # macOS só na main: as máquinas do canal de testes são Linux e Windows.
        os: ${{ fromJSON(github.ref_name == 'main' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # Falha de Windows ou macOS não segura a release do Linux.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates
        shell: bash
    env:
      # Sem incremental e sem debuginfo: encolhem o target que vai ao cache, e o CI não usa nenhum dos dois.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Preparar terminal no macOS
        if: runner.os == 'macOS'
        run: |
          brew install tmux
          # Darwin exige o alias para o teste de bind público distinto do loopback privado.
          sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Conferir tmux nos testes Unix
        if: runner.os != 'Windows'
        run: tmux -V
      # O rustup do runner lê o crates/rust-toolchain.toml (1.98.1) no primeiro cargo.
      # Só a main e o canal gravam cache: cópia por branch estourava os 10 GB do repositório e o GitHub despejava
      # justamente as da main. As outras branches leem o da main.
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: server-test-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'crates/rust-toolchain.toml') }}
          restore-keys: server-test-${{ runner.os }}-
      # Os testes do hangar-api leem as amostras de backend/tests/fixtures/, que vêm no mesmo checkout.
      - run: cargo test --locked --workspace
      - if: steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'hangar-server-parte1')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - working-directory: backend
        run: uv sync
      - name: Contenção e regressões da entrega terminal
        working-directory: backend
        run: uv run pytest tests/test_runtime_process.py tests/test_runtime_queue_terminal_v2.py tests/test_runtime_terminal_fix.py tests/test_runtime_terminal_fix2.py tests/test_runtime_terminal_failure_policy.py tests/test_runtime_final_fixes.py -q

  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'hangar-server-parte1'))
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.ref_name == 'main' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates
        shell: bash
    env:
      PLATFORM: ${{ fromJSON('{"ubuntu-latest":"linux-x86_64","windows-latest":"windows-x86_64","macos-latest":"macos-aarch64"}')[matrix.os] }}
      EXE: ${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      # glibc 2.28 via cargo-zigbuild: o gnu comum do ubuntu-latest exige a glibc do runner e não abre em
      # sistema mais antigo (Debian 10/11, RHEL 8). O zigbuild linka contra a 2.28 e mantém o alocador do gnu.
      ZIGBUILD: ${{ matrix.os == 'ubuntu-latest' }}
      BINDIR: ${{ matrix.os == 'ubuntu-latest' && 'target/x86_64-unknown-linux-gnu/release' || 'target/release' }}
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: server-release-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'crates/rust-toolchain.toml') }}
          restore-keys: server-release-${{ runner.os }}-
      # Zig e cargo-zigbuild baixados prontos, conferidos pelo sha256 publicado por cada projeto: o repositório só
      # libera actions da GitHub, de criador verificado e o setup-uv, e o `cargo install` compilava a cada rodada.
      - if: env.ZIGBUILD == 'true'
        run: |
          rustup target add x86_64-unknown-linux-gnu
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo /tmp/zig-x86_64-linux-0.16.0 >> "$GITHUB_PATH"
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/zigbuild.tar.xz https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.23.4/cargo-zigbuild-x86_64-unknown-linux-gnu.tar.xz
          echo "6b69963040818ca1ef573d8135a95aa902e17cf7f873c32c6426642dadfe7f59  /tmp/zigbuild.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zigbuild.tar.xz -C /tmp
          install -m755 /tmp/cargo-zigbuild-x86_64-unknown-linux-gnu/cargo-zigbuild ~/.cargo/bin/
      # O sufixo .2.28 fixa a glibc mínima; o diretório de saída continua sem ele (target/<triplo>/release).
      - run: |
          if [ "$ZIGBUILD" = true ]; then
            cargo zigbuild --locked --release --workspace --target x86_64-unknown-linux-gnu.2.28
          else
            cargo build --locked --release --workspace
          fi
        env:
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      - if: steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # Guarda: se o zigbuild deixar de fixar a glibc, o binário passa a exigir mais que o prometido.
      - name: glibc máxima exigida
        if: env.ZIGBUILD == 'true'
        run: |
          for bin in hangar-server hangar-cano; do
            top=$(objdump -T "$BINDIR/$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$bin exige $top"
            test "$(printf '%s\n' "$top" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28
          done
      # A suíte de contrato do cano contra o binário que vai ser publicado. Só no Linux: é o único
      # lugar em que ela roda contra o hangar-cano (o ci.yml não compila Rust). Setup igual ao do ci.yml.
      - if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - if: runner.os == 'Linux'
        working-directory: backend
        run: uv sync
      - name: Contrato do cano contra o hangar-cano
        if: runner.os == 'Linux'
        working-directory: backend
        run: |
          # Sem o binário a suíte pula os casos Rust e sairia verde: aqui a falta é erro.
          test -x "$GITHUB_WORKSPACE/crates/$BINDIR/hangar-cano"
          CP_RUST_CANO_BIN=$GITHUB_WORKSPACE/crates/$BINDIR/hangar-cano uv run pytest tests/test_claude_headless_cano.py
      - name: Empacotar
        run: |
          mkdir -p out
          for bin in hangar-server hangar-cano; do
            cp "$BINDIR/$bin$EXE" "out/$bin-$PLATFORM$EXE"
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ env.PLATFORM }}
          path: crates/out/*
          retention-days: 1

  # Só este job escreve.
  publish:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/heads/') && (github.ref_name == 'main' || github.ref_name == 'hangar-server-parte1')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: out
          merge-multiple: true
      # Chave `<plataforma>/<bin>` sem `.exe`; o `name` é o asset exato a baixar.
      - name: sha256 e manifesto
        working-directory: out
        run: |
          for need in hangar-server-linux-x86_64 hangar-cano-linux-x86_64; do
            test -f "$need" || { echo "sem $need, nada a publicar"; exit 1; }
          done
          files='{}'
          for f in hangar-server-* hangar-cano-*; do
            base=${f%.exe}
            case "$base" in hangar-server-*) bin=hangar-server ;; *) bin=hangar-cano ;; esac
            platform=${base#"$bin"-}
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            files=$(jq --arg k "$platform/$bin" --arg n "$f" --arg s "$sha" '.[$k] = {name: $n, sha256: $s}' <<<"$files")
          done
          jq -n --arg commit "$GITHUB_SHA" --argjson files "$files" '{commit: $commit, files: $files}' > server-latest.json
          cat server-latest.json
      # O manifesto sobe por ÚLTIMO: até ele trocar, quem baixa ainda vê o sha antigo e recusa o binário novo em vez
      # de usar um par trocado. Sistema que não compilou desta vez fica com o arquivo anterior e fora do manifesto.
      - working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mesma limpeza do release_tag() do backend/app/rust_release.py: mudar uma exige mudar a outra.
          if [ "$GITHUB_REF_NAME" = main ]; then
            tag=server-latest
            criar=(--title 'hangar-server e hangar-cano (topo da main)'
                   --notes 'Reescrita a cada push na main. O instalador e a atualização do Hangar baixam daqui e conferem o sha256 pelo server-latest.json.')
          else
            tag="server-${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
            if [ "$tag" = server-latest ]; then
              echo "::error::a branch '$GITHUB_REF_NAME' vira o tag server-latest, que é a release da main; renomeie a branch"
              exit 1
            fi
            criar=(--prerelease --title "hangar-server e hangar-cano (branch $GITHUB_REF_NAME)"
                   --notes "Reescrita a cada push na branch $GITHUB_REF_NAME. A atualização baixa daqui quando o checkout está nessa branch.")
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false "${criar[@]}"
          gh release upload "$tag" hangar-server-* hangar-cano-* --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$tag" server-latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null

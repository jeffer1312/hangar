# hangar-server e hangar-cano (crates/, Rust): testa e compila Linux, Windows e macOS e publica numa release FIXA
# `server-latest`, reescrita a cada push na main, como o `native-latest` do native.yml. O instalador e a atualização
# leem o `server-latest.json` dessa release e conferem o sha256 de cada binário antes de usar.
# Push em outra branch publica na pré-release `server-<branch>` (fora de [A-Za-z0-9._-] vira `-`), que é a que o
# backend/app/rust_release.py procura quando o checkout está nessa branch. O manifesto mantém o nome em toda release.
name: Server

on:
  push:
    branches: ["**"]
    paths:
      - "crates/**"
      - "backend/tests/fixtures/**"
      # A suíte de contrato do cano roda aqui contra o binário: mudar o cano.py ou ela também testa o Rust.
      - "backend/app/adapters/claude_headless/cano.py"
      - "backend/tests/test_claude_headless_cano.py"
      - "backend/app/runtime_process.py"
      - "backend/app/runtime_terminal.py"
      - "backend/app/runtime_coordinator.py"
      - "backend/app/rust_server.py"
      - "backend/tests/test_runtime_process.py"
      - "backend/tests/test_runtime_queue_terminal_v2.py"
      - "backend/tests/test_runtime_terminal_fix*.py"
      - "backend/tests/test_runtime_terminal_failure_policy.py"
      - "backend/tests/test_runtime_final_fixes.py"
      - "plugins/hangar/hooks/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

# Dois pushes seguidos não publicam ao mesmo tempo: o segundo espera, e a release termina no commit mais novo.
concurrency:
  group: ${{ github.ref_name == 'main' && 'server-latest' || format('server-{0}', github.ref_name) }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.28 via cargo-zigbuild: o gnu comum do ubuntu-latest exige a glibc do runner e não abre em
          # sistema mais antigo (Debian 10/11, RHEL 8). O zigbuild linka contra a 2.28 e mantém o alocador do gnu.
          - os: ubuntu-latest
            platform: linux-x86_64
            exe: ""
            target: x86_64-unknown-linux-gnu
            zigbuild: true
            bindir: target/x86_64-unknown-linux-gnu/release
            experimental: false
          # Como no native.yml: falha de Windows ou macOS não segura a release do Linux.
          - os: windows-latest
            platform: windows-x86_64
            exe: ".exe"
            target: ""
            bindir: target/release
            experimental: true
          - os: macos-latest
            platform: macos-aarch64
            exe: ""
            target: ""
            bindir: target/release
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    # Target enxuto no cache: o incremental não serve entre runs e a depuração completa inchava o do
    # Windows a ponto de o GitHub despejar o do Linux pelo limite do repositório.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    # Escreve porque cada sistema publica no fim do próprio build; sem o token do git no checkout, o cargo
    # test e os build scripts não alcançam essa escrita.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: crates
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Preparar CLI Codex para os contratos de contas
        run: |
          npm install --global @openai/codex@0.161.0
          codex --version
      - name: Preparar terminal no macOS
        if: runner.os == 'macOS'
        run: |
          brew install tmux
          # Darwin exige o alias para o teste de bind público distinto do loopback privado.
          sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Conferir tmux nos testes Unix
        if: runner.os != 'Windows'
        run: tmux -V
      # O rustup do runner lê o crates/rust-toolchain.toml (1.98.1) no primeiro cargo.
      # Só a main grava (o passo `cache/save` lá embaixo); as outras branches leem o dela. Cada branch
      # gravando a própria cópia estourava o limite de cache do repositório e o GitHub despejava a da main.
      - uses: actions/cache/restore@v4
        id: cache-rust
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: server-v2-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'crates/rust-toolchain.toml') }}
          restore-keys: server-v2-${{ runner.os }}-
      # Os testes do hangar-api leem as amostras de backend/tests/fixtures/, que vêm no mesmo checkout.
      - run: cargo test --locked --workspace
      - if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      # Zig baixado direto (sha256 do index.json do ziglang.org): o repositório só libera actions da GitHub,
      # de criador verificado e o setup-uv, e uma action fora da lista derruba o workflow antes de começar.
      - if: matrix.zigbuild
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo /tmp/zig-x86_64-linux-0.16.0 >> "$GITHUB_PATH"
      - if: matrix.zigbuild
        run: cargo install cargo-zigbuild --locked --version =0.23.4
      # O sufixo .2.28 fixa a glibc mínima; o diretório de saída continua sem ele (target/<triplo>/release).
      - run: cargo ${{ matrix.zigbuild && 'zigbuild' || 'build' }} --locked --release --workspace ${{ matrix.target && format('--target {0}{1}', matrix.target, matrix.zigbuild && '.2.28' || '') || '' }}
        env:
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.cache-rust.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ steps.cache-rust.outputs.cache-primary-key }}
      # Guarda: se o zigbuild deixar de fixar a glibc, o binário passa a exigir mais que o prometido.
      - name: glibc máxima exigida
        if: matrix.zigbuild
        run: |
          for bin in hangar-server hangar-cano; do
            top=$(objdump -T "${{ matrix.bindir }}/$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$bin exige $top"
            test "$(printf '%s\n' "$top" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28
          done
      # A suíte de contrato do cano contra o binário que vai ser publicado. Só no Linux: é o único
      # lugar em que ela roda contra o hangar-cano (o ci.yml não compila Rust). Setup igual ao do ci.yml.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - working-directory: backend
        run: uv sync
      - name: Contenção e regressões da entrega terminal
        working-directory: backend
        run: uv run pytest tests/test_runtime_process.py tests/test_runtime_queue_terminal_v2.py tests/test_runtime_terminal_fix.py tests/test_runtime_terminal_fix2.py tests/test_runtime_terminal_failure_policy.py tests/test_runtime_final_fixes.py -q
      - name: Contrato do cano contra o hangar-cano
        if: matrix.platform == 'linux-x86_64'
        working-directory: backend
        run: |
          # Sem o binário a suíte pula os casos Rust e sairia verde: aqui a falta é erro.
          test -x "$GITHUB_WORKSPACE/crates/${{ matrix.bindir }}/hangar-cano"
          CP_RUST_CANO_BIN=$GITHUB_WORKSPACE/crates/${{ matrix.bindir }}/hangar-cano uv run pytest tests/test_claude_headless_cano.py
      - name: Empacotar
        run: |
          mkdir -p out
          for bin in hangar-server hangar-cano; do
            cp "${{ matrix.bindir }}/$bin${{ matrix.exe }}" "out/$bin-${{ matrix.platform }}${{ matrix.exe }}"
          done
          ls -l out
      # Cada sistema publica assim que o PRÓPRIO build passa: o Linux não espera Windows e macOS. Build que falha não
      # publica nada, e a release segue com o binário e a entrada anteriores daquele sistema.
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/heads/')
        working-directory: crates/out
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Mesma limpeza do release_tag() do backend/app/rust_release.py: mudar uma exige mudar a outra.
          if [ "$GITHUB_REF_NAME" = main ]; then
            tag=server-latest
            criar=(--title 'hangar-server e hangar-cano (topo da main)'
                   --notes 'Reescrita a cada push na main. O instalador e a atualização do Hangar baixam daqui e conferem o sha256 pelo server-latest.json.')
          else
            tag="server-${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
            if [ "$tag" = server-latest ]; then
              echo "::error::a branch '$GITHUB_REF_NAME' vira o tag server-latest, que é a release da main; renomeie a branch"
              exit 1
            fi
            criar=(--prerelease --title "hangar-server e hangar-cano (branch $GITHUB_REF_NAME)"
                   --notes "Reescrita a cada push na branch $GITHUB_REF_NAME. A atualização baixa daqui quando o checkout está nessa branch.")
          fi
          # Dois sistemas podem achar a release ausente ao mesmo tempo: se o create falha, vale a que o outro criou.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false "${criar[@]}" \
            || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          protocol=$(sed -n 's/^pub const INTERNAL_PROTOCOL: u32 = \([0-9][0-9]*\);.*/\1/p' ../hangar-server/src/lib.rs)
          test -n "$protocol" || { echo "::error::INTERNAL_PROTOCOL não encontrado em crates/hangar-server/src/lib.rs"; exit 1; }
          gh release upload "$tag" hangar-server-* hangar-cano-* --repo "$GITHUB_REPOSITORY" --clobber
          python - "$tag" "$PLATFORM" "$protocol" <<'EOF'
          import hashlib, json, os, pathlib, random, shutil, subprocess, sys, time

          tag, plat, protocol = sys.argv[1:]
          repo, sha = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]
          LATEST = "server-latest.json"

          def gh(*args):
              subprocess.run(["gh", *args, "--repo", repo], check=True)

          def put(path, data):
              path.write_bytes(json.dumps(data, indent=2, sort_keys=True).encode())
              gh("release", "upload", tag, str(path), "--clobber")

          # A fonte de cada sistema é o server-<sistema>.json, que só o job dele grava; o server-latest.json é
          # composto das fontes e continua no formato que o instalador e o rust_release.py leem.
          files = {}
          for f in sorted(pathlib.Path().glob("hangar-*")):
              name = "hangar-server" if f.name.startswith("hangar-server-") else "hangar-cano"
              files[f"{plat}/{name}"] = {"name": f.name, "sha256": hashlib.sha256(f.read_bytes()).hexdigest()}
          put(pathlib.Path(f"server-{plat}.json"),
              {"platform": plat, "commit": sha, "protocol": int(protocol), "files": files})

          def read():
              d = pathlib.Path("lido")
              shutil.rmtree(d, ignore_errors=True)
              gh("release", "download", tag, "--pattern", "server-*.json", "--dir", str(d))
              latest = d / LATEST
              old = json.loads(latest.read_bytes()) if latest.exists() else {}
              return old, {p.name: p.read_bytes() for p in sorted(d.glob("server-*.json")) if p.name != LATEST}

          out = pathlib.Path(LATEST)
          for attempt in range(12):
              if attempt:
                  time.sleep(random.uniform(2, 8))
              old, raw = read()
              # Semente primeiro: a fonte do próprio sistema, quando existe, vale por cima dela.
              by_plat = {}
              for n, b in sorted(raw.items(), key=lambda kv: not kv[0].startswith("server-seed-")):
                  s = json.loads(b)
                  by_plat[s["platform"]] = s
              sources = list(by_plat.values())
              # Fonte nunca é apagada: sistema do manifesto sem fonte na leitura é outro job no meio do --clobber
              # dela (apaga e sobe), e compor agora o tiraria da release.
              if set(old.get("platforms", {})) - set(by_plat):
                  continue
              # Manifesto de antes das fontes (sem `platforms`): o sistema que ainda não publicou ganha uma semente
              # com a entrada que ele já tinha, para não sair da release. Ela tem nome próprio para nunca sobrescrever
              # a fonte que o job do sistema grava, e toda regravação do manifesto vem depois dela.
              seeds = set() if "platforms" in old else {k.split("/")[0] for k in old.get("files", {})} - set(by_plat)
              for p in sorted(seeds):
                  try:
                      put(pathlib.Path(f"server-seed-{p}.json"),
                          {"platform": p, "commit": old.get("commit"), "protocol": None,
                           "files": {k: v for k, v in old["files"].items() if k.startswith(p + "/")}})
                  except subprocess.CalledProcessError:
                      pass   # outro sistema gravando a mesma semente; a releitura confere
              if seeds:
                  continue
              merged = {"commit": sha, "files": {}, "platforms": {}}
              for s in sources:
                  merged["files"].update(s["files"])
                  entry = {"commit": s["commit"]}
                  if s["protocol"] is not None:   # semente: quem lê busca o protocolo pelo commit
                      entry["protocol"] = s["protocol"]
                  merged["platforms"][s["platform"]] = entry
              try:
                  put(out, merged)
              except subprocess.CalledProcessError:
                  continue   # outro sistema regravando o manifesto no mesmo instante
              # Se nenhuma fonte mudou entre a leitura e a gravação, quem chegar depois compõe por cima com a fonte
              # dele; se mudou, esta gravação pode ter deixado outro sistema de fora e é refeita.
              if read()[1] == raw:
                  print(out.read_text())
                  break
          else:
              sys.exit(f"{LATEST} não estabilizou")
          EOF
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null

  # Windows e macOS têm continue-on-error para a falha de build deles não segurar o Linux; publicação que falhou
  # depois de começar (binário novo com manifesto velho) não pode passar calada por isso.
  publish-check:
    needs: build
    if: always() && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(any(.steps[]?; .name == "Publicar na release" and .conclusion == "failure")) | .name')
          if [ -n "$failed" ]; then
            echo "::error::publicação falhou em: $failed"
            exit 1
          fi

# hangar-server e hangar-cano (crates/, Rust): testa e compila Linux e Windows e publica numa release FIXA
# `server-latest`, reescrita a cada push na main, como o `native-latest` do native.yml. O instalador e a atualização
# leem o `server-latest.json` dessa release e conferem o sha256 de cada binário antes de usar.
# O canal de testes (`beta`) publica na pré-release `server-beta`, que é a que o backend/app/rust_release.py procura
# quando o checkout está nessa branch. O manifesto mantém o nome em toda release.
# As outras branches só testam: sem build de release, sem publicar. `workflow_dispatch` nelas compila sem publicar.
# Trocar o canal é trocar `beta` aqui, no native.yml e nos *-macos.yml.
# Os jobs estão no server-jobs.yml. O macOS roda à parte, no server-macos.yml, depois que este run termina: nada
# daqui nem o Package (que dispara no fim deste run) esperam por ele.
name: Server

on:
  push:
    branches: ["**"]
    paths:
      - "crates/**"
      - "backend/tests/fixtures/**"
      # A suíte de contrato do cano roda aqui contra o binário: mudar o cano.py ou ela também testa o Rust.
      - "backend/app/adapters/claude_headless/cano.py"
      - "backend/tests/test_claude_headless_cano.py"
      - "backend/app/runtime_process.py"
      - "backend/app/runtime_terminal.py"
      - "backend/app/runtime_coordinator.py"
      - "backend/app/rust_server.py"
      - "backend/tests/test_runtime_process.py"
      - "backend/tests/test_runtime_queue_terminal_v2.py"
      - "backend/tests/test_runtime_terminal_fix*.py"
      - "backend/tests/test_runtime_terminal_failure_policy.py"
      - "backend/tests/test_runtime_final_fixes.py"
      # Trava e leitura dos sidecars que o Rust também grava: o defeito que elas evitam é do Windows.
      - "backend/app/atomico.py"
      - "backend/app/adapters/claude_headless/sessions.py"
      - "backend/app/adapters/codex/sessions.py"
      - "backend/tests/test_sidecar_coordination.py"
      - "plugins/hangar/hooks/**"
      - ".github/workflows/server.yml"
      - ".github/workflows/server-jobs.yml"
  workflow_dispatch:

# Na main e no canal cada run tem o próprio grupo: quem cancela o run que um push novo substituiu são os jobs de
# teste e de build (concorrência por job, no server-jobs.yml); o `publish` nunca é cancelado no meio do upload.
# Onde não publica, o push novo cancela o run anterior inteiro.
concurrency:
  group: ${{ (github.ref_name == 'main' || github.ref_name == 'beta') && format('server-run-{0}', github.run_id) || format('server-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'beta' }}

jobs:
  server:
    uses: ./.github/workflows/server-jobs.yml
    permissions:
      contents: write
      actions: write
    with:
      branch: ${{ github.ref_name }}
      # glibc 2.28 via cargo-zigbuild: o gnu comum do ubuntu-latest exige a glibc do runner e não abre em
      # sistema mais antigo (Debian 10/11, RHEL 8). O zigbuild linka contra a 2.28 e mantém o alocador do gnu.
      # Falha do Windows não segura a release do Linux.
      sistemas: >-
        [
          {"os": "ubuntu-latest", "platform": "linux-x86_64", "exe": "", "target": "x86_64-unknown-linux-gnu",
           "zigbuild": true, "dir": "target/x86_64-unknown-linux-gnu", "experimental": false},
          {"os": "windows-latest", "platform": "windows-x86_64", "exe": ".exe", "target": "", "zigbuild": false,
           "dir": "target", "experimental": true}
        ]
      cache_release: >-
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "zigbuild": true},
          {"os": "windows-latest", "target": "", "zigbuild": false}
        ]

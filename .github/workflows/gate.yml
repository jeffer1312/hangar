# Portão de merge: um check só, `merge-gate`. Barra o pull request que descumpre uma regra do CLAUDE.md que a máquina
# consegue conferir e o que não compila ou quebra um teste do que ele mudou: crates mudados e os que dependem deles
# (o hangar-server em fatias paralelas), o desktop inteiro e os testes do Expo ligados aos arquivos mudados. As suítes
# inteiras rodam no push da main e do canal (server.yml, server-windows.yml, native.yml e o mobile-suite daqui).
# As regras que saem do diff estão em scripts/check-*; as que são teste, em scripts/rule-tests.py. Parte que o PR não
# toca (scripts/gate-areas.py) é pulada; parte acionada precisa terminar verde.
name: Portão

on:
  pull_request:
  push:
    branches: [main, beta]

# Push novo no PR substitui o run anterior; na main e no canal cada push tem o próprio.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gate-pr-{0}', github.event.pull_request.number) || format('gate-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  areas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      server: ${{ steps.areas.outputs.server }}
      native: ${{ steps.areas.outputs.native }}
      mobile: ${{ steps.areas.outputs.mobile }}
      rust_packages: ${{ steps.areas.outputs.rust_packages }}
      rust_server: ${{ steps.areas.outputs.rust_server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Sem base com que comparar (primeiro push da branch, histórico reescrito): tudo roda.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || ! git merge-base "$BASE" "$HEAD_SHA" >/dev/null; then
            echo "sem base comparável; todas as partes rodam"
            python3 -I scripts/gate-areas.py --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # Sem `--no-renames` a mudança de pasta só traz o destino, e a área de onde o arquivo saiu não roda.
          git diff --no-renames --name-only "$BASE...$HEAD_SHA" > "$RUNNER_TEMP/mudados"
          echo "arquivos mudados: $(wc -l < "$RUNNER_TEMP/mudados")"
          python3 -I scripts/gate-areas.py < "$RUNNER_TEMP/mudados" | tee -a "$GITHUB_OUTPUT"

  # As regras que se conferem pelo diff, sem compilar, e a trava de texto da interface.
  regras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # O commit do PR, não o merge: com a base atrasada, o merge traria commits alheios (e as marcas deles).
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Sem base com que comparar (primeiro push da branch, histórico reescrito) não há diff a conferir.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null && git merge-base "$BASE" HEAD >/dev/null; then
            echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::sem base comparável; as regras do diff não foram conferidas"
          fi
      - run: python3 -I scripts/test_check_rules.py
      - name: Regras do diff
        if: always() && steps.base.outputs.sha != ''
        run: python3 -I scripts/check-rules.py "${{ steps.base.outputs.sha }}" "$HEAD_SHA"
      # Mudança em instalador/script sem passo declarado em docs/atualizacoes/. O pre-commit faz o mesmo por commit,
      # mas é pulável e some no clone; aqui é o intervalo inteiro do push.
      - name: Passo de atualização
        if: always() && steps.base.outputs.sha != ''
        run: bash scripts/check-passo-de-atualizacao.sh "${{ steps.base.outputs.sha }}..$HEAD_SHA"
      # Mudança na API que o app nativo consome sem subir o CLIENT_API (no PR, contra a base).
      - name: CLIENT_API
        if: always() && steps.base.outputs.sha != ''
        run: bash scripts/check-client-api.sh "${{ steps.base.outputs.sha }}..$HEAD_SHA"
      # Mudança visível no app sem novidade em docs/novidades/: só avisa, nunca falha.
      - name: novidade
        if: always() && steps.base.outputs.sha != ''
        continue-on-error: true
        run: bash scripts/check-novidade.sh "${{ steps.base.outputs.sha }}..$HEAD_SHA" || true
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace=@hangar/core --workspace=frontend
        if: always()
      - name: Texto da interface e blocos <hangar-ref>
        if: always()
        run: python3 -I scripts/rule-tests.py frontend

  server:
    needs: areas
    if: needs.areas.outputs.server == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # O que os testes do servidor chamam: python3 do cano, CLI do Codex dos contratos de contas e tmux.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Mesma versão do server-jobs.yml.
      - run: npm install --global @openai/codex@0.161.0
      - run: tmux -V
      # Só lê o cache dos testes, que o server-jobs.yml grava na main: mesmos caminhos e mesma chave de lá.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target/debug
          key: server-v3-${{ runner.os }}-${{ runner.arch }}-dev-${{ hashFiles('crates/Cargo.lock', 'crates/rust-toolchain.toml') }}
          restore-keys: server-v3-${{ runner.os }}-${{ runner.arch }}-dev-
      - run: python3 -I scripts/rule-tests.py server
      - name: Testes dos crates mudados e dos que dependem deles
        if: ${{ !cancelled() }}
        env:
          PACOTES: ${{ needs.areas.outputs.rust_packages }}
        run: python3 -I scripts/rust-pr-tests.py rest $PACOTES

  # Os testes do hangar-server levam a maior parte da suíte: três máquinas, cada uma com um terço.
  server-tests:
    needs: areas
    if: needs.areas.outputs.rust_server == 'true' && github.event_name == 'pull_request'
    name: server-tests (${{ matrix.fatia }}/3)
    strategy:
      fail-fast: false
      matrix:
        fatia: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # O que os testes do servidor chamam: python3 do cano, CLI do Codex dos contratos de contas e tmux.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Mesma versão do server-jobs.yml.
      - run: npm install --global @openai/codex@0.161.0
      - run: tmux -V
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target/debug
          key: server-v3-${{ runner.os }}-${{ runner.arch }}-dev-${{ hashFiles('crates/Cargo.lock', 'crates/rust-toolchain.toml') }}
          restore-keys: server-v3-${{ runner.os }}-${{ runner.arch }}-dev-
      - run: python3 -I scripts/rust-pr-tests.py server ${{ matrix.fatia }} 3

  native:
    needs: areas
    if: needs.areas.outputs.native == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: desktop-native
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Mesma lista do build do native-build.yml.
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libzstd-dev rpm
      # Só lê o cache que o native-check.yml grava na main: mesmos caminhos e mesma chave de lá.
      - uses: actions/cache/restore@v4
        id: cache-check
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-native/target
          key: native-check-${{ runner.os }}-${{ hashFiles('desktop-native/Cargo.lock', 'desktop-native/rust-toolchain.toml') }}-${{ hashFiles('desktop-native/vendor/**') }}
          restore-keys: native-check-${{ runner.os }}-
      # Mesmo motivo do passo de igual nome no native-build.yml: sem isto o GPUI vendorizado recompilava a cada push.
      - name: Reaproveitar o vendor do cache
        if: steps.cache-check.outputs.cache-hit == 'true'
        run: git ls-files -z vendor | xargs -0 touch -t 200001010000
      - run: python3 -I ../scripts/rule-tests.py native
      # A suíte do desktop inteira: as travas acima já compilaram os testes dela.
      - if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast

  mobile:
    needs: areas
    if: needs.areas.outputs.mobile == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      # O app lê o @hangar/core pelos caminhos do workspace; as dependências dele vêm do lockfile próprio.
      - run: npm ci --workspace=@hangar/core --workspace=frontend
      - run: npm ci --prefix mobile
      # As mensagens compiladas não vêm no repositório: sem elas o typecheck do app não acha as chaves.
      - run: npm run i18n:compile -w @hangar/core
      - run: npm run i18n:compile --prefix mobile
      - run: python3 -I scripts/rule-tests.py mobile
      - run: npm run check:app
        if: ${{ !cancelled() }}
      # Os testes ligados aos arquivos do app que o PR muda. Dependência, configuração, core ou mensagens
      # mudados valem para o app inteiro: não há "relacionado" a eles.
      - name: Testes do que mudou no app
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tudo=0 app=()
          git diff --no-renames --name-only "$BASE...$HEAD_SHA" > "$RUNNER_TEMP/mudados"
          while IFS= read -r f; do
            case "$f" in
              mobile/package.json|mobile/package-lock.json|mobile/tsconfig*.json|mobile/vitest*.ts|mobile/babel.config.js|\
              mobile/metro.config.js|mobile/app.json|mobile/eas.json|mobile/plugins/*|packages/core/*|messages/*|\
              project.inlang/*|package.json|package-lock.json|.node-version|scripts/i18n-compile.mjs|scripts/verificar-app.mjs) tudo=1 ;;
              mobile/*)
                [ -f "$f" ] || continue
                app+=("$GITHUB_WORKSPACE/$f")
                # Teste que lê o arquivo sem importá-lo (readFileSync) fica fora do grafo do `related`.
                while IFS= read -r t; do app+=("$GITHUB_WORKSPACE/$t"); done < <(grep -rlF --include='*.test.*' "$(basename "$f")" mobile/src || true) ;;
            esac
          done < "$RUNNER_TEMP/mudados"
          if (( tudo )); then
            npm run test:app
          elif (( ${#app[@]} )); then
            cd mobile && npx vitest related --run --passWithNoTests "${app[@]}"
          else
            echo "nenhum arquivo do app mudou"
          fi

  # A suíte do app inteiro, que nenhum outro workflow roda: só no push, o PR não espera por ela.
  mobile-suite:
    needs: areas
    if: needs.areas.outputs.mobile == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      # O app lê o @hangar/core pelos caminhos do workspace; as dependências dele vêm do lockfile próprio.
      - run: npm ci --workspace=@hangar/core --workspace=frontend
      - run: npm ci --prefix mobile
      # As mensagens compiladas não vêm no repositório: sem elas o typecheck do app não acha as chaves.
      - run: npm run i18n:compile -w @hangar/core
      - run: npm run i18n:compile --prefix mobile
      - run: npm run check:app
      - run: npm run test:app

  merge-gate:
    needs: [areas, regras, server, server-tests, native, mobile, mobile-suite]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          AREAS: ${{ needs.areas.result }}
          REGRAS: ${{ needs.regras.result }}
          SERVER_ON: ${{ needs.areas.outputs.server }}
          NATIVE_ON: ${{ needs.areas.outputs.native }}
          MOBILE_ON: ${{ needs.areas.outputs.mobile }}
          SERVER: ${{ needs.server.result }}
          SERVER_TESTS_ON: ${{ needs.areas.outputs.rust_server }}
          SERVER_TESTS: ${{ needs.server-tests.result }}
          NATIVE: ${{ needs.native.result }}
          MOBILE: ${{ needs.mobile.result }}
          SUITE: ${{ needs.mobile-suite.result }}
        run: |
          set -u
          falhou=0
          if [ "$AREAS" != success ]; then echo "::error::não consegui decidir as partes do portão ($AREAS)"; exit 1; fi
          SUITE_ON=$MOBILE_ON
          # No push, as travas rodam dentro das suítes; no PR, a suíte do Expo fica de fora.
          if [ "$EVENT" = pull_request ]; then SUITE_ON=false; else SERVER_ON=false; SERVER_TESTS_ON=false; NATIVE_ON=false; MOBILE_ON=false; fi
          confere() {
            local parte=$1 acionada=$2 resultado=$3 esperado=skipped
            [ "$acionada" = true ] && esperado=success
            if [ "$resultado" = "$esperado" ]; then
              echo "$parte: $resultado"
            else
              echo "::error::$parte: esperado $esperado, terminou $resultado"
              falhou=1
            fi
          }
          confere regras true "$REGRAS"
          confere servidor "$SERVER_ON" "$SERVER"
          confere testes-do-servidor "$SERVER_TESTS_ON" "$SERVER_TESTS"
          confere desktop "$NATIVE_ON" "$NATIVE"
          confere expo "$MOBILE_ON" "$MOBILE"
          confere suite-expo "$SUITE_ON" "$SUITE"
          exit $falhou

# CI: os mesmos gates que rodam localmente (pytest / svelte-check+tsc / vitest / build).
name: CI

on:
  push:
    # beta: o package.yml só publica o pacote da branch com o `backend` verde num run de push do mesmo commit.
    branches: [main, beta]
  pull_request:

jobs:
  # Mudança em instalador/script sem passo declarado em docs/atualizacoes/. O pre-commit faz o
  # mesmo por commit, mas é pulável e some no clone; aqui é o intervalo inteiro do push.
  passos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          de="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$de" ] || ! git cat-file -e "$de" 2>/dev/null; then
            echo "sem base comparável (primeiro push da branch); nada a conferir"; exit 0
          fi
          bash scripts/check-passo-de-atualizacao.sh "$de..HEAD"
      # Mudança na API que o app nativo consome sem subir o CLIENT_API (no PR, contra a base).
      - name: CLIENT_API
        run: |
          de="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$de" ] || ! git cat-file -e "$de" 2>/dev/null; then
            echo "sem base comparável (primeiro push da branch); nada a conferir"; exit 0
          fi
          bash scripts/check-client-api.sh "$de..HEAD"
      # Mudança visível no app sem novidade em docs/novidades/: só avisa, nunca falha o build.
      - name: novidade
        continue-on-error: true
        run: |
          de="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$de" ] || ! git cat-file -e "$de" 2>/dev/null; then
            echo "sem base comparável (primeiro push da branch); nada a conferir"; exit 0
          fi
          bash scripts/check-novidade.sh "$de..HEAD" || true

  statusline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node --test scripts/test-configure-statusline.cjs

  backend:
    runs-on: ubuntu-latest
    # Sem incremental, como no server.yml; a depuração reduzida vem do perfil dev do crates/Cargo.toml.
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/crates/target
      CARGO_INCREMENTAL: "0"
    # So roda teste/build — nao escreve nada no repo. Declarado explicito pra nao herdar
    # o padrao do repositorio, que pode ser write. `actions: write` so apaga as copias antigas do cache dele.
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Preparar CLI Codex para os contratos de contas
        run: |
          npm install --global @openai/codex@0.161.0
          codex --version
      # alguns testes tocam o binario do tmux (mockado na maioria, mas presente por garantia).
      # ripgrep NAO e opcional: a busca entre sessoes (app/search.py) chama `rg` de verdade, e sem
      # ele os testes de busca voltavam ZERO acerto — falha que so aparecia aqui, porque a maquina
      # de quem desenvolve tem o rg como requisito do instalador.
      - run: sudo apt-get update && sudo apt-get install -y tmux ripgrep
      - name: Instalar OMP oficial para provas de extensões
        run: |
          mkdir -p "$RUNNER_TEMP/omp"
          cd "$RUNNER_TEMP/omp"
          # Com retry: em 07/09/2026 o CDN do GitHub devolveu 504 no SHA256SUMS.txt (92 bytes),
          # `curl --fail` saiu 22 e a suíte inteira do backend nem chegou a rodar — enquanto o
          # binário de 190 MB, logo acima, tinha baixado em 2s. `--retry-all-errors` porque o
          # `--retry` sozinho ignora conexão cortada, que é o outro jeito de o mesmo CDN falhar.
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output omp-linux-x64 \
            https://github.com/can1357/oh-my-pi/releases/download/v18.1.11/omp-linux-x64
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output SHA256SUMS.txt \
            https://github.com/can1357/oh-my-pi/releases/download/v18.1.11/SHA256SUMS.txt
          sha256sum --check --ignore-missing SHA256SUMS.txt
          sudo install -m 755 omp-linux-x64 /usr/local/bin/omp
      - run: uv sync
      # Só a main grava (o passo `cache/save` lá embaixo); as outras branches leem o dela. Cada branch
      # gravando a própria cópia estourava o limite de cache do repositório e o GitHub despejava a da main.
      - uses: actions/cache/restore@v4
        id: cache-rust
        with:
          path: &cache-backend |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: backend-rust-v3-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'crates/rust-toolchain.toml') }}
          restore-keys: backend-rust-v3-${{ runner.os }}-
      - name: Compilar contratos Rust usados pelo pytest
        working-directory: crates
        run: |
          cargo build --locked -p hangar-server
          cargo build --locked -p hangar-workspace --example workspace_contract
          cargo test --locked -p hangar-server --no-run --test it
      # Um arquivo inteiro por processo (há testes com nome fixo de sessão tmux), como no scripts/verificar-local.
      # O runner tem 4 vCPUs. basetemp no RUNNER_TEMP: o omp extrai centenas de MB por caso.
      - run: uv run pytest -q -n 4 --dist loadfile --basetemp="$RUNNER_TEMP/pytest"
      # Depois do pytest, que usa os binários do workspace: a poda os tira e fica só o que o cache poupa.
      - if: &grava-backend always() && github.ref == 'refs/heads/main' && steps.cache-rust.outputs.cache-hit != 'true'
        run: ../scripts/podar-target --cache ../crates/target
      - uses: actions/cache/save@v4
        if: *grava-backend
        with:
          path: *cache-backend
          key: ${{ steps.cache-rust.outputs.cache-primary-key }}
      # Chave nova não substitui a velha: sem apagar, cada mudança no Cargo.lock deixava outra cópia até o teto
      # de 10 GB do repositório, e o GitHub despejava o cache que a main estava usando.
      # Por último e sem derrubar o job: falha aqui só deixa as cópias antigas, com aviso. Só apaga com a chave
      # nova já gravada (o `cache/save` que falha só avisa, e apagar então deixaria o próximo push sem cache).
      - name: Apagar cópias antigas do cache
        if: *grava-backend
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIXO: backend-rust-v3-${{ runner.os }}-
          CHAVE: ${{ steps.cache-rust.outputs.cache-primary-key }}
        run: |
          set -o pipefail
          lista() { gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$1" --limit 100 --json key --jq '.[].key'; }
          gravada=$(lista "$CHAVE") || { echo "::warning::não consegui listar o cache $CHAVE; as cópias antigas ficam"; exit 0; }
          grep -qxF -- "$CHAVE" <<<"$gravada" || { echo "::warning::o cache $CHAVE não aparece gravado; as cópias antigas ficam"; exit 0; }
          antigas=$(lista "$PREFIXO") || { echo "::warning::não consegui listar o cache $PREFIXO; as cópias antigas ficam"; exit 0; }
          while IFS= read -r k; do
            [ -z "$k" ] || [ "$k" = "$CHAVE" ] || gh cache delete "$k" --repo "$GITHUB_REPOSITORY" || echo "::warning::não apaguei o cache $k"
          done <<<"$antigas"

  frontend:
    runs-on: ubuntu-latest
    # So roda teste/build — nao escreve nada no repo. Declarado explicito pra nao herdar
    # o padrao do repositorio, que pode ser write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      # Roda na RAIZ (o lockfile é um só), mas SELETIVO: o app nativo é workspace — precisa ser,
      # senão o EAS Build não detecta o monorepo —, e sem os dois `--workspace` este passo baixaria
      # o toolchain do React Native à toa. Medido: 170 pacotes com os flags, contra ~700 sem eles.
      #
      # Por workspace também nos passos abaixo, e NÃO `npm run check`/`npm test` da raiz: os da raiz
      # cobrem as três interfaces, app nativo incluído, e falham de propósito quando as dependências
      # dele não estão instaladas — que é sempre o caso aqui, por causa do `npm ci` seletivo acima.
      # Aqui a lista é explícita: o CI compila front e backend, e o app é assunto do Expo.
      - run: npm ci --workspace=@hangar/core --workspace=frontend
      - run: npm run check -w @hangar/core
      - run: npm run check -w frontend
      # Os vitest.config limitam a 2 forks para várias suítes locais não encherem a RAM; o runner roda só
      # esta e tem 4 vCPUs, como o scripts/verificar-local.
      - run: npm run test -w @hangar/core -- --maxWorkers=4
      - run: npm run test -w frontend -- --maxWorkers=4

  # Build em job proprio: teste vermelho no `frontend` nao pode segurar a tela publicada, senao
  # quem atualiza recebe o codigo novo com a tela do ultimo commit verde.
  dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace=@hangar/core --workspace=frontend
      - run: npm run build -w frontend
      # Vira o dist que o instalador baixa em vez de compilar na maquina de quem instala — que e o
      # passo mais lento e o mais fragil (dois bugs de `--silent` em agosto/2026 morreram ai).
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 1

  # Publica o dist numa release FIXA (`dist-latest`), reescrita a cada push na main. Job separado
  # do `dist` de proposito: os outros jobs sao `contents: read` e devem continuar sendo — so
  # este escreve. Nao roda em pull_request (nao ha o que publicar de um fork, e o token la e read).
  publica-dist:
    needs: dist
    # A beta só alimenta a `dist-commits`: o pacote dela aponta para a tela pela chave das fontes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # O checkout só dá as árvores das fontes para a chave da `dist-commits`.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Dois arquivos, e o `.sha` existe pra o instalador NAO baixar 5MB a toa: ele le o sha
      # (200 bytes), compara com o proprio HEAD e so entao baixa o tar. Dist de outro commit
      # serve tela velha contra API nova, e esse defeito e mudo.
      - run: |
          tar -czf frontend-dist.tar.gz -C dist .
          echo "${{ github.sha }}" > frontend-dist.sha
      # `--clobber` porque a release e reescrita; `create ... || true` porque ela so nao existe na
      # primeira vez. tar.gz e nao zip: o Windows 10+ ja traz `tar.exe`, entao os dois instaladores
      # extraem com o MESMO comando.
      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dist-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create dist-latest --repo "$GITHUB_REPOSITORY" \
                 --title 'frontend compilado (topo da main)' \
                 --notes 'Reescrita a cada push na main. O instalador baixa daqui em vez de compilar na maquina.'
          gh release upload dist-latest frontend-dist.tar.gz frontend-dist.sha \
            --repo "$GITHUB_REPOSITORY" --clobber
          # A tag anda junto: `git describe --match dist-latest` na maquina e o que da nome a versao.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dist-latest" \
            -f sha="${{ github.sha }}" -F force=true >/dev/null
      # A mesma tela pela chave das fontes (`_chave_da_tela` no atualizar.py faz a mesma conta):
      # o atualizador que para num commit do meio, sem build próprio aqui, acha a tela de qualquer
      # commit com as mesmas fontes. Ficam as 50 chaves mais novas.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          c="${{ github.sha }}"
          chave=$(git rev-parse "$c:frontend" "$c:packages" "$c:messages" "$c:project.inlang" "$c:package.json" "$c:package-lock.json" | sha256sum | cut -d' ' -f1)
          nome="frontend-dist-$chave.tar.gz"
          gh release view dist-commits --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create dist-commits --repo "$GITHUB_REPOSITORY" --latest=false \
                 --title 'frontend compilado por chave das fontes' \
                 --notes 'frontend-dist-<chave>.tar.gz: chave = sha256 das arvores frontend, packages, messages, project.inlang e de package.json e package-lock.json da raiz no commit. O atualizador baixa daqui quando para antes do topo.'
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/dist-commits" --jq .id)
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$id/assets" > assets.json
          # Só pula com os DOIS: sem o `.sha256` o motor nunca aceita a chave, então reenvia o par.
          if jq -e --arg n "$nome" 'add | (any(.name == $n) and any(.name == ($n + ".sha256")))' assets.json >/dev/null; then
            echo "chave $chave já publicada"
          else
            cp frontend-dist.tar.gz "$nome"
            sha256sum "$nome" > "$nome.sha256"
            gh release upload dist-commits "$nome" "$nome.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          fi
          jq -r --arg n "$nome" 'add | map(select((.name | endswith(".tar.gz")) and .name != $n))
                 | sort_by(.created_at) | reverse | .[49:][] | .name' assets.json \
            | while read -r velho; do
                gh release delete-asset dist-commits "$velho" --repo "$GITHUB_REPOSITORY" -y || true
                gh release delete-asset dist-commits "$velho.sha256" --repo "$GITHUB_REPOSITORY" -y || true
              done

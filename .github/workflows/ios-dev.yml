# .ipa de desenvolvimento SEM assinatura, para instalar com Apple ID gratuito (SideStore e afins)
# sem Mac. É dev client: carrega o JS do Metro da máquina, então só precisa rodar de novo quando
# mudar dependência nativa ou app.json.
name: iOS dev build

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --workspace=@hangar/core --workspace=mobile
      - working-directory: mobile
        run: npm run i18n:compile:core && npm run i18n:compile
      - working-directory: mobile
        run: npx expo prebuild --platform ios --no-install && (cd ios && pod install)
      - working-directory: mobile/ios
        run: |
          ws=$(ls -d *.xcworkspace | head -1)
          xcodebuild -workspace "$ws" -scheme "${ws%.xcworkspace}" -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -R build/Build/Products/Debug-iphoneos/*.app Payload/
          zip -qry hangar-dev.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: hangar-dev-ipa
          path: mobile/ios/hangar-dev.ipa
          retention-days: 30
          if-no-files-found: error

# hangar-server e hangar-cano no Windows, em run próprio ao lado do server.yml (Linux), com os mesmos gatilhos e os
# jobs do server-jobs.yml. Run próprio porque o Package só dispara quando um run termina: no mesmo run, o Linux pronto
# esperava os testes do Windows, que são os mais lentos. Publica as entradas de Windows na mesma release
# (server-latest ou server-<branch>), pelas fontes por sistema do publish. Windows é experimental: falha dele não
# segura nada, só não publica.
name: Server Windows

on:
  # Só onde publica; a suíte em outra branch roda pelo workflow_dispatch.
  push:
    branches: [main, beta]
    paths:
      - "crates/**"
      - "backend/tests/fixtures/**"
      - "plugins/hangar/hooks/**"
      - ".github/workflows/server-windows.yml"
      - ".github/workflows/server-jobs.yml"
  workflow_dispatch:
    inputs:
      psmux_probe:
        description: Prova isolada de recuperação do psmux
        type: boolean
        default: false

# Na main e no canal cada run tem o próprio grupo: quem cancela o run que um push novo substituiu são os jobs de
# teste e de build (concorrência por job, no server-jobs.yml); o `publish` nunca é cancelado no meio do upload.
# Onde não publica, o push novo cancela o run anterior inteiro.
concurrency:
  group: ${{ (github.ref_name == 'main' || github.ref_name == 'beta') && format('server-windows-run-{0}', github.run_id) || format('server-windows-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'beta' }}

jobs:
  psmux-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.psmux_probe
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target/debug
          key: server-v3-${{ runner.os }}-${{ runner.arch }}-dev-${{ hashFiles('crates/Cargo.lock', 'crates/rust-toolchain.toml') }}
          restore-keys: server-v3-${{ runner.os }}-${{ runner.arch }}-dev-
      - name: Preparar psmux isolado
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'hangar-psmux-proof'
          New-Item -ItemType Directory $root | Out-Null
          gh release download psmux-latest --repo $env:GITHUB_REPOSITORY --pattern 'psmux-conpty-windows-x86_64.zip' --dir $root
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível baixar o psmux' }
          $zip = Join-Path $root 'psmux-conpty-windows-x86_64.zip'
          $expected = '8c79c6efcba47386ceba9a22850e4ff72422975c3924d283493749de1f776656'
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne $expected) { throw 'SHA-256 do psmux diverge' }
          $bin = Join-Path $root 'bin'
          Expand-Archive $zip -DestinationPath $bin
          $registry = Join-Path $root 'registry'
          New-Item -ItemType Directory $registry | Out-Null
          "PSMUX_DATA_DIR=$registry" >> $env:GITHUB_ENV
          "HANGAR_TEST_PSMUX=$(Join-Path $bin 'psmux.exe')" >> $env:GITHUB_ENV
      - name: Recuperar e dispensar sessões descartáveis
        run: cargo test --locked -p hangar-server --lib a_real_psmux_orphan_can_be_recovered_and_dismissed -- --ignored --nocapture
  server:
    if: github.event_name != 'workflow_dispatch' || !inputs.psmux_probe
    uses: ./.github/workflows/server-jobs.yml
    permissions:
      contents: write
      actions: write
    with:
      branch: ${{ github.ref_name }}
      sistemas: >-
        [
          {"os": "windows-latest", "platform": "windows-x86_64", "exe": ".exe", "target": "", "zigbuild": false,
           "dir": "target", "experimental": true}
        ]
      cache_release: >-
        [
          {"os": "windows-latest", "target": "", "zigbuild": false}
        ]

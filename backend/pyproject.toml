[project]
name = "claude-pocket-backend"
version = "0.1.0"
description = "Backend API bridging a phone to live Claude Code tmux sessions (chat + live state + input)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.138.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pywebpush>=2.0.0",
    "qrcode>=8.2",
    "sse-starlette>=3.4.5",
    "uvicorn[standard]>=0.49.0",
    "watchfiles>=1.2.0",
    "websockets>=16.0",
    # Leitura de processo (cmdline/environ/fds/filhos/nascimento) onde NAO ha /proc: Windows e
    # macOS. O marcador mantem o Linux exatamente como era — `uv sync` la nem baixa este pacote,
    # que e extensao C. Ver app/procinfo.py: no Linux o caminho continua sendo /proc direto,
    # porque psutil.open_files() e bem mais lento e esses caminhos rodam por poll.
    "psutil>=5.9.0 ; sys_platform != 'linux'",
    # PTY do painel de terminal no Windows (ConPTY). Marcador `== win32` e nao `!= linux` como o
    # psutil: este pacote so EXISTE pra Windows — no macOS e no Linux quem abre o pty e o `pty` da
    # stdlib, e pedir o pywinpty la quebraria o `uv sync`. Pelo mesmo motivo ele NAO entra sem
    # marcador no grupo dev (o psutil entra, pra o Linux conseguir testar o ramo de Windows): nao
    # ha wheel de pywinpty pra Linux, entao o ramo dele so pode ser exercitado no Windows mesmo.
    "pywinpty>=3.0.5 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    # Sem marcador AQUI de proposito: no Linux o psutil nao entra em producao, mas os testes
    # precisam dele pra exercitar o caminho de Windows/macOS nesta maquina. Sem isso o codigo
    # que so roda fora do Linux nunca seria testado por ninguem que desenvolve no Linux.
    "psutil>=5.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: toca binario/rede externo (codex real) - skip por default",
]

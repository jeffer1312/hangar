[project]
name = "claude-pocket-backend"
version = "0.1.0"
description = "Backend API bridging a phone to live Claude Code tmux sessions (chat + live state + input)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.138.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pywebpush>=2.0.0",
    "qrcode>=8.2",
    "sse-starlette>=3.4.5",
    "uvicorn[standard]>=0.49.0",
    "watchfiles>=1.2.0",
    "websockets>=16.0",
    # Leitura de processo (cmdline/environ/fds/filhos/nascimento) onde NAO ha /proc: Windows e
    # macOS. O marcador mantem o Linux exatamente como era — `uv sync` la nem baixa este pacote,
    # que e extensao C. Ver app/procinfo.py: no Linux o caminho continua sendo /proc direto,
    # porque psutil.open_files() e bem mais lento e esses caminhos rodam por poll.
    "psutil>=5.9.0 ; sys_platform != 'linux'",
    # NAO ha dependencia de PTY pro Windows. O `pywinpty` chegou a entrar aqui e SAIU depois de
    # medido (22/08/2026): ele nao usa o ConPTY do sistema — embarca `conpty.dll` e
    # `OpenConsole.exe` proprios, do Windows Terminal —, entao nao expunha handle aproveitavel pra
    # entregar ao asyncio, que e o ponto inteiro do motor. Junte a isso `PTY.read()` devolvendo
    # `str` em vez de `bytes` (num cano de bytes crus ate o xterm.js) e um `socket.bind` ESCUTANDO
    # por sessao, e nao sobra motivo pra 1,2 MB de binario de terceiro. Hoje o pty do Windows e
    # `app/conpty.py`: ctypes puro sobre o kernel32, stdlib e nada mais.
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    # Sem marcador AQUI de proposito: no Linux o psutil nao entra em producao, mas os testes
    # precisam dele pra exercitar o caminho de Windows/macOS nesta maquina. Sem isso o codigo
    # que so roda fora do Linux nunca seria testado por ninguem que desenvolve no Linux.
    "psutil>=5.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: toca binario/rede externo (codex real) - skip por default",
]

[package]
name = "telemetry-ingest"
version = "0.1.0"
edition = "2024"
publish = false

# Workspace próprio, fora de `crates/`: o driver do Postgres não entra no Cargo.lock nem no portão do PR.
[workspace]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "json"] }
# Só `wire`: sem a feature `runtime`, o hangar-core não vem junto.
hangar-telemetry = { path = "../../crates/hangar-telemetry", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Senha das contas do painel; o sha2 guarda só o hash dos tokens de sessão e convite.
argon2 = "0.5"
# Hash dos scripts da página na Content-Security-Policy.
base64 = "0.22"
sha2 = "0.10"
# A mesma rand_core que o argon2 usa, com o gerador do sistema ligado (sal e tokens).
rand_core = { version = "0.6", features = ["getrandom"] }
# `macros` só para o `migrate!`, que embute os arquivos; nenhuma consulta é conferida contra banco na compilação.
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "json", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

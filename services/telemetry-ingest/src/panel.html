<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetria do Hangar</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f9; --surface: #ffffff; --ink: #191919; --ink-2: #666666;
  --grid: #e7e7e7; --axis: #c2c2c2; --ring: rgba(11,11,11,0.10);
  --bar: #257de0; --track: #eef3fa; --critical: #dc3c3d;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0b0b0b; --surface: #191919; --ink: #efefef; --ink-2: #9c9c9c;
    --grid: #303030; --axis: #474747; --ring: rgba(255,255,255,0.10);
    --bar: #338ced; --track: #1d2633; --critical: #dc3c3d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; }
h2 { font-size: 15px; font-weight: 600; margin: 32px 0 12px; }
.sub { color: var(--ink-2); font-size: 13px; }
.range { display: inline-flex; border: 1px solid var(--ring); border-radius: 8px; overflow: hidden; background: var(--surface); }
.range button { border: 0; background: transparent; color: var(--ink-2); padding: 6px 12px; font: inherit; cursor: pointer; min-height: 32px; }
.range button[aria-pressed="true"] { color: var(--ink); font-weight: 600; background: var(--track); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; min-width: 0; }
.kpi .label { color: var(--ink-2); font-size: 13px; }
.kpi .value { font-size: 30px; font-weight: 600; margin-top: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.card h3 { font-size: 14px; font-weight: 600; margin: 0; }
.card .name { color: var(--ink-2); font-size: 12px; margin: 2px 0 12px; }
.card .name.code { font-family: ui-monospace, monospace; }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; border-radius: 6px; outline-offset: 2px; }
.row .lbl { overflow-wrap: anywhere; font-size: 13px; }
.row .num { font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; white-space: nowrap; }
.row .num small { color: var(--ink-2); font-size: 12px; margin-left: 6px; }
.row .track { grid-column: 1 / -1; height: 8px; background: var(--track); border-radius: 4px; }
.row .fill { height: 100%; background: var(--bar); border-radius: 4px; min-width: 2px; }
.row.bad .fill { background: var(--critical); }
.minor { color: var(--ink-2); font-size: 12px; margin-top: 10px; }
.empty, .error { color: var(--ink-2); padding: 24px 0; }
.error { color: var(--critical); }
svg text { fill: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .gridline { stroke: var(--grid); stroke-width: 1; }
svg .base { stroke: var(--axis); stroke-width: 1; }
svg .col { fill: var(--bar); }
svg .hit { fill: transparent; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 500; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td code { font-size: 12px; }
.table-wrap { overflow-x: auto; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--ring);
  box-shadow: 0 4px 16px rgba(0,0,0,.18); border-radius: 8px; padding: 6px 10px; font-size: 12px; display: none; z-index: 10; max-width: 280px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Telemetria do Hangar</h1>
      <div class="sub" id="lead">Contagens anônimas que as máquinas mandam uma vez por dia (dias em UTC).</div>
    </div>
    <div class="range" role="group" aria-label="Período">
      <button data-days="7">7 dias</button><button data-days="30">30 dias</button><button data-days="90">90 dias</button>
    </div>
  </header>
  <div id="content"><div class="empty">Carregando…</div></div>
</main>
<div id="tip" role="tooltip"></div>
<script>
"use strict";
const EVENTS = {
  app_visible_minutes: ["Minutos com o app à vista", "uso"],
  message_sent: ["Mensagens enviadas", "uso"],
  turn_finished: ["Turnos concluídos", "uso"],
  session_opened: ["Sessões abertas", "uso"],
  feature_used: ["Recursos usados", "uso"],
  mcp_tool: ["Ferramentas do MCP", "uso"],
  voice_call: ["Chamadas de voz", "uso"],
  dictation: ["Ditado", "uso"],
  chat_open: ["Conversa aberta", "uso"],
  client_route: ["Rota do cliente até o servidor", "uso"],
  peers: ["Máquinas ligadas", "uso"],
  problem_shown: ["Problemas mostrados na tela", "saude"],
  problem_hidden: ["Problemas só no diário", "saude"],
  session_open_failed: ["Falhas ao abrir sessão", "saude"],
  send_failed: ["Falhas ao enviar", "saude"],
  session_fallen: ["Sessões que caíram", "saude"],
  server_exit: ["Saídas do servidor", "saude"],
  limit_switch: ["Troca de conta no limite", "saude"],
  client_fatal: ["Erros fatais do app", "saude"],
  update_finished: ["Atualizações", "saude"],
  update_step: ["Passos de atualização", "saude"],
  update_failed_code: ["Falhas de atualização", "saude"],
  server_startup: ["Subida do servidor", "saude"],
};
const BAD = new Set(["problem_shown", "session_open_failed", "send_failed", "session_fallen", "client_fatal", "update_failed_code"]);
const BUCKETS = ["lt100ms", "lt300ms", "lt1s", "lt3s", "lt10s", "lt30s", "ge30s"];
const BUCKET_LABEL = { lt100ms: "menos de 100 ms", lt300ms: "100–300 ms", lt1s: "0,3–1 s", lt3s: "1–3 s", lt10s: "3–10 s", lt30s: "10–30 s", ge30s: "30 s ou mais" };
const ENV_LABEL = { version: "Versão", os: "Sistema", channel: "Canal" };
const fmt = new Intl.NumberFormat("pt-BR");
const compact = new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 });

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v; else if (k === "text") node.textContent = v; else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}
const svgEl = (tag, attrs) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
};

const tip = document.getElementById("tip");
function showTip(text, x, y) {
  tip.textContent = text; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 12)) + "px";
  tip.style.top = Math.max(8, y - h - 12) + "px";
}
function hideTip() { tip.style.display = "none"; }
function withTip(node, text) {
  node.addEventListener("pointermove", e => showTip(text, e.clientX, e.clientY));
  node.addEventListener("pointerleave", hideTip);
  node.addEventListener("focus", () => { const r = node.getBoundingClientRect(); showTip(text, r.left, r.top); });
  node.addEventListener("blur", hideTip);
  return node;
}

function dimsLabel(dims) {
  const entries = Object.entries(dims || {});
  if (!entries.length) return "total";
  if (entries.length === 1) return entries[0][1];
  return entries.map(([k, v]) => k + ": " + v).join(" · ");
}

// Lista de barras: nome, figura e barra alinhadas; o maior valor enche a trilha.
function barList(items, opts = {}) {
  const max = Math.max(1, ...items.map(i => i.value));
  const box = el("div", { class: "rows" });
  for (const it of items) {
    const row = el("div", { class: "row" + (opts.bad ? " bad" : ""), tabindex: "0" },
      el("div", { class: "lbl", text: it.label }),
      el("div", { class: "num" }, fmt.format(it.value), it.machines != null ? el("small", { text: it.machines + " máq." }) : null),
      el("div", { class: "track" }, el("div", { class: "fill", style: "width:" + (100 * it.value / max).toFixed(2) + "%" })));
    withTip(row, it.label + ": " + fmt.format(it.value) + (it.machines != null ? " (" + it.machines + " máquina" + (it.machines === 1 ? "" : "s") + ")" : ""));
    box.append(row);
  }
  return box;
}

function card(title, name, body, code) {
  return el("section", { class: "card" }, el("h3", { text: title }), name ? el("div", { class: "name" + (code ? " code" : ""), text: name }) : null, body);
}

// Colunas por dia, uma série: o título diz o que é, sem legenda.
function daysChart(daily, days) {
  const byDay = new Map(daily.map(d => [d.day, d.machines]));
  const end = new Date(); end.setUTCHours(0, 0, 0, 0);
  const series = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(end.getTime() - i * 86400000).toISOString().slice(0, 10);
    series.push({ day: d, value: byDay.get(d) || 0 });
  }
  // Na largura real do cartão: o texto dos eixos fica do mesmo tamanho no celular e no PC.
  const W = Math.max(280, document.querySelector("main").clientWidth - 34), H = 200, L = 36, B = 22, T = 8;
  const max = Math.max(1, ...series.map(s => s.value));
  const ticks = Math.min(4, max);
  const step = Math.ceil(max / ticks);
  const top = step * ticks;
  const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img", "aria-label": "Máquinas por dia" });
  for (let i = 0; i <= ticks; i++) {
    const y = T + (H - B - T) * (1 - i / ticks);
    svg.append(svgEl("line", { x1: L, x2: W, y1: y, y2: y, class: i ? "gridline" : "base" }));
    const t = svgEl("text", { x: L - 6, y: y + 4, "text-anchor": "end" }); t.textContent = fmt.format(step * i); svg.append(t);
  }
  const band = (W - L) / series.length;
  const bw = Math.min(24, Math.max(2, band - 2));
  series.forEach((s, i) => {
    const x = L + i * band + (band - bw) / 2;
    const h = (H - B - T) * s.value / top;
    const y = H - B - h;
    if (s.value > 0) {
      const r = Math.min(4, bw / 2, h);
      svg.append(svgEl("path", { class: "col", d: "M" + x + "," + (H - B) + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y +
        "H" + (x + bw - r) + "Q" + (x + bw) + "," + y + " " + (x + bw) + "," + (y + r) + "V" + (H - B) + "Z" }));
    }
    const hit = svgEl("rect", { class: "hit", x: L + i * band, y: T, width: band, height: H - B - T, tabindex: "0" });
    withTip(hit, s.day.split("-").reverse().join("/") + ": " + s.value + " máquina" + (s.value === 1 ? "" : "s"));
    svg.append(hit);
    const every = Math.ceil(series.length / Math.max(2, Math.floor((W - L) / 70)));
    if (i === 0 || i === series.length - 1 || (i % every === 0 && series.length - 1 - i >= every / 2)) {
      const edge = i === 0 ? "start" : i === series.length - 1 ? "end" : "middle";
      const tx = edge === "start" ? L + i * band : edge === "end" ? L + (i + 1) * band : L + i * band + band / 2;
      const t = svgEl("text", { x: tx, y: H - 6, "text-anchor": edge });
      t.textContent = s.day.slice(8, 10) + "/" + s.day.slice(5, 7); svg.append(t);
    }
  });
  return svg;
}

function render(data) {
  const root = document.getElementById("content");
  root.replaceChildren();
  const a = data.active;
  root.append(el("div", { class: "kpis" },
    ...[["Máquinas ativas em 7 dias", a.machines_7d], ["Máquinas ativas em 30 dias", a.machines_30d],
        ["Donos em 7 dias", a.owners_7d], ["Donos em 30 dias", a.owners_30d],
        ["Pacotes no período", data.period.batches]]
      .map(([label, value]) => el("div", { class: "card kpi" }, el("div", { class: "label", text: label }), el("div", { class: "value", text: compact.format(value) })))));

  if (!data.period.batches) {
    root.append(el("div", { class: "empty", text: "Nenhum pacote chegou neste período." }));
    return;
  }

  root.append(el("h2", { text: "Máquinas por dia" }), el("div", { class: "card" }, daysChart(data.daily, data.days)));

  root.append(el("h2", { text: "Onde roda" }));
  const envGrid = el("div", { class: "grid" });
  for (const key of ["version", "os", "channel"]) {
    const items = data.env.filter(e => e.key === key).map(e => ({ label: e.value, value: e.machines }));
    envGrid.append(card(ENV_LABEL[key], "máquinas pelo último pacote", items.length ? barList(items) : el("div", { class: "empty", text: "Sem dados." })));
  }
  envGrid.append(card("Máquinas por dono", "donos ativos em 30 dias", data.per_owner.length
    ? barList(data.per_owner.map(p => ({ label: p.machines + " máquina" + (p.machines === 1 ? "" : "s"), value: p.owners })))
    : el("div", { class: "empty", text: "Sem dados." })));
  root.append(envGrid);

  // Um cartão por evento: as combinações de dimensão somam as faixas; a duração vai num cartão à parte.
  const byEvent = new Map();
  const entry = event => byEvent.get(event) || byEvent.set(event, { dims: new Map(), buckets: new Map() }).get(event);
  for (const c of data.by_dims) entry(c.event).dims.set(dimsLabel(c.dims), { value: c.count, machines: c.machines });
  for (const c of data.by_bucket) entry(c.event).buckets.set(c.bucket, { value: c.count, machines: c.machines });
  const sections = { uso: [], saude: [], tempos: [], outros: [] };
  for (const [event, e] of [...byEvent].sort()) {
    const [title, group] = EVENTS[event] || [event, "outros"];
    const items = [...e.dims].map(([label, d]) => ({ label, ...d })).sort((x, y) => y.value - x.value);
    const shown = items.slice(0, 12);
    const body = el("div", {}, barList(shown, { bad: BAD.has(event) }),
      items.length > shown.length ? el("div", { class: "minor", text: "+ " + (items.length - shown.length) + " na tabela abaixo" }) : null);
    sections[group].push(card(title, event, body, true));
    if (e.buckets.size) {
      const order = [...e.buckets.keys()].sort((x, y) => BUCKETS.indexOf(x) - BUCKETS.indexOf(y));
      sections.tempos.push(card(title + ": duração", event, barList(order.map(b => ({ label: BUCKET_LABEL[b] || b, ...e.buckets.get(b) }))), true));
    }
  }
  for (const [key, title] of [["uso", "Uso"], ["saude", "Saúde"], ["tempos", "Tempos"], ["outros", "Outros eventos"]]) {
    if (!sections[key].length) continue;
    root.append(el("h2", { text: title }), el("div", { class: "grid" }, ...sections[key]));
  }

  const rows = data.counters.map(c => el("tr", {},
    el("td", {}, el("code", { text: c.event })), el("td", { text: dimsLabel(c.dims) }), el("td", { text: c.bucket ? (BUCKET_LABEL[c.bucket] || c.bucket) : "" }),
    el("td", { class: "n", text: fmt.format(c.count) }), el("td", { class: "n", text: String(c.machines) })));
  root.append(el("h2", { text: "Todos os contadores" }), el("div", { class: "card table-wrap" }, el("table", {},
    el("thead", {}, el("tr", {}, el("th", { text: "Evento" }), el("th", { text: "Dimensões" }), el("th", { text: "Duração" }),
      el("th", { class: "n", text: "Total" }), el("th", { class: "n", text: "Máquinas" }))),
    el("tbody", {}, ...rows))));
}

let current = Number(new URLSearchParams(location.search).get("dias")) || 30;
let last = null;
let resizing = 0;
window.addEventListener("resize", () => { clearTimeout(resizing); resizing = setTimeout(() => last && render(last), 150); });
async function load(days) {
  current = days;
  document.querySelectorAll(".range button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.days) === days)));
  history.replaceState(null, "", "?dias=" + days);
  try {
    const res = await fetch("/painel/dados?dias=" + days, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (days === current) { last = data; render(data); }
  } catch (err) {
    if (days !== current) return;
    document.getElementById("content").replaceChildren(el("div", { class: "error", text: "Não foi possível ler os dados (" + err.message + ")." }));
  }
}
document.querySelectorAll(".range button").forEach(b => b.addEventListener("click", () => load(Number(b.dataset.days))));
load(current);
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Entrar · Telemetria do Hangar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20200%22%20aria-hidden%3D%22true%22%3E%3Crect%20width%3D%22200%22%20height%3D%22200%22%20rx%3D%2244%22%20fill%3D%22%231b1d1f%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23f5f5f0%22%20stroke-linecap%3D%22round%22%20stroke-width%3D%2217%22%20transform%3D%22translate(0%2016)%22%3E%3Cpath%20d%3D%22M%2033.49%20132.44%20A%2074%2074%200%201%201%20166.51%20132.44%22%2F%3E%3Cpath%20d%3D%22M%2056.96%20109.15%20A%2044%2044%200%201%201%20143.04%20109.15%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<meta name="theme-color" content="#121013">
<link rel="manifest" href="/panel/manifest.webmanifest">
<link rel="apple-touch-icon" href="/panel/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Telemetria">
<link rel="stylesheet" href="/panel/assets/panel.css">
</head>
<body>
<div class="glow"></div>
<main class="auth">
  <form class="auth-card" id="form" novalidate>
    <div class="brand"><svg class="logo" width="40" height="40" viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" rx="44" fill="#1b1d1f"/><g fill="none" stroke="#f5f5f0" stroke-linecap="round" stroke-width="17" transform="translate(0 16)"><path d="M 33.49 132.44 A 74 74 0 1 1 166.51 132.44"/><path d="M 56.96 109.15 A 44 44 0 1 1 143.04 109.15"/></g></svg><div><h1>Telemetria do Hangar</h1><p class="lead">Entre com a sua conta.</p></div></div>
    <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" id="go" type="submit">Entrar</button>
    <p class="msg" id="msg" role="alert"></p>
    <p class="foot">Sem conta? Peça um convite a quem já tem acesso.</p>
  </form>
</main>
<script>
"use strict";
// Sem isto o painel não pode ser instalado; o service worker só repassa à rede.
navigator.serviceWorker?.register("/panel/sw.js", { scope: "/panel" }).catch((e) => console.warn("service worker:", e));
const form = document.getElementById("form"), go = document.getElementById("go"), msg = document.getElementById("msg");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.textContent = "";
  go.disabled = true; go.textContent = "Entrando…";
  try {
    const res = await fetch("/panel/api/login", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ email: form.email.value, password: form.password.value }) });
    if (res.status === 204) { location.replace("/panel"); return; }
    msg.textContent = res.status === 401 ? "E-mail ou senha não conferem." : "Não deu para entrar agora (" + res.status + "). Tente de novo.";
  } catch {
    msg.textContent = "Sem conexão com o servidor.";
  }
  go.disabled = false; go.textContent = "Entrar";
  form.password.select();
});
</script>
</body>
</html>

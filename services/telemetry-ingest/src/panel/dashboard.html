function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v; else if (k === "text") node.textContent = v; else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}
const svgEl = (tag, attrs) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
};

const tip = document.getElementById("tip");
function showTip(text, x, y) {
  tip.textContent = text; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 12)) + "px";
  tip.style.top = Math.max(8, y - h - 12) + "px";
}
function hideTip() { tip.style.display = "none"; }
function withTip(node, text) {
  node.addEventListener("pointermove", e => showTip(text, e.clientX, e.clientY));
  node.addEventListener("pointerleave", hideTip);
  node.addEventListener("focus", () => { const r = node.getBoundingClientRect(); showTip(text, r.left, r.top); });
  node.addEventListener("blur", hideTip);
  return node;
}

function dimsLabel(dims) {
  const parts = [];
  for (const [k, v] of Object.entries(dims || {}).sort()) {
    // Só "true"/"false" viram a frase da bandeira; outro valor aparece como veio.
    if (Object.hasOwn(FLAGS, k) && (v === "true" || v === "false")) {
      const said = FLAGS[k][v === "true" ? 0 : 1];
      if (said) parts.push(said);
    } else if (Object.hasOwn(VALUES, k) && Object.hasOwn(VALUES[k], v)) {
      parts.push(VALUES[k][v]);
    } else {
      parts.push(Object.hasOwn(KEYS, k) ? KEYS[k] + " " + v : v);
    }
  }
  return parts.length ? parts.join(" · ") : "todas";
}

// Série diária completa do período (dia sem pacote = 0), em UTC como os pacotes.
let skipToday = false;
function series(days, valueOf) {
  const end = new Date(); end.setUTCHours(0, 0, 0, 0);
  const out = [];
  for (let i = days - 1; i >= 0; i--) {
    const day = new Date(end.getTime() - i * 86400000).toISOString().slice(0, 10);
    out.push({ day, value: valueOf(day) });
  }
  return skipToday ? out.slice(0, -1) : out;
}

const bucketRank = b => { const i = BUCKETS.indexOf(b); return i < 0 ? BUCKETS.length : i; };

function quantileBucket(buckets, q) {
  const order = [...buckets.keys()].sort(byBucket);
  const total = order.reduce((s, b) => s + buckets.get(b).value, 0);
  let seen = 0;
  for (const b of order) {
    seen += buckets.get(b).value;
    if (seen >= q * total) return b;
  }
  return order[order.length - 1];
}
function timeSentence(buckets) {
  const total = [...buckets.values()].reduce((s, b) => s + b.value, 0);
  const say = b => b === "ge30s" ? "leva mais de 30 s" : Object.hasOwn(UPPER, b) ? "fica em até " + UPPER[b] : "fica na faixa " + b;
  if (total < 5) return "Poucas medidas ainda (" + total + "): o retrato fica confiável com mais dias.";
  return "Metade das vezes " + say(quantileBucket(buckets, 0.5)) + "; 9 em cada 10 " + say(quantileBucket(buckets, 0.9)) + ".";
}

// Números rolam do valor anterior até o novo: trocar 7/30/90 dias mostra o quanto mudou.
const lastShown = new Map();
function countUp(node, key, value, format) {
  const from = lastShown.has(key) ? lastShown.get(key) : 0;
  lastShown.set(key, value);
  if (!animate || from === value) { node.textContent = format(value); return node; }
  const start = performance.now(), dur = 900;
  const step = now => {
    const t = Math.min(1, Math.max(0, (now - start) / dur)), e = 1 - Math.pow(2, -10 * t);
    node.textContent = format(t === 1 ? value : from + (value - from) * e);
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  return node;
}
const compactInt = v => compact.format(Math.round(v));

function barList(items) {
  const max = Math.max(1, ...items.map(i => i.value));
  const box = el("div", { class: "rows" });
  for (const it of items) {
    const row = el("div", { class: "row", tabindex: "0", "data-q": it.label.toLowerCase() },
      el("div", { class: "lbl", text: it.label }),
      el("div", { class: "num" }, fmt.format(it.value), it.machines != null ? el("small", { text: it.machines + " máq." }) : null),
      el("div", { class: "track" }, el("div", { class: "fill", style: "--w:" + (it.value / max).toFixed(4) })));
    withTip(row, it.label + ": " + fmt.format(it.value) + (it.machines != null ? " (" + it.machines + " máquina" + (it.machines === 1 ? "" : "s") + ")" : ""));
    box.append(row);
  }
  return box;
}

// Linha com área, desenhada na largura real do cartão (o texto dos eixos fica do mesmo tamanho no celular e no PC).
let chartId = 0;
function lineChart(slot) {
  const { rows, unit } = slot._chart;
  const W = Math.max(240, slot.clientWidth), H = slot._chart.height || 200, L = 34, B = 22, T = 10, R = 6;
  const max = Math.max(1, ...rows.map(s => s.value));
  const ticks = Math.min(4, max), step = Math.ceil(max / ticks), top = step * ticks;
  const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", height: H, role: "img",
    "aria-label": slot._chart.label + ": " + rows.map(r => fmt.format(r.value)).join(", ") });
  for (let i = 0; i <= ticks; i++) {
    const y = T + (H - B - T) * (1 - i / ticks);
    svg.append(svgEl("line", { x1: L, x2: W - R, y1: y, y2: y, class: i ? "gridline" : "base" }));
    const t = svgEl("text", { x: L - 8, y: y + 4, "text-anchor": "end" }); t.textContent = compact.format(step * i); svg.append(t);
  }
  const band = (W - L - R) / Math.max(1, rows.length - 1);
  const pts = rows.map((s, i) => [L + i * band, T + (H - B - T) * (1 - s.value / top)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join("");
  const id = "g" + (++chartId);
  const defs = svgEl("defs", {});
  const grad = svgEl("linearGradient", { id, x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.append(svgEl("stop", { offset: "0", "stop-color": "var(--hue)", "stop-opacity": ".32" }), svgEl("stop", { offset: "1", "stop-color": "var(--hue)", "stop-opacity": "0" }));
  defs.append(grad); svg.append(defs);
  svg.append(svgEl("path", { class: "area", fill: "url(#" + id + ")", d: line + "L" + pts.at(-1)[0] + "," + (H - B) + "L" + L + "," + (H - B) + "Z" }));
  svg.append(svgEl("path", { class: "line", d: line, pathLength: "1" }));
  const cross = svgEl("line", { class: "cross", x1: 0, x2: 0, y1: T, y2: H - B });
  const dot = svgEl("circle", { class: "dot", r: 4, cx: pts.at(-1)[0], cy: pts.at(-1)[1] });
  svg.append(cross, dot);
  const every = Math.ceil(rows.length / Math.max(2, Math.floor((W - L) / 72)));
  rows.forEach((s, i) => {
    if (i === 0 || i === rows.length - 1 || (i % every === 0 && rows.length - 1 - i >= every / 2)) {
      const anchor = i === 0 ? "start" : i === rows.length - 1 ? "end" : "middle";
      const t = svgEl("text", { x: pts[i][0], y: H - 4, "text-anchor": anchor }); t.textContent = dayMonth(s.day); svg.append(t);
    }
    const hit = svgEl("rect", { class: "hit", x: pts[i][0] - band / 2, y: T, width: Math.max(band, 4), height: H - B - T });
    const show = (x, y) => {
      cross.setAttribute("x1", pts[i][0]); cross.setAttribute("x2", pts[i][0]); cross.style.opacity = 1;
      dot.setAttribute("cx", pts[i][0]); dot.setAttribute("cy", pts[i][1]);
      showTip(s.day.split("-").reverse().join("/") + ": " + fmt.format(s.value) + " " + unit[s.value === 1 ? 0 : 1], x, y);
    };
    const hide = () => { cross.style.opacity = 0; dot.setAttribute("cx", pts.at(-1)[0]); dot.setAttribute("cy", pts.at(-1)[1]); hideTip(); };
    hit.addEventListener("pointermove", e => show(e.clientX, e.clientY));
    hit.addEventListener("pointerleave", hide);
    svg.append(hit);
  });
  slot.replaceChildren(svg);
}
const chartSlot = (label, rows, unit, height) => {
  const slot = el("div", { class: "chart" });
  slot._chart = { label, rows, unit, height };
  return slot;
};
const chartCard = (title, explain, rows, unit, height) => card(title, explain, chartSlot(title, rows, unit, height));

let logLevel = "";
const dayMonth = day => day.slice(8, 10) + "/" + day.slice(5, 7);

function logRow(l) {

  return el("div", { class: "log-row", "data-q": (l.message + " " + l.target).toLowerCase() },

function logCard(logs) {
  if (!logs.length) return el("div", { class: "card empty" }, icon("check"), "Nenhuma linha de erro no período.");
  const levels = el("div", { class: "seg", role: "group", "aria-label": "Nível" });
  const list = el("div", { class: "log-list" }), shownCount = el("div", { class: "minor" });
  const draw = () => {
    const shown = logs.filter(l => !logLevel || l.level === logLevel);
    list.replaceChildren(...shown.map(logRow));
    if (!shown.length) list.append(el("div", { class: "empty", text: "Nenhuma linha com esse filtro." }));
    shownCount.textContent = shown.length + " de " + logs.length + " linhas";
    applyFilter();
  };
  const errors = logs.filter(l => l.level === "error").length;
  for (const [value, label] of [["", "Todos"], ["error", "Erros · " + errors], ["warn", "Avisos · " + (logs.length - errors)]]) {
    const button = el("button", { type: "button", "aria-pressed": String(value === logLevel), text: label });
    button.addEventListener("click", () => {
      logLevel = value;
      levels.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === button)));
      draw();
    });
    levels.append(button);
  }
  draw();
  return el("div", { class: "card", "data-title": "log de erros" }, el("div", { class: "log-tools" }, levels, shownCount), list);
}

const groupTitle = (text, ic) => el("h3", { class: "group-title" }, ic ? icon(ic) : null, text);

function settingsCards(rows) {
  const bySetting = new Map();
  for (const c of rows) {
    const d = c.dims || {};
    if (typeof d.setting !== "string" || typeof d.value !== "string") continue;
    if (!bySetting.has(d.setting)) bySetting.set(d.setting, []);
    bySetting.get(d.setting).push({ value: d.value, client: d.client, machines: c.machines });
  }
  const groups = new Map([...SETTING_GROUPS, "Outras"].map(g => [g, []]));
  for (const key of Object.keys(SETTINGS).concat([...bySetting.keys()].filter(k => !Object.hasOwn(SETTINGS, k)).sort())) {
    const items = bySetting.get(key);
    if (!items) continue;
    const [title, group, explain] = Object.hasOwn(SETTINGS, key) ? SETTINGS[key] : [key, "Outras", "Preferência nova, ainda sem descrição neste painel."];
    const clients = new Set(items.map(i => i.client)).size;
    const table = key === "default_provider" ? AGENTS : SETTING_VALUES;
    const label = i => Object.hasOwn(table, i.value) ? table[i.value] : String(i.value);
    // O mesmo valor em dois apps sai em duas barras: somar contaria duas vezes a máquina que tem os dois.
    const bars = items.sort((x, y) => y.machines - x.machines).map(i => ({
      label: clients > 1 ? label(i) + " · " + (Object.hasOwn(VALUES.client, i.client) ? VALUES.client[i.client] : String(i.client)) : label(i), value: i.machines }));
    groups.get(group).push(card(title, explain, barList(bars)));
  }
  const out = [];
  for (const [group, cards] of groups) if (cards.length) out.push(groupTitle(group), el("div", { class: "grid" }, ...cards));
  return { nodes: out, count: bySetting.size };
}

function render(data) {
  const root = document.getElementById("content");
  const a = data.active;
  const byEvent = new Map();
  const entry = event => byEvent.get(event) || byEvent.set(event, { dims: [], buckets: new Map() }).get(event);
  // As linhas já vêm agrupadas pelo banco: uma por combinação, mesmo quando dois rótulos saem iguais.
  for (const c of data.by_dims) entry(c.event).dims.push({ label: dimsLabel(c.dims), value: c.count, machines: c.machines });
  for (const c of data.by_bucket) entry(c.event).buckets.set(c.bucket, { value: c.count, machines: c.machines });
  const total = event => (byEvent.get(event)?.dims || []).reduce((s, d) => s + d.value, 0);
  // O dia só chega depois de fechar em UTC: sem pacote de hoje, o gráfico para em ontem em vez de cair num zero falso.
  const today = new Date().toISOString().slice(0, 10);
  skipToday = !data.daily.some(d => d.day === today);

  // Falha é o evento de falha inteiro, ou a linha que diz que deu errado (ferramenta com erro, passo que não deu certo).
  // Uma atualização que falha conta uma vez, pelo código (update_failed_code); a etapa e o fim dela ficam em Saúde do servidor.
  const failed = (event, dims) => BAD.has(event)
    || (event !== "update_step" && event !== "update_finished" && (dims.error === "true" || dims.ok === "false"));
  const failures = [];
  for (const c of data.by_dims) {
    if (!failed(c.event, c.dims || {})) continue;
    const title = Object.hasOwn(EVENTS, c.event) ? EVENTS[c.event][0] : c.event;
    failures.push({ label: title + " · " + dimsLabel(c.dims), value: c.count, machines: c.machines });
  }
  failures.sort((x, y) => y.value - x.value);
  const failTotal = failures.reduce((s, f) => s + f.value, 0);

  const perDay = keep => {
    const sums = new Map();
    for (const t of data.trend || []) if (keep(t.event, t.dims || {})) sums.set(t.day, (sums.get(t.day) || 0) + t.count);
    return series(data.days, day => sums.get(day) || 0);
  };
  const daily = event => perDay(e => e === event);
  const machinesDaily = series(data.days, day => (data.daily.find(d => d.day === day) || {}).machines || 0);
  const logs = data.logs || [];
  const settings = settingsCards(data.by_dims.filter(c => c.event === "settings"));

  const times = [];
  for (const [event, e] of [...byEvent].sort()) {
    if (!e.buckets.size) continue;
    const [title, , explain] = Object.hasOwn(EVENTS, event) ? EVENTS[event] : [event, "", ""];
    const order = [...e.buckets.keys()].sort(byBucket);
    times.push(card(title, explain, el("p", { class: "headline", text: timeSentence(e.buckets) }),
      barList(order.map(b => ({ label: Object.hasOwn(BUCKET_LABEL, b) ? BUCKET_LABEL[b] : b, ...e.buckets.get(b) })))));
  }

  const counts = { problems: failTotal, log: logs.length, usage: total("message_sent"), speed: times.length,
    machines: a.machines_30d, settings: settings.count, raw: data.counters.length };
  drawChips(counts, { problems: failTotal > 0, log: logs.some(l => l.level === "error") });

  const nodes = [];
  const kpi = (sec, ic, label, key, value, note, bad) => {
    const node = el("a", { class: "kpi" + (bad ? " bad" : ""), href: "#s-" + sec, style: "--hue:" + HUE[sec] },
      el("div", { class: "label" }, icon(ic), label), el("div", { class: "value" }), el("div", { class: "note", text: note }));
    countUp(node.querySelector(".value"), key, value, compactInt);
    return node;
  };

  if (!data.period.batches) {
    nodes.push(sectionBlock("overview", null, null, el("div", { class: "card empty big" }, icon("calendar"),
      "Nenhum pacote chegou neste período.", el("span", { class: "minor", text: "Cada máquina manda o dia depois que ele fecha em UTC (21h em Brasília)." }))));
    root.replaceChildren(...nodes);
    applyFilter();
    spy();
    return;
  }

  const topFailures = failures.length
    ? card("Falhas mais comuns", "O que mais deu errado no período.", barList(failures.slice(0, 5)),
        el("a", { class: "more", href: "#s-problems" }, "Ver as " + fmt.format(failTotal) + " falhas", icon("chevron")))
    : el("div", { class: "card empty" }, icon("check"), "Nenhuma falha no período.");
  topFailures.style.setProperty("--hue", HUE.problems);
  topFailures.style.setProperty("--hue-soft", "color-mix(in srgb, " + HUE.problems + " 15%, transparent)");
  nodes.push(sectionBlock("overview", null, null,
    el("div", { class: "kpis" },
      kpi("machines", "machines", "Máquinas ativas", "m", a.machines_30d, a.machines_7d + " nos últimos 7 dias"),
      kpi("overview", "users", "Pessoas", "p", a.owners_30d, "cada pessoa conta uma vez"),
      kpi("usage", "usage", "Mensagens enviadas", "msg", total("message_sent"), fmt.format(total("turn_finished")) + " respostas do agente"),
      kpi("problems", "problems", "Falhas", "f", failTotal, failTotal ? failures.length + " tipo" + (failures.length === 1 ? "" : "s") + " de falha" : "nenhuma no período", failTotal > 0)),
    el("div", { class: "split" },
      chartCard("Máquinas ativas por dia", "Quantas máquinas mandaram pacote em cada dia (UTC).", machinesDaily, ["máquina", "máquinas"], 240),
      topFailures)));

  nodes.push(sectionBlock("problems", fmt.format(failTotal), "falhas no período",
    failures.length
      ? el("div", { class: "split" },
          card("Todas as falhas", "Cada linha é uma falha com o motivo; a barra compara com a maior.", barList(failures.slice(0, 15)),
            failures.length > 15 ? el("div", { class: "minor", text: "+ " + (failures.length - 15) + " em Dados brutos" }) : null),
          chartCard("Falhas por dia", "Soma das falhas de cada dia.", perDay(failed), ["falha", "falhas"], 220))
      : el("div", { class: "card empty" }, icon("check"), "Nenhuma falha registrada no período.")));

  nodes.push(sectionBlock("log", fmt.format(logs.length), "linhas distintas", logCard(logs)));

  const usage = [];
  for (const [event, e] of [...byEvent].sort()) {
    if (BAD.has(event) || event === "settings" || !e.dims.length) continue;
    const [title, group, explain] = Object.hasOwn(EVENTS, event) ? EVENTS[event] : [event, "outros", "Evento novo, ainda sem descrição neste painel."];
    if (group === "saude") continue;
    const items = [...e.dims].sort((x, y) => y.value - x.value);
    usage.push(card(title, explain, barList(items.slice(0, 8)),
      items.length > 8 ? el("div", { class: "minor", text: "+ " + (items.length - 8) + " em Dados brutos" }) : null));
  }
  nodes.push(sectionBlock("usage", compactInt(total("message_sent")), "mensagens enviadas",
    el("div", { class: "grid two" },
      chartCard("Mensagens enviadas por dia", EVENTS.message_sent[2], daily("message_sent"), ["mensagem", "mensagens"], 180),
      chartCard("Respostas do agente por dia", EVENTS.turn_finished[2], daily("turn_finished"), ["resposta", "respostas"], 180)),
    usage.length ? groupTitle("Em detalhe") : null, usage.length ? el("div", { class: "grid" }, ...usage) : null));

  if (times.length) nodes.push(sectionBlock("speed", null, null, el("div", { class: "grid" }, ...times)));

  const envCards = [];
  for (const [key, title, explain] of [["version", "Versão do Hangar", "Versão instalada em cada máquina, pelo último pacote dela."],
      ["os", "Sistema", "Sistema operacional de cada máquina."], ["channel", "Canal de atualização", "Estável recebe só versões publicadas; testes recebe antes."]]) {
    const items = data.env.filter(e => e.key === key).map(e => ({ label: key === "channel" && Object.hasOwn(VALUES.channel, e.value) ? VALUES.channel[e.value] : String(e.value), value: e.machines }));
    envCards.push(card(title, explain, items.length ? barList(items) : el("div", { class: "empty", text: "Sem dados." })));
  }
  envCards.push(card("Máquinas por pessoa", "Quantas pessoas usam o Hangar em 1, 2, 3… máquinas (últimos 30 dias).",
    data.per_owner.length ? barList(data.per_owner.map(p => ({ label: p.machines + " máquina" + (p.machines === 1 ? "" : "s"), value: p.owners })))
      : el("div", { class: "empty", text: "Sem dados." })));
  const health = [];
  for (const [event, e] of [...byEvent].sort()) {
    if (BAD.has(event) || !Object.hasOwn(EVENTS, event) || EVENTS[event][1] !== "saude" || !e.dims.length) continue;
    const items = [...e.dims].sort((x, y) => y.value - x.value);
    health.push(card(EVENTS[event][0], EVENTS[event][2], barList(items.slice(0, 8)),
      items.length > 8 ? el("div", { class: "minor", text: "+ " + (items.length - 8) + " em Dados brutos" }) : null));
  }
  nodes.push(sectionBlock("machines", fmt.format(a.machines_30d), "ativas em 30 dias",
    el("div", { class: "grid" }, ...envCards),
    health.length ? groupTitle("Saúde do servidor", "heart") : null, health.length ? el("div", { class: "grid" }, ...health) : null));

  nodes.push(sectionBlock("settings", null, null, ...(settings.nodes.length ? settings.nodes
    : [el("div", { class: "card empty" }, icon("config"), "Nenhuma máquina mandou as preferências ainda: elas chegam a partir da versão que coleta esse retrato.")])));

  const rows = data.counters.map(c => el("tr", { "data-q": (c.event + " " + dimsLabel(c.dims)).toLowerCase() },
    el("td", {}, el("code", { text: c.event })), el("td", { text: dimsLabel(c.dims) }), el("td", { text: c.bucket ? (Object.hasOwn(BUCKET_LABEL, c.bucket) ? BUCKET_LABEL[c.bucket] : c.bucket) : "" }),
    el("td", { class: "n", text: fmt.format(c.count) }), el("td", { class: "n", text: String(c.machines) })));
  nodes.push(sectionBlock("raw", null, null, el("details", { class: "card table", "data-title": "dados brutos" },
    el("summary", {}, icon("chevron"), data.counters.length + " linhas, como chegaram"),
    el("div", { class: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", { text: "Evento" }), el("th", { text: "Detalhe" }), el("th", { text: "Duração" }),
        el("th", { class: "n", text: "Vezes" }), el("th", { class: "n", text: "Máquinas" }))),
      el("tbody", {}, ...rows))))));

  root.replaceChildren(...nodes);
  drawCharts();
  watchCards();
  applyFilter();
  spy();
}

// Gráfico escondido pela busca tem largura 0: fica para quando aparecer de novo.
function drawCharts() {
  document.querySelectorAll(".chart").forEach(slot => {
    if (slot._chart && slot.clientWidth && slot._w !== slot.clientWidth) { slot._w = slot.clientWidth; lineChart(slot); }
  });
}

// Barras crescem e linhas se desenham quando o cartão entra na tela.
let cardObserver = null;
function watchCards() {
  if (!animate) return;
  document.body.classList.add("anim");
  cardObserver?.disconnect();
  cardObserver = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting) { e.target.classList.add("in"); cardObserver.unobserve(e.target); }
  }, { rootMargin: "0px 0px -8% 0px" });
  requestAnimationFrame(() => document.querySelectorAll("#content .card").forEach(c => cardObserver.observe(c)));
}

function drawChips(counts, hot) {
  const box = document.getElementById("chips");
  box.replaceChildren(...SECTIONS.map(([id, name, hue, ic]) => {
    const n = counts[id];
    return el("a", { class: "chip" + (hot[id] ? " hot" : ""), href: "#s-" + id, style: "--hue:" + hue, "data-sec": id },
      icon(ic), name, n != null && n > 0 ? el("em", { text: compact.format(n) }) : null);
  }));
}

// O chip da seção que está na tela fica aceso.
let spyObserver = null;
function spy() {
  spyObserver?.disconnect();
  const visible = new Map();
  spyObserver = new IntersectionObserver(entries => {
    for (const e of entries) visible.set(e.target.id, e.isIntersecting ? e.intersectionRatio : 0);
    const best = [...document.querySelectorAll(".sec")].find(s => (visible.get(s.id) || 0) > 0);
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-current", String(!!best && "s-" + c.dataset.sec === best.id)));
  }, { rootMargin: "-150px 0px -55% 0px", threshold: [0, .01] });
  document.querySelectorAll(".sec").forEach(s => spyObserver.observe(s));
}

// Busca: mostra só as linhas, cartões e seções que têm o texto.
const q = document.getElementById("q"), qClear = document.getElementById("q-clear"), qKey = document.getElementById("q-key");
function applyFilter() {
  const text = q.value.trim().toLowerCase();
  qClear.hidden = !text; qKey.hidden = !!text;
  let hits = 0;
  for (const sec of document.querySelectorAll(".sec")) {
    if (sec.id === "s-overview") { sec.hidden = !!text; continue; }
    let secHits = 0;
    for (const c of sec.querySelectorAll(".card")) {
      const titleHit = !text || (c.dataset.title || "").includes(text);
      let rowHits = 0;
      for (const r of c.querySelectorAll("[data-q]")) {
        const show = titleHit || r.dataset.q.includes(text);
        r.hidden = !show; if (show && text) rowHits++;
      }
      const show = !text || titleHit || rowHits > 0;
      c.hidden = !show;
      if (show && text) { secHits++; hits += Math.max(1, rowHits); }
      if (show && text && c.tagName === "DETAILS" && rowHits) c.open = true;
    }
    sec.hidden = !!text && !secHits;
    sec.querySelectorAll(".group-title").forEach(g => { g.hidden = !!text && !(g.nextElementSibling && [...g.nextElementSibling.children].some(c => !c.hidden)); });
  }
  const notice = document.getElementById("notice");
  notice.hidden = !text;
  if (text) document.getElementById("notice-text").textContent = hits
    ? hits + " resultado" + (hits === 1 ? "" : "s") + " para “" + q.value.trim() + "”"
    : "Nada encontrado para “" + q.value.trim() + "”.";
  document.querySelectorAll(".chip").forEach(c => { const sec = document.getElementById("s-" + c.dataset.sec); c.hidden = !sec || sec.hidden; });
  drawCharts();
}
q.addEventListener("input", applyFilter);
q.addEventListener("keydown", e => { if (e.key === "Escape") { q.value = ""; applyFilter(); q.blur(); } });
const clearSearch = () => { q.value = ""; applyFilter(); q.focus(); };
qClear.addEventListener("click", clearSearch);
document.getElementById("notice-clear").addEventListener("click", clearSearch);
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
});

let current = Number(new URLSearchParams(location.search).get("days")) || 30;
let last = null, request = 0, resizing = 0;
let lastWidth = innerWidth;
window.addEventListener("resize", () => {
  clearTimeout(resizing);
  resizing = setTimeout(() => { if (innerWidth !== lastWidth) { lastWidth = innerWidth; drawCharts(); } }, 150);
});
async function load(days) {
  current = days;
  const mine = ++request;
  document.querySelectorAll("#period button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.days) === days)));
  history.replaceState(null, "", "?days=" + days + location.hash);
  try {
    const res = await fetch("/panel/data?days=" + days, { cache: "no-store" });
    if (res.status === 401) { location.replace("/panel"); return; }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (mine !== request) return;
    last = data;
    render(data);
    const m = data.active.machines_30d, p = data.active.owners_30d;
    document.getElementById("sub").textContent = m + (m === 1 ? " máquina · " : " máquinas · ") + p + (p === 1 ? " pessoa" : " pessoas") + " · dados anônimos";
  } catch (err) {
    if (mine !== request) return;
    document.getElementById("chips").replaceChildren();
    document.getElementById("notice").hidden = true;
    const retry = el("button", { class: "btn", type: "button", text: "Tentar de novo" });
    retry.addEventListener("click", () => load(current));
    document.getElementById("content").replaceChildren(el("div", { class: "error-box" }, icon("alertCircle"),
      el("div", {}, el("b", { text: "Não foi possível ler os dados." }), el("div", { class: "minor", text: err.message })), retry));
  }
}
document.querySelectorAll("#period button").forEach(b => b.addEventListener("click", () => load(Number(b.dataset.days))));

// A barra quebra em linhas no celular: a altura real dela diz onde a seção para ao rolar.
new ResizeObserver(([e]) => document.documentElement.style.setProperty("--bar-h", Math.ceil(e.borderBoxSize[0].blockSize) + "px")).observe(document.getElementById("bar"));
const menu = document.getElementById("menu");
document.addEventListener("click", e => { if (menu.open && !menu.contains(e.target)) menu.open = false; });
fetch("/panel/api/me").then(r => r.ok ? r.json() : null).then(me => {
  if (!me) return;
  document.getElementById("who").textContent = me.email;
  document.getElementById("avatar").textContent = (me.email[0] || "?").toUpperCase();
}).catch(() => {});
document.getElementById("logout").addEventListener("click", async () => {
  const button = document.getElementById("logout");
  try {
    const res = await fetch("/panel/api/logout", { method: "POST" });
    // 401: a sessão já tinha acabado, o que também é ter saído.
    if (!res.ok && res.status !== 401) throw new Error("HTTP " + res.status);
    location.replace("/panel");
  } catch (err) {
    // A sessão continua aberta: dizer isso em vez de parecer que saiu.
    button.lastChild.textContent = "Não saiu (" + err.message + "), tentar de novo";
  }
});
const dialog = document.getElementById("invite-dialog"), link = document.getElementById("invite-link"), text = document.getElementById("invite-text");
document.getElementById("invite").addEventListener("click", async () => {
  menu.open = false;
  link.value = ""; text.textContent = "Gerando o link…";
  dialog.showModal();
  try {
    const res = await fetch("/panel/api/invites", { method: "POST" });
    if (res.status === 401) { location.replace("/panel"); return; }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const body = await res.json();
    link.value = location.origin + body.path;
    text.textContent = "Mande este link a quem você quer dar acesso. Vale " + body.days + " dias e cria uma conta só.";
    link.select();
  } catch (err) {
    text.textContent = "Não deu para gerar o convite (" + err.message + ").";
  }
});
document.getElementById("copy").addEventListener("click", async () => {
  if (!link.value) return;
  const copy = document.getElementById("copy");
  try {
    await navigator.clipboard.writeText(link.value);
    copy.textContent = "Copiado";
  } catch {
    link.select();
    copy.textContent = "Copie à mão (Ctrl+C)";
  }
  setTimeout(() => { copy.textContent = "Copiar"; }, 2500);
});
document.getElementById("close").addEventListener("click", () => dialog.close());
load(current);
</script>
</body>

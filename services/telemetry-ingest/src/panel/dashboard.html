<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Telemetria do Hangar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20200%22%20aria-hidden%3D%22true%22%3E%3Crect%20width%3D%22200%22%20height%3D%22200%22%20rx%3D%2244%22%20fill%3D%22%231b1d1f%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23f5f5f0%22%20stroke-linecap%3D%22round%22%20stroke-width%3D%2217%22%20transform%3D%22translate(0%2016)%22%3E%3Cpath%20d%3D%22M%2033.49%20132.44%20A%2074%2074%200%201%201%20166.51%20132.44%22%2F%3E%3Cpath%20d%3D%22M%2056.96%20109.15%20A%2044%2044%200%201%201%20143.04%20109.15%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="/panel/assets/panel.css">
</head>
<body>
<div class="glow"></div>
<header class="top">
  <div class="top-in">
    <svg class="logo" width="30" height="30" viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" rx="44" fill="#1b1d1f"/><g fill="none" stroke="#f5f5f0" stroke-linecap="round" stroke-width="17" transform="translate(0 16)"><path d="M 33.49 132.44 A 74 74 0 1 1 166.51 132.44"/><path d="M 56.96 109.15 A 44 44 0 1 1 143.04 109.15"/></g></svg>
    <div><h1>Telemetria do Hangar</h1><div class="sub">Contagens anônimas, um pacote por máquina por dia (UTC)</div></div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Período">
      <button data-days="7">7 dias</button><button data-days="30">30 dias</button><button data-days="90">90 dias</button>
    </div>
    <span class="who" id="who"></span>
    <button class="btn" id="invite" type="button">Convidar</button>
    <button class="btn ghost" id="logout" type="button">Sair</button>
  </div>
</header>
<main class="wrap">
  <div id="content"><div class="kpis"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
</main>
<dialog id="invite-dialog">
  <h3>Convidar para o painel</h3>
  <p id="invite-text">Gerando o link…</p>
  <div class="link-box"><input id="invite-link" readonly aria-label="Link do convite"><button class="btn" id="copy" type="button">Copiar</button></div>
  <div class="dialog-actions"><button class="btn ghost" id="close" type="button">Fechar</button></div>
</dialog>
<div id="tip" role="tooltip"></div>
<script>
"use strict";
const EVENTS = {
  app_visible_minutes: ["Minutos com o app à vista", "uso"],
  message_sent: ["Mensagens enviadas", "uso"],
  turn_finished: ["Turnos concluídos", "uso"],
  session_opened: ["Sessões abertas", "uso"],
  feature_used: ["Recursos usados", "uso"],
  mcp_tool: ["Ferramentas do MCP", "uso"],
  voice_call: ["Chamadas de voz", "uso"],
  dictation: ["Ditado", "uso"],
  chat_open: ["Conversa aberta", "uso"],
  client_route: ["Rota do cliente até o servidor", "uso"],
  peers: ["Máquinas ligadas", "uso"],
  problem_shown: ["Problemas mostrados na tela", "saude"],
  problem_hidden: ["Problemas só no diário", "saude"],
  session_open_failed: ["Falhas ao abrir sessão", "saude"],
  send_failed: ["Falhas ao enviar", "saude"],
  session_fallen: ["Sessões que caíram", "saude"],
  server_exit: ["Saídas do servidor", "saude"],
  limit_switch: ["Troca de conta no limite", "saude"],
  client_fatal: ["Erros fatais do app", "saude"],
  update_finished: ["Atualizações", "saude"],
  update_step: ["Passos de atualização", "saude"],
  update_failed_code: ["Falhas de atualização", "saude"],
  server_startup: ["Subida do servidor", "saude"],
  log_dropped: ["Linhas de log fora do teto do dia", "saude"],
};
// Eventos que são falha de verdade: vão à seção Erros, em vermelho.
const BAD = new Set(["problem_shown", "session_open_failed", "send_failed", "session_fallen", "client_fatal", "update_failed_code"]);
const BUCKETS = ["lt100ms", "lt300ms", "lt1s", "lt3s", "lt10s", "lt30s", "ge30s"];
const BUCKET_LABEL = { lt100ms: "menos de 100 ms", lt300ms: "100–300 ms", lt1s: "0,3–1 s", lt3s: "1–3 s", lt10s: "3–10 s", lt30s: "10–30 s", ge30s: "30 s ou mais" };
const ENV_LABEL = { version: "Versão", os: "Sistema", channel: "Canal" };
const fmt = new Intl.NumberFormat("pt-BR");
const compact = new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 });

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v; else if (k === "text") node.textContent = v; else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}
const svgEl = (tag, attrs) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
};

const tip = document.getElementById("tip");
function showTip(text, x, y) {
  tip.textContent = text; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 12)) + "px";
  tip.style.top = Math.max(8, y - h - 12) + "px";
}
function hideTip() { tip.style.display = "none"; }
function withTip(node, text) {
  node.addEventListener("pointermove", e => showTip(text, e.clientX, e.clientY));
  node.addEventListener("pointerleave", hideTip);
  node.addEventListener("focus", () => { const r = node.getBoundingClientRect(); showTip(text, r.left, r.top); });
  node.addEventListener("blur", hideTip);
  return node;
}

function dimsLabel(dims) {
  const entries = Object.entries(dims || {});
  if (!entries.length) return "(sem dimensão)";
  if (entries.length === 1) return entries[0][1];
  return entries.map(([k, v]) => k + ": " + v).join(" · ");
}

// Lista de barras: nome, figura e barra alinhadas; o maior valor enche a trilha.
function barList(items, opts = {}) {
  const max = Math.max(1, ...items.map(i => i.value));
  const box = el("div", { class: "rows" });
  for (const it of items) {
    const row = el("div", { class: "row" + (opts.bad ? " bad" : ""), tabindex: "0" },
      el("div", { class: "lbl", text: it.label }),
      el("div", { class: "num" }, fmt.format(it.value), it.machines != null ? el("small", { text: it.machines + " máq." }) : null),
      el("div", { class: "track" }, el("div", { class: "fill", style: "width:" + (100 * it.value / max).toFixed(2) + "%" })));
    withTip(row, it.label + ": " + fmt.format(it.value) + (it.machines != null ? " (" + it.machines + " máquina" + (it.machines === 1 ? "" : "s") + ")" : ""));
    box.append(row);
  }
  return box;
}

function card(title, name, body, code) {
  return el("section", { class: "card" }, el("h3", { text: title }), name ? el("div", { class: "name" + (code ? " code" : ""), text: name }) : null, body);
}

// Colunas por dia, uma série: o título diz o que é, sem legenda.
function daysChart(daily, days) {
  const byDay = new Map(daily.map(d => [d.day, d.machines]));
  const end = new Date(); end.setUTCHours(0, 0, 0, 0);
  const series = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(end.getTime() - i * 86400000).toISOString().slice(0, 10);
    series.push({ day: d, value: byDay.get(d) || 0 });
  }
  // Na largura real do cartão: o texto dos eixos fica do mesmo tamanho no celular e no PC.
  const W = Math.max(280, document.querySelector("main").clientWidth - 78), H = 200, L = 36, B = 22, T = 8;
  const max = Math.max(1, ...series.map(s => s.value));
  const ticks = Math.min(4, max);
  const step = Math.ceil(max / ticks);
  const top = step * ticks;
  const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img", "aria-label": "Máquinas por dia" });
  for (let i = 0; i <= ticks; i++) {
    const y = T + (H - B - T) * (1 - i / ticks);
    svg.append(svgEl("line", { x1: L, x2: W, y1: y, y2: y, class: i ? "gridline" : "base" }));
    const t = svgEl("text", { x: L - 6, y: y + 4, "text-anchor": "end" }); t.textContent = fmt.format(step * i); svg.append(t);
  }
  const band = (W - L) / series.length;
  const bw = Math.min(24, Math.max(2, band - 2));
  series.forEach((s, i) => {
    const x = L + i * band + (band - bw) / 2;
    const h = (H - B - T) * s.value / top;
    const y = H - B - h;
    if (s.value > 0) {
      const r = Math.min(4, bw / 2, h);
      svg.append(svgEl("path", { class: "col", d: "M" + x + "," + (H - B) + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y +
        "H" + (x + bw - r) + "Q" + (x + bw) + "," + y + " " + (x + bw) + "," + (y + r) + "V" + (H - B) + "Z" }));
    }
    const hit = svgEl("rect", { class: "hit", x: L + i * band, y: T, width: band, height: H - B - T, tabindex: "0" });
    withTip(hit, s.day.split("-").reverse().join("/") + ": " + s.value + " máquina" + (s.value === 1 ? "" : "s"));
    svg.append(hit);
    const every = Math.ceil(series.length / Math.max(2, Math.floor((W - L) / 70)));
    if (i === 0 || i === series.length - 1 || (i % every === 0 && series.length - 1 - i >= every / 2)) {
      const edge = i === 0 ? "start" : i === series.length - 1 ? "end" : "middle";
      const tx = edge === "start" ? L + i * band : edge === "end" ? L + (i + 1) * band : L + i * band + band / 2;
      const t = svgEl("text", { x: tx, y: H - 6, "text-anchor": edge });
      t.textContent = s.day.slice(8, 10) + "/" + s.day.slice(5, 7); svg.append(t);
    }
  });
  return svg;
}


// O filtro do log sobrevive ao redesenho do resize.
let logQuery = "", logLevel = "";
const dayMonth = day => day.slice(8, 10) + "/" + day.slice(5, 7);

function logRow(l) {
  const [label, cls] = l.level === "error" ? ["erro", "error"] : ["aviso", "warn"];
  return el("div", { class: "log-row" },
    el("span", { class: "level " + cls, text: label }),
    el("div", { class: "log-main" }, el("code", { class: "log-msg", text: l.message }), el("div", { class: "log-target", text: l.target })),
    el("div", { class: "log-meta" },
      el("span", { text: fmt.format(l.count) + (l.count === 1 ? " vez" : " vezes") }),
      el("span", { text: l.machines + " máquina" + (l.machines === 1 ? "" : "s") }),
      el("span", { text: "primeira vez " + dayMonth(l.first_day) }),
      el("span", { text: "última vez " + dayMonth(l.last_day) }),
      el("span", { text: (l.versions || []).join(", ") })));
}

function logCard(logs) {
  if (!logs.length) return el("div", { class: "card empty good", text: "Nenhuma linha de erro no período." });
  const search = el("input", { type: "search", class: "log-search", placeholder: "Buscar no texto", "aria-label": "Buscar no log de erros" });
  search.value = logQuery;
  const levels = el("div", { class: "seg", role: "group", "aria-label": "Nível" });
  const list = el("div", { class: "log-list" }), shownCount = el("div", { class: "minor" });
  const draw = () => {
    const q = logQuery.trim().toLowerCase();
    const shown = logs.filter(l => (!logLevel || l.level === logLevel) && (!q || (l.message + " " + l.target).toLowerCase().includes(q)));
    list.replaceChildren(...shown.map(logRow));
    if (!shown.length) list.append(el("div", { class: "empty", text: "Nenhuma linha com esse filtro." }));
    shownCount.textContent = shown.length + " de " + logs.length + " linhas";
  };
  for (const [value, label] of [["", "Todos"], ["error", "Erros"], ["warn", "Avisos"]]) {
    const button = el("button", { type: "button", "aria-pressed": String(value === logLevel), text: label });
    button.addEventListener("click", () => {
      logLevel = value;
      levels.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === button)));
      draw();
    });
    levels.append(button);
  }
  search.addEventListener("input", () => { logQuery = search.value; draw(); });
  draw();
  return el("div", { class: "card" }, el("div", { class: "log-tools" }, search, levels), list, shownCount);
}

function section(title, note) {
  return el("div", { class: "section-title" }, el("h2", { text: title }), note ? el("span", { text: note }) : null);
}

function render(data) {
  const root = document.getElementById("content");
  root.replaceChildren();
  const a = data.active;
  const byEvent = new Map();
  const entry = event => byEvent.get(event) || byEvent.set(event, { dims: [], buckets: new Map() }).get(event);
  // As linhas já vêm agrupadas pelo banco: uma por combinação, mesmo quando dois rótulos saem iguais.
  for (const c of data.by_dims) entry(c.event).dims.push({ label: dimsLabel(c.dims), value: c.count, machines: c.machines });
  for (const c of data.by_bucket) entry(c.event).buckets.set(c.bucket, { value: c.count, machines: c.machines });

  // Falha é o evento de falha inteiro, ou a linha que diz que deu errado (ferramenta com erro, passo que não deu certo).
  const failed = (event, dims) => BAD.has(event) || dims.error === "true" || dims.ok === "false"
    || (event === "update_finished" && dims.result && dims.result !== "updated");
  const failures = [];
  for (const c of data.by_dims) {
    if (!failed(c.event, c.dims || {})) continue;
    const title = Object.hasOwn(EVENTS, c.event) ? EVENTS[c.event][0] : c.event;
    failures.push({ label: title + " · " + dimsLabel(c.dims), value: c.count, machines: c.machines });
  }
  failures.sort((x, y) => y.value - x.value);
  const failTotal = failures.reduce((s, f) => s + f.value, 0);

  const kpi = (label, value, extra = {}) => el("div", { class: "card kpi" + (extra.cls ? " " + extra.cls : "") },
    el("div", { class: "label", text: label }), el("div", { class: "value", text: compact.format(value) }),
    extra.note ? el("div", { class: "note", text: extra.note }) : null);
  root.append(el("div", { class: "kpis" },
    kpi("Máquinas ativas em 30 dias", a.machines_30d, { cls: "hero", note: a.machines_7d + " nos últimos 7 dias" }),
    kpi("Donos em 30 dias", a.owners_30d, { note: a.owners_7d + " em 7 dias" }),
    kpi("Pacotes no período", data.period.batches, { note: data.period.machines + " máquina" + (data.period.machines === 1 ? "" : "s") }),
    kpi("Falhas no período", failTotal, { cls: failTotal ? "bad" : "", note: failTotal ? failures.length + " tipo" + (failures.length === 1 ? "" : "s") : "nenhuma registrada" }),
    kpi("Eventos contados", data.by_dims.reduce((s, d) => s + d.count, 0), { note: byEvent.size + " tipos de evento" })));

  if (!data.period.batches) {
    root.append(el("div", { class: "card empty big" }, "Nenhum pacote chegou neste período. Cada máquina manda o dia depois que ele fecha em UTC."));
    return;
  }

  root.append(section("Erros", "o que falhou para quem usa, por código"));
  root.append(failures.length
    ? el("div", { class: "card" }, barList(failures.slice(0, 15), { bad: true }),
        failures.length > 15 ? el("div", { class: "minor", text: "+ " + (failures.length - 15) + " na tabela no fim" }) : null)
    : el("div", { class: "card empty good", text: "Nenhuma falha registrada no período." }));

  root.append(section("Log de erros", "linhas de aviso e erro do servidor, limpas na máquina antes de sair"), logCard(data.logs || []));

  root.append(section("Máquinas por dia"), el("div", { class: "card" }, daysChart(data.daily, data.days)));

  root.append(section("Onde roda", "pelo último pacote de cada máquina"));
  const envGrid = el("div", { class: "grid" });
  for (const key of ["version", "os", "channel"]) {
    const items = data.env.filter(e => e.key === key).map(e => ({ label: e.value, value: e.machines }));
    envGrid.append(card(ENV_LABEL[key], "máquinas", items.length ? barList(items) : el("div", { class: "empty", text: "Sem dados." })));
  }
  envGrid.append(card("Máquinas por dono", "donos ativos em 30 dias", data.per_owner.length
    ? barList(data.per_owner.map(p => ({ label: p.machines + " máquina" + (p.machines === 1 ? "" : "s"), value: p.owners })))
    : el("div", { class: "empty", text: "Sem dados." })));
  root.append(envGrid);

  const sections = { uso: [], saude: [], tempos: [], outros: [] };
  for (const [event, e] of [...byEvent].sort()) {
    const [title, group] = Object.hasOwn(EVENTS, event) ? EVENTS[event] : [event, "outros"];
    if (BAD.has(event)) continue;
    const items = [...e.dims].sort((x, y) => y.value - x.value);
    const shown = items.slice(0, 12);
    const body = el("div", {}, barList(shown),
      items.length > shown.length ? el("div", { class: "minor", text: "+ " + (items.length - shown.length) + " na tabela no fim" }) : null);
    sections[group].push(card(title, event, body, true));
  }
  for (const [event, e] of [...byEvent].sort()) {
    if (!e.buckets.size) continue;
    const title = Object.hasOwn(EVENTS, event) ? EVENTS[event][0] : event;
    const order = [...e.buckets.keys()].sort((x, y) => BUCKETS.indexOf(x) - BUCKETS.indexOf(y));
    sections.tempos.push(card(title, event, barList(order.map(b => ({ label: BUCKET_LABEL[b] || b, ...e.buckets.get(b) }))), true));
  }
  for (const [key, title, note] of [["uso", "Uso", "o que as pessoas fazem"], ["saude", "Saúde do servidor", "subidas, saídas e atualizações"],
      ["tempos", "Tempos", "quanto cada coisa demorou"], ["outros", "Outros eventos", "ainda sem rótulo neste painel"]]) {
    if (!sections[key].length) continue;
    root.append(section(title, note), el("div", { class: "grid" }, ...sections[key]));
  }

  const rows = data.counters.map(c => el("tr", {},
    el("td", {}, el("code", { text: c.event })), el("td", { text: dimsLabel(c.dims) }), el("td", { text: c.bucket ? (BUCKET_LABEL[c.bucket] || c.bucket) : "" }),
    el("td", { class: "n", text: fmt.format(c.count) }), el("td", { class: "n", text: String(c.machines) })));
  root.append(section("Todos os contadores"), el("details", { class: "card table" },
    el("summary", { text: data.counters.length + " linhas, como chegaram" }),
    el("div", { class: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", { text: "Evento" }), el("th", { text: "Dimensões" }), el("th", { text: "Duração" }),
        el("th", { class: "n", text: "Total" }), el("th", { class: "n", text: "Máquinas" }))),
      el("tbody", {}, ...rows)))));
}

let current = Number(new URLSearchParams(location.search).get("days")) || 30;
let last = null;
let request = 0;
let resizing = 0;
window.addEventListener("resize", () => { clearTimeout(resizing); resizing = setTimeout(() => last && render(last), 150); });
async function load(days) {
  current = days;
  last = null;
  const mine = ++request;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.days) === days)));
  history.replaceState(null, "", "?days=" + days);
  try {
    const res = await fetch("/panel/data?days=" + days, { cache: "no-store" });
    if (res.status === 401) { location.replace("/panel"); return; }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (mine !== request) return;
    last = data;
    render(data);
  } catch (err) {
    if (mine !== request) return;
    document.getElementById("content").replaceChildren(el("div", { class: "error-box", text: "Não foi possível ler os dados (" + err.message + ")." }));
  }
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => load(Number(b.dataset.days))));

fetch("/panel/api/me").then(r => r.ok ? r.json() : null).then(me => { if (me) document.getElementById("who").textContent = me.email; }).catch(() => {});
document.getElementById("logout").addEventListener("click", async () => {
  const button = document.getElementById("logout");
  try {
    const res = await fetch("/panel/api/logout", { method: "POST" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    location.replace("/panel");
  } catch (err) {
    // A sessão continua aberta: dizer isso em vez de parecer que saiu.
    button.textContent = "Não saiu (" + err.message + "), tentar de novo";
  }
});
const dialog = document.getElementById("invite-dialog"), link = document.getElementById("invite-link"), text = document.getElementById("invite-text");
document.getElementById("invite").addEventListener("click", async () => {
  link.value = ""; text.textContent = "Gerando o link…";
  dialog.showModal();
  try {
    const res = await fetch("/panel/api/invites", { method: "POST" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const body = await res.json();
    link.value = location.origin + body.path;
    text.textContent = "Mande este link a quem você quer dar acesso. Vale " + body.days + " dias e cria uma conta só.";
    link.select();
  } catch (err) {
    text.textContent = "Não deu para gerar o convite (" + err.message + ").";
  }
});
document.getElementById("copy").addEventListener("click", async () => {
  if (!link.value) return;
  await navigator.clipboard.writeText(link.value).catch(() => link.select());
  document.getElementById("copy").textContent = "Copiado";
  setTimeout(() => { document.getElementById("copy").textContent = "Copiar"; }, 1500);
});
document.getElementById("close").addEventListener("click", () => dialog.close());
load(current);
</script>
</body>
</html>

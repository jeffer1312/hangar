function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v; else if (k === "text") node.textContent = v; else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}
const svgEl = (tag, attrs) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
};

const tip = document.getElementById("tip");
function showTip(text, x, y) {
  tip.textContent = text; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 12)) + "px";
  tip.style.top = Math.max(8, y - h - 12) + "px";
}
function hideTip() { tip.style.display = "none"; }
function withTip(node, text) {
  node.addEventListener("pointermove", e => showTip(text, e.clientX, e.clientY));
  node.addEventListener("pointerleave", hideTip);
  node.addEventListener("focus", () => { const r = node.getBoundingClientRect(); showTip(text, r.left, r.top); });
  node.addEventListener("blur", hideTip);
  return node;
}

function dimsLabel(dims) {
  const parts = [];
  for (const [k, v] of Object.entries(dims || {}).sort()) {
    // Só "true"/"false" viram a frase da bandeira; outro valor aparece como veio.
    if (Object.hasOwn(FLAGS, k) && (v === "true" || v === "false")) {
      const said = FLAGS[k][v === "true" ? 0 : 1];
      if (said) parts.push(said);
    } else if (Object.hasOwn(VALUES, k) && Object.hasOwn(VALUES[k], v)) {
      parts.push(VALUES[k][v]);
    } else {
      parts.push(Object.hasOwn(KEYS, k) ? KEYS[k] + " " + v : v);
    }
  }
  return parts.length ? parts.join(" · ") : "todas";
}

// Lista de barras: nome, figura e barra alinhadas; o maior valor enche a trilha.
function barList(items, opts = {}) {
  const max = Math.max(1, ...items.map(i => i.value));
  const box = el("div", { class: "rows" });
  for (const it of items) {
    const row = el("div", { class: "row" + (opts.bad ? " bad" : ""), tabindex: "0" },
      el("div", { class: "lbl", text: it.label }),
      el("div", { class: "num" }, fmt.format(it.value), it.machines != null ? el("small", { text: it.machines + " máq." }) : null),
      el("div", { class: "track" }, el("div", { class: "fill", style: "width:" + (100 * it.value / max).toFixed(2) + "%" })));
    withTip(row, it.label + ": " + fmt.format(it.value) + (it.machines != null ? " (" + it.machines + " máquina" + (it.machines === 1 ? "" : "s") + ")" : ""));
    box.append(row);
  }
  return box;
}

function card(title, name, body, code) {
  return el("section", { class: "card" }, el("h3", { text: title }), name ? el("div", { class: "name" + (code ? " code" : ""), text: name }) : null, body);
}

// Colunas por dia, uma série: o título diz o que é, sem legenda.
function daysChart(daily, days, unit = ["máquina", "máquinas"], cls = "col", height = 200, width = 0) {
  const byDay = new Map(daily.map(d => [d.day, d.machines]));
  const end = new Date(); end.setUTCHours(0, 0, 0, 0);
  const series = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(end.getTime() - i * 86400000).toISOString().slice(0, 10);
    series.push({ day: d, value: byDay.get(d) || 0 });
  }
  // Na largura real do cartão: o texto dos eixos fica do mesmo tamanho no celular e no PC.
  const W = width || Math.max(280, document.querySelector("main").clientWidth - 78), H = height, L = 36, B = 22, T = 8;
  const max = Math.max(1, ...series.map(s => s.value));
  const ticks = Math.min(4, max);
  const step = Math.ceil(max / ticks);
  const top = step * ticks;
  const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img", "aria-label": "Máquinas por dia" });
  for (let i = 0; i <= ticks; i++) {
    const y = T + (H - B - T) * (1 - i / ticks);
    svg.append(svgEl("line", { x1: L, x2: W, y1: y, y2: y, class: i ? "gridline" : "base" }));
    const t = svgEl("text", { x: L - 6, y: y + 4, "text-anchor": "end" }); t.textContent = fmt.format(step * i); svg.append(t);
  }
  const band = (W - L) / series.length;
  const bw = Math.min(24, Math.max(2, band - 2));
  series.forEach((s, i) => {
    const x = L + i * band + (band - bw) / 2;
    const h = (H - B - T) * s.value / top;
    const y = H - B - h;
    if (s.value > 0) {
      const r = Math.min(4, bw / 2, h);
      svg.append(svgEl("path", { class: cls, d: "M" + x + "," + (H - B) + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y +
        "H" + (x + bw - r) + "Q" + (x + bw) + "," + y + " " + (x + bw) + "," + (y + r) + "V" + (H - B) + "Z" }));
    }
    const hit = svgEl("rect", { class: "hit", x: L + i * band, y: T, width: band, height: H - B - T, tabindex: "0" });
    withTip(hit, s.day.split("-").reverse().join("/") + ": " + fmt.format(s.value) + " " + unit[s.value === 1 ? 0 : 1]);
    svg.append(hit);
    const every = Math.ceil(series.length / Math.max(2, Math.floor((W - L) / 70)));
    if (i === 0 || i === series.length - 1 || (i % every === 0 && series.length - 1 - i >= every / 2)) {
      const edge = i === 0 ? "start" : i === series.length - 1 ? "end" : "middle";
      const tx = edge === "start" ? L + i * band : edge === "end" ? L + (i + 1) * band : L + i * band + band / 2;
      const t = svgEl("text", { x: tx, y: H - 6, "text-anchor": edge });
      t.textContent = s.day.slice(8, 10) + "/" + s.day.slice(5, 7); svg.append(t);
    }
  });
  return svg;
}


// O filtro do log sobrevive ao redesenho do resize.
let logQuery = "", logLevel = "";
const dayMonth = day => day.slice(8, 10) + "/" + day.slice(5, 7);

function logRow(l) {
  const [label, cls] = l.level === "error" ? ["erro", "error"] : ["aviso", "warn"];
  return el("div", { class: "log-row" },
    el("span", { class: "level " + cls, text: label }),
    el("div", { class: "log-main" }, el("code", { class: "log-msg", text: l.message }), el("div", { class: "log-target", text: l.target })),
    el("div", { class: "log-meta" },
      el("span", { text: fmt.format(l.count) + (l.count === 1 ? " vez" : " vezes") }),
      el("span", { text: l.machines + " máquina" + (l.machines === 1 ? "" : "s") }),
      el("span", { text: "primeira vez " + dayMonth(l.first_day) }),
      el("span", { text: "última vez " + dayMonth(l.last_day) }),
      el("span", { text: (l.versions || []).join(", ") })));
}

function logCard(logs) {
  if (!logs.length) return el("div", { class: "card empty good", text: "Nenhuma linha de erro no período." });
  const search = el("input", { type: "search", class: "log-search", placeholder: "Buscar no texto", "aria-label": "Buscar no log de erros" });
  search.value = logQuery;
  const levels = el("div", { class: "seg", role: "group", "aria-label": "Nível" });
  const list = el("div", { class: "log-list" }), shownCount = el("div", { class: "minor" });
  const draw = () => {
    const q = logQuery.trim().toLowerCase();
    const shown = logs.filter(l => (!logLevel || l.level === logLevel) && (!q || (l.message + " " + l.target).toLowerCase().includes(q)));
    list.replaceChildren(...shown.map(logRow));
    if (!shown.length) list.append(el("div", { class: "empty", text: "Nenhuma linha com esse filtro." }));
    shownCount.textContent = shown.length + " de " + logs.length + " linhas";
  };
  for (const [value, label] of [["", "Todos"], ["error", "Erros"], ["warn", "Avisos"]]) {
    const button = el("button", { type: "button", "aria-pressed": String(value === logLevel), text: label });
    button.addEventListener("click", () => {
      logLevel = value;
      levels.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === button)));
      draw();
    });
    levels.append(button);
  }
  search.addEventListener("input", () => { logQuery = search.value; draw(); });
  draw();
  return el("div", { class: "card" }, el("div", { class: "log-tools" }, search, levels), list, shownCount);
}

function section(title, note) {
  return el("div", { class: "section-title" }, el("h2", { text: title }), note ? el("span", { text: note }) : null);
}

// Série diária completa do período (dia sem pacote = 0), em UTC como os pacotes.
function series(days, valueOf) {
  const end = new Date(); end.setUTCHours(0, 0, 0, 0);
  const out = [];
  for (let i = days - 1; i >= 0; i--) {
    const day = new Date(end.getTime() - i * 86400000).toISOString().slice(0, 10);
    out.push({ day, machines: valueOf(day) });
  }
  return out;
}

// Minilinha do cartão: só a forma da tendência; o número exato está no cartão e no gráfico do dia.
function sparkline(values) {
  const W = 120, H = 32, max = Math.max(1, ...values);
  const step = values.length > 1 ? W / (values.length - 1) : W;
  const pts = values.map((v, i) => (i * step).toFixed(1) + "," + (H - 3 - (H - 6) * v / max).toFixed(1));
  const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, class: "spark", "aria-hidden": "true" });
  svg.append(svgEl("polyline", { points: pts.join(" "), fill: "none", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  return svg;
}

function help(text) {
  return withTip(el("button", { class: "help", type: "button", "aria-label": text, text: "?" }), text);
}

// Faixas de tempo em frase: a faixa onde fica a metade das vezes e onde ficam 9 em cada 10.
const UPPER = { lt100ms: "100 ms", lt300ms: "300 ms", lt1s: "1 s", lt3s: "3 s", lt10s: "10 s", lt30s: "30 s", ge30s: "mais de 30 s" };
// Faixa que este painel ainda não conhece vai para o fim da ordem.
const bucketRank = b => { const i = BUCKETS.indexOf(b); return i < 0 ? BUCKETS.length : i; };
const byBucket = (x, y) => bucketRank(x) - bucketRank(y);
function quantileBucket(buckets, q) {
  const order = [...buckets.keys()].sort(byBucket);
  const total = order.reduce((s, b) => s + buckets.get(b).value, 0);
  let seen = 0;
  for (const b of order) {
    seen += buckets.get(b).value;
    if (seen >= q * total) return b;
  }
  return order[order.length - 1];
}
function timeSentence(buckets) {
  const total = [...buckets.values()].reduce((s, b) => s + b.value, 0);
  const say = b => b === "ge30s" ? "leva mais de 30 s" : Object.hasOwn(UPPER, b) ? "fica em até " + UPPER[b] : "fica na faixa " + b;
  if (total < 5) return "Poucas medidas ainda (" + total + "): o retrato fica confiável com mais dias.";
  return "Metade das vezes " + say(quantileBucket(buckets, 0.5)) + "; 9 em cada 10 " + say(quantileBucket(buckets, 0.9)) + ".";
}

// Uma barra por valor, com o número de máquinas que o escolheram. O mesmo valor em dois apps sai em duas barras:
// somar as máquinas contaria duas vezes a que tem os dois.
function settingsSection(root, rows) {
  if (!rows.length) return;
  const bySetting = new Map();
  for (const c of rows) {
    const d = c.dims || {};
    if (!bySetting.has(d.setting)) bySetting.set(d.setting, []);
    bySetting.get(d.setting).push({ value: d.value, client: d.client, machines: c.machines });
  }
  const groups = new Map([...SETTING_GROUPS, "Outras"].map(g => [g, []]));
  for (const key of Object.keys(SETTINGS).concat([...bySetting.keys()].filter(k => !Object.hasOwn(SETTINGS, k)).sort())) {
    const items = bySetting.get(key);
    if (!items) continue;
    const [title, group, explain] = Object.hasOwn(SETTINGS, key) ? SETTINGS[key] : [key, "Outras", "Preferência nova, ainda sem descrição neste painel."];
    const clients = new Set(items.map(i => i.client)).size;
    const label = i => (key === "default_provider" ? AGENTS[i.value] : SETTING_VALUES[i.value]) || i.value;
    const bars = items.sort((x, y) => y.machines - x.machines).map(i => ({
      label: clients > 1 ? label(i) + " · " + (VALUES.client[i.client] || i.client) : label(i), value: i.machines }));
    groups.get(group).push(el("section", { class: "card" }, el("h3", { text: title }), el("p", { class: "explain", text: explain }), barList(bars)));
  }
  root.append(section("Como configuram", "quantas máquinas escolheram cada opção; cada app manda o retrato uma vez por dia"));
  for (const [group, cards] of groups) {
    if (cards.length) root.append(el("h3", { class: "group-title", text: group }), el("div", { class: "grid" }, ...cards));
  }
}

function render(data) {
  const root = document.getElementById("content");
  root.replaceChildren();
  const a = data.active;
  const byEvent = new Map();
  const entry = event => byEvent.get(event) || byEvent.set(event, { dims: [], buckets: new Map() }).get(event);
  // As linhas já vêm agrupadas pelo banco: uma por combinação, mesmo quando dois rótulos saem iguais.
  for (const c of data.by_dims) entry(c.event).dims.push({ label: dimsLabel(c.dims), value: c.count, machines: c.machines });
  for (const c of data.by_bucket) entry(c.event).buckets.set(c.bucket, { value: c.count, machines: c.machines });
  const total = event => (byEvent.get(event)?.dims || []).reduce((s, d) => s + d.value, 0);

  // Falha é o evento de falha inteiro, ou a linha que diz que deu errado (ferramenta com erro, passo que não deu certo).
  const failed = (event, dims) => BAD.has(event) || dims.error === "true" || dims.ok === "false"
    || (event === "update_finished" && dims.result && dims.result !== "updated");
  const failures = [];
  for (const c of data.by_dims) {
    if (!failed(c.event, c.dims || {})) continue;
    const title = Object.hasOwn(EVENTS, c.event) ? EVENTS[c.event][0] : c.event;
    failures.push({ label: title + " · " + dimsLabel(c.dims), value: c.count, machines: c.machines });
  }
  failures.sort((x, y) => y.value - x.value);
  const failTotal = failures.reduce((s, f) => s + f.value, 0);

  const perDay = (keep) => {
    const sums = new Map();
    for (const t of data.trend || []) if (keep(t.event, t.dims || {})) sums.set(t.day, (sums.get(t.day) || 0) + t.count);
    return series(data.days, day => sums.get(day) || 0);
  };
  const daily = event => perDay(e => e === event);
  const machinesDaily = series(data.days, day => (data.daily.find(d => d.day === day) || {}).machines || 0);
  const failDaily = perDay(failed);

  const kpi = (label, value, explain, spark, cls) => el("div", { class: "card kpi" + (cls ? " " + cls : "") },
    el("div", { class: "label" }, label, help(explain)),
    el("div", { class: "value", text: compact.format(value) }),
    spark ? sparkline(spark.map(s => s.machines)) : null);
  root.append(el("div", { class: "kpis" },
    kpi("Máquinas ativas", a.machines_30d, "Máquinas que mandaram pelo menos um pacote nos últimos 30 dias. Nos últimos 7: " + a.machines_7d + ".", machinesDaily, "hero"),
    kpi("Pessoas", a.owners_30d, "Pessoas que usam o Hangar, contadas uma vez mesmo com várias máquinas (cada instalação guarda um número aleatório do dono). Nos últimos 7 dias: " + a.owners_7d + "."),
    kpi("Mensagens enviadas", total("message_sent"), EVENTS.message_sent[2], daily("message_sent")),
    kpi("Respostas do agente", total("turn_finished"), EVENTS.turn_finished[2], daily("turn_finished")),
    kpi("Falhas", failTotal, "Tudo o que deu errado para quem usa no período: sessão que não abriu, mensagem recusada, queda do app, ferramenta com erro, atualização que falhou.", failDaily, failTotal ? "bad" : "")));

  if (!data.period.batches) {
    root.append(el("div", { class: "card empty big" }, "Nenhum pacote chegou neste período. Cada máquina manda o dia depois que ele fecha em UTC (21h em Brasília)."));
    return;
  }

  root.append(section("Erros", "o que falhou para quem usa"));
  root.append(failures.length
    ? el("div", { class: "card" }, barList(failures.slice(0, 15), { bad: true }),
        failures.length > 15 ? el("div", { class: "minor", text: "+ " + (failures.length - 15) + " na tabela no fim" }) : null)
    : el("div", { class: "card empty good", text: "Nenhuma falha registrada no período." }));

  root.append(section("Log de erros", "linhas de aviso e erro do servidor, limpas na máquina antes de sair"), logCard(data.logs || []));

  // Gráficos pequenos lado a lado, um por medida: cada um tem a própria escala e dispensa legenda.
  const mainW = document.querySelector("main").clientWidth;
  const cols = mainW >= 860 ? 2 : 1;
  const chartW = Math.max(260, Math.floor((mainW - 12 * (cols - 1)) / cols) - 40);
  const mini = (title, explain, rows, unit, cls) => el("section", { class: "card" },
    el("h3", {}, title, help(explain)), el("div", { class: "chart" }, daysChart(rows, data.days, unit, cls, 150, chartW)));
  root.append(section("Por dia", "dias em UTC"), el("div", { class: "grid two" },
    mini("Máquinas ativas", "Quantas máquinas mandaram pacote em cada dia.", machinesDaily, ["máquina", "máquinas"], "col"),
    mini("Mensagens enviadas", EVENTS.message_sent[2], daily("message_sent"), ["mensagem", "mensagens"], "col"),
    mini("Respostas do agente", EVENTS.turn_finished[2], daily("turn_finished"), ["resposta", "respostas"], "col"),
    mini("Falhas", "Soma das falhas de cada dia.", failDaily, ["falha", "falhas"], "col bad")));

  // Tempos: a frase responde "isso está rápido?"; as barras mostram como as vezes se espalham.
  const times = [];
  for (const [event, e] of [...byEvent].sort()) {
    if (!e.buckets.size) continue;
    const [title, , explain] = Object.hasOwn(EVENTS, event) ? EVENTS[event] : [event, "", ""];
    const order = [...e.buckets.keys()].sort(byBucket);
    times.push(el("section", { class: "card" },
      el("h3", { text: title }), el("p", { class: "explain", text: explain }),
      el("p", { class: "headline", text: timeSentence(e.buckets) }),
      barList(order.map(b => ({ label: BUCKET_LABEL[b] || b, ...e.buckets.get(b) })))));
  }
  if (times.length) root.append(section("Quanto demora", "cada barra é uma faixa de tempo; quanto maior, mais vezes caiu ali"), el("div", { class: "grid" }, ...times));

  const sections = { uso: [], saude: [], outros: [] };
  for (const [event, e] of [...byEvent].sort()) {
    if (BAD.has(event) || event === "settings") continue;
    const [title, group, explain] = Object.hasOwn(EVENTS, event) ? EVENTS[event] : [event, "outros", "Evento novo, ainda sem descrição neste painel."];
    const items = [...e.dims].sort((x, y) => y.value - x.value);
    const shown = items.slice(0, 12);
    sections[group].push(el("section", { class: "card" },
      el("h3", { text: title }), el("p", { class: "explain", text: explain }),
      barList(shown),
      items.length > shown.length ? el("div", { class: "minor", text: "+ " + (items.length - shown.length) + " na tabela no fim" }) : null));
  }
  if (sections.uso.length) root.append(section("Como usam", "o que as pessoas fazem com o Hangar"), el("div", { class: "grid" }, ...sections.uso));
  settingsSection(root, data.by_dims.filter(c => c.event === "settings"));

  root.append(section("Onde roda", "pelo último pacote de cada máquina"));
  const envGrid = el("div", { class: "grid" });
  for (const [key, title, explain] of [["version", "Versão do Hangar", "Versão instalada em cada máquina."],
      ["os", "Sistema", "Sistema operacional de cada máquina."], ["channel", "Canal de atualização", "Estável recebe só versões publicadas; testes recebe antes."]]) {
    const items = data.env.filter(e => e.key === key).map(e => ({ label: key === "channel" ? (VALUES.channel[e.value] || e.value) : e.value, value: e.machines }));
    envGrid.append(el("section", { class: "card" }, el("h3", { text: title }), el("p", { class: "explain", text: explain }),
      items.length ? barList(items) : el("div", { class: "empty", text: "Sem dados." })));
  }
  envGrid.append(el("section", { class: "card" }, el("h3", { text: "Máquinas por pessoa" }),
    el("p", { class: "explain", text: "Quantas pessoas usam o Hangar em 1, 2, 3… máquinas (últimos 30 dias)." }),
    data.per_owner.length
      ? barList(data.per_owner.map(p => ({ label: p.machines + " máquina" + (p.machines === 1 ? "" : "s"), value: p.owners })))
      : el("div", { class: "empty", text: "Sem dados." })));
  root.append(envGrid);

  if (sections.saude.length) root.append(section("Saúde do servidor", "subidas, saídas e atualizações"), el("div", { class: "grid" }, ...sections.saude));
  if (sections.outros.length) root.append(section("Outros eventos", "ainda sem descrição neste painel"), el("div", { class: "grid" }, ...sections.outros));

  const rows = data.counters.map(c => el("tr", {},
    el("td", {}, el("code", { text: c.event })), el("td", { text: dimsLabel(c.dims) }), el("td", { text: c.bucket ? (BUCKET_LABEL[c.bucket] || c.bucket) : "" }),
    el("td", { class: "n", text: fmt.format(c.count) }), el("td", { class: "n", text: String(c.machines) })));
  root.append(section("Todos os contadores"), el("details", { class: "card table" },
    el("summary", { text: data.counters.length + " linhas, como chegaram" }),
    el("div", { class: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", { text: "Evento" }), el("th", { text: "Detalhe" }), el("th", { text: "Duração" }),
        el("th", { class: "n", text: "Vezes" }), el("th", { class: "n", text: "Máquinas" }))),
      el("tbody", {}, ...rows)))));
}

let current = Number(new URLSearchParams(location.search).get("days")) || 30;
let last = null;
let request = 0;
let resizing = 0;
window.addEventListener("resize", () => { clearTimeout(resizing); resizing = setTimeout(() => last && render(last), 150); });
async function load(days) {
  current = days;
  last = null;
  const mine = ++request;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.days) === days)));
  history.replaceState(null, "", "?days=" + days);
  try {
    const res = await fetch("/panel/data?days=" + days, { cache: "no-store" });
    if (res.status === 401) { location.replace("/panel"); return; }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (mine !== request) return;
    last = data;
    render(data);
  } catch (err) {
    if (mine !== request) return;
    document.getElementById("content").replaceChildren(el("div", { class: "error-box", text: "Não foi possível ler os dados (" + err.message + ")." }));
  }
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => load(Number(b.dataset.days))));

fetch("/panel/api/me").then(r => r.ok ? r.json() : null).then(me => { if (me) document.getElementById("who").textContent = me.email; }).catch(() => {});
document.getElementById("logout").addEventListener("click", async () => {
  const button = document.getElementById("logout");
  try {
    const res = await fetch("/panel/api/logout", { method: "POST" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    location.replace("/panel");
  } catch (err) {
    // A sessão continua aberta: dizer isso em vez de parecer que saiu.
    button.textContent = "Não saiu (" + err.message + "), tentar de novo";
  }
});
const dialog = document.getElementById("invite-dialog"), link = document.getElementById("invite-link"), text = document.getElementById("invite-text");
document.getElementById("invite").addEventListener("click", async () => {
  link.value = ""; text.textContent = "Gerando o link…";
  dialog.showModal();
  try {
    const res = await fetch("/panel/api/invites", { method: "POST" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const body = await res.json();
    link.value = location.origin + body.path;
    text.textContent = "Mande este link a quem você quer dar acesso. Vale " + body.days + " dias e cria uma conta só.";
    link.select();
  } catch (err) {
    text.textContent = "Não deu para gerar o convite (" + err.message + ").";
  }
});
document.getElementById("copy").addEventListener("click", async () => {
  if (!link.value) return;
  await navigator.clipboard.writeText(link.value).catch(() => link.select());
  document.getElementById("copy").textContent = "Copiado";
  setTimeout(() => { document.getElementById("copy").textContent = "Copiar"; }, 1500);
});
document.getElementById("close").addEventListener("click", () => dialog.close());
load(current);
</script>

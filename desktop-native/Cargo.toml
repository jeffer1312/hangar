[package]
name = "hangar-native"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.6.6"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
futures = "=0.3.34"
eventsource-stream = "=0.2.3"
url = "=2.5.8"
async-channel = "=2.5.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ring = "=0.17.14"
base64 = "=0.22.1"

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component-0.6.6" }
gpui-base = { path = "vendor/gpui-base-0.6.6" }
gpui-pre = { path = "vendor/gpui-pre-0.3.6" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu-0.3.6" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos-0.3.6" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple-0.3.6" }

[profile.dev]
debug = 0

[profile.release]
strip = true

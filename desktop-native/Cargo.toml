[package]
name = "hangar-native"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = { version = "=0.7.0", features = [
    "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-csharp",
    "tree-sitter-css", "tree-sitter-diff", "tree-sitter-elixir", "tree-sitter-go", "tree-sitter-html",
    "tree-sitter-java", "tree-sitter-javascript", "tree-sitter-kotlin", "tree-sitter-lua", "tree-sitter-make",
    "tree-sitter-markdown", "tree-sitter-php", "tree-sitter-python", "tree-sitter-ruby", "tree-sitter-rust",
    "tree-sitter-scala", "tree-sitter-sql", "tree-sitter-svelte", "tree-sitter-swift", "tree-sitter-toml",
    "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml", "tree-sitter-zig",
] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
# Formatos da conversa compartilhados com o hangar-server: um tipo só dos dois lados.
hangar-api = { path = "../crates/hangar-api" }
hangar-workspace = { path = "../crates/hangar-workspace" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
futures = "=0.3.34"
eventsource-stream = "=0.2.3"
url = "=2.5.8"
async-channel = "=2.5.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ring = "=0.17.14"
base64 = "=0.22.1"
alacritty_terminal = { version = "=0.26.0", default-features = false }
rusty-leveldb = "=4.0.1"
notify = "=7.0.0"
cpal = "=0.18.2"
# Voz: WebRTC sans-IO (cripto aws-lc-rs, a mesma do rustls), Opus e cancelamento de eco, todos em Rust puro.
str0m = "=0.24.1"
opus-rs = "=0.1.37"
sonora = { version = "=0.2.0", default-features = false }
notify-rust = "=4.18.0"
symphonia = { version = "=0.5.4", features = ["mp3", "aac", "isomp4"] }
tree-sitter = "=0.26.13"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-swift = "=0.7.3"
tree-sitter-pascal = "=0.10.2"
tree-sitter-dart = "=0.2.0"
tree-sitter-kotlin-sg = "=0.4.1"
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
wry = "=0.55.1"

[target.'cfg(target_os = "windows")'.dependencies]
# Mesmas versões que o wry já usa: tipos COM de versões diferentes não se misturam.
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# O navegador é um Chromium sem janela: o pipe do CDP vai nos fd 3 e 4 dele, e o quadro numa textura do device da GPUI.
libc = "=0.2.189"
# Decifrar as senhas salvas do Chrome do usuário (Login Data, AES-128-CBC v10) para preencher o login. Já no grafo
# via oo7; a chave PBKDF2-SHA1 vem do `ring` que o app já usa.
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["block-padding"] }
gpui-pre-wgpu = "=0.3.7"
# Ícone na bandeja (StatusNotifierItem) sobre o zbus que o notify-rust já traz. Sem a feature padrão `tokio`: ela
# trocaria o executor do zbus para todos os usuários dele.
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }
# O mesmo zbus do ksni, para perguntar à bandeja se há uma barra hospedando os ícones.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
embed-resource = "=3.0.11"

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component-0.7.0" }
gpui-base = { path = "vendor/gpui-base-0.7.0" }
gpui-pre = { path = "vendor/gpui-pre-0.3.7" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux-0.3.7" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu-0.3.7" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos-0.3.7" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple-0.3.7" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows-0.3.7" }

[profile.dev]
debug = 0

# Dependências (GPUI, wgpu) otimizadas uma vez e guardadas: o build de ajuste só recompila o app e a janela fica fluida.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

# O binário publicado pela main: LTO completo e uma unidade de código. Fica em target/dist/, à parte do
# release comum (o da pré-release de branch), que continua rápido de compilar.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

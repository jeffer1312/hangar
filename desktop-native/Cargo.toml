[package]
name = "hangar-native"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = { version = "=0.7.0", features = [
    "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-csharp",
    "tree-sitter-css", "tree-sitter-go", "tree-sitter-html", "tree-sitter-java",
    "tree-sitter-javascript", "tree-sitter-kotlin", "tree-sitter-lua", "tree-sitter-markdown",
    "tree-sitter-php", "tree-sitter-python", "tree-sitter-ruby", "tree-sitter-rust",
    "tree-sitter-sql", "tree-sitter-svelte", "tree-sitter-swift", "tree-sitter-toml",
    "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml",
] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
# Formatos da conversa compartilhados com o hangar-server: um tipo só dos dois lados.
hangar-api = { path = "../crates/hangar-api" }
hangar-workspace = { path = "../crates/hangar-workspace" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
futures = "=0.3.34"
eventsource-stream = "=0.2.3"
url = "=2.5.8"
async-channel = "=2.5.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ring = "=0.17.14"
base64 = "=0.22.1"
alacritty_terminal = { version = "=0.26.0", default-features = false }
rusty-leveldb = "=4.0.1"
notify = "=7.0.0"
cpal = "=0.18.2"
notify-rust = "=4.18.0"
symphonia = { version = "=0.5.4", features = ["mp3", "aac", "isomp4"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
wry = "=0.55.1"

[target.'cfg(target_os = "windows")'.dependencies]
# Mesmas versões que o wry já usa: tipos COM de versões diferentes não se misturam.
webview2-com = "=0.38.2"
windows = "=0.61.3"

[target.'cfg(target_os = "linux")'.dependencies]
# O navegador é um Chromium sem janela: o pipe do CDP vai nos fd 3 e 4 dele, e o quadro numa textura do device da GPUI.
libc = "=0.2.189"
gpui-pre-wgpu = "=0.3.7"

[build-dependencies]
embed-resource = "=3.0.11"

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component-0.7.0" }
gpui-base = { path = "vendor/gpui-base-0.7.0" }
gpui-pre = { path = "vendor/gpui-pre-0.3.7" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux-0.3.7" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu-0.3.7" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos-0.3.7" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple-0.3.7" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows-0.3.7" }

[profile.dev]
debug = 0

# Dependências (GPUI, wgpu) otimizadas uma vez e guardadas: o build de ajuste só recompila o app e a janela fica fluida.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

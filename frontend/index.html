<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Default; o theme.ts atualiza em runtime conforme o tema (dark/light) -> a toolbar do Safari
         e a status bar acompanham (senao ficava barra escura fixa no tema claro). -->
    <meta name="theme-color" content="#100e11" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Hangar</title>
    <!-- lang="en" no HTML servido e o FALLBACK HONESTO, nao uma mentira: com baseLocale = en,
         e o idioma que o app usa quando nada resolve (sem JS, sem escolha, idioma desconhecido).
         O body e so <div id="app"> — sem JS nao ha texto pra leitor de tela pronunciar com o
         idioma errado, e o caminho de falha e inofensivo. O script abaixo corrige o lang para o
         idioma REAL (localStorage -> navigator.languages, first-match como o runtime do Paraglide)
         ANTES do primeiro paint, entao o Chrome decide a oferta de traducao sobre o valor ja
         corrigido. O main.ts reescreve por seguranca (rede) depois de montar. -->
    <script>
      (function () {
        try {
          var l = localStorage.getItem('PARAGLIDE_LOCALE');
          if (l === 'pt' || l === 'en') {
            document.documentElement.lang = l === 'pt' ? 'pt-BR' : 'en';
            return;
          }
          // Mesma ordem do runtime: percorre navigator.languages e para no PRIMEIRO que casa por
          // idioma-base. 'pt' ganha de 'en' SÓ se vier antes na lista — a preferencia do usuario
          // manda, nao a presenca de pt em qualquer posicao.
          var lista = navigator.languages || [navigator.language];
          for (var i = 0; i < lista.length; i++) {
            var base = (lista[i] || '').split('-')[0].toLowerCase();
            if (base === 'pt') { document.documentElement.lang = 'pt-BR'; return; }
            if (base === 'en') { document.documentElement.lang = 'en'; return; }
          }
          document.documentElement.lang = 'en';
        } catch (e) { /* storage off/modo privado: fica sem lang, o main.ts reescreve */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

.unread{width:7px;height:7px;border-radius:50%;background:#c8b6ff;display:inline-block;margin-right:7px;vertical-align:2px}
.fix{cursor:pointer;color:#c9c5d2}
.fix ul{margin:8px 0 0;padding-left:18px;color:#aeaab8;font-size:13px}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.lrow:last-child{border:0}.lrow .dt{width:56px;color:#8e8a98;font-size:13px;flex:none}.lrow .chev{margin-left:auto;color:#6f6b79}

.tabs{display:inline-flex;gap:22px;background:rgba(32,29,37,.7);border-radius:10px;padding:8px 16px;margin-bottom:28px;font-size:14px;color:#dcd9e3}
.tabs span{cursor:pointer}.tabs span.on{color:#fff;font-weight:600}
.layout{display:flex;gap:34px;justify-content:center}
.toc{width:200px;flex:none;padding-top:150px;font-size:13px;color:#a8a4b2}
.toc .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8e8a98;margin-bottom:8px}

.art p{color:#d4d1db;margin:0 0 10px;font-size:15px}.art h3{font-size:16px;margin:24px 0 8px}
.code{font:13px ui-monospace,monospace;background:rgba(255,255,255,.08);border-radius:5px;padding:1px 6px}
.note{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.06);border-radius:9px;padding:10px 14px;font-size:13px;color:#d4d1db;margin:12px 0}

function pageManual(){
 if(article!==null){const a=MAN[article];return `<div class="layout"><div class="col art" style="margin:0"><span class="crumb" data-aback="1">${svg('left').replace('<svg','<svg width="14" height="14"')} Manual · ${a.c}</span><h2 class="pt">${a.t}</h2><p class="ps">${a.d}</p>
 <h3>${a.s[0]}</h3><p>No computador, abra <span class="code">Configurações › Connect</span> e entre com a sua conta. No celular, toque em "Entrar com o Hangar Connect" e escolha esta máquina.</p><span class="btn">${svg('eye')}Mostrar no app</span>
 <h3>${a.s[1]}</h3><p>Com o Tailscale ligado nas duas pontas, use o endereço que aparece em <span class="code">Configurações › Instalar no celular</span>.</p>
 <div class="note">${svg('info').replace('<svg','<svg width="16" height="16"')} Mudou recentemente: <b style="margin-left:4px">Seu computador no celular, sem VPN</b> (7 de novembro).</div>
 <h3>${a.s[2]}</h3><p>Leia o QR code da tela Instalar no celular.</p><h3>${a.s[3]}</h3><p>Confira se as duas máquinas aparecem em Servidores.</p></div>
 <div class="toc"><div class="h">Nesta página</div>${a.s.map((s,i)=>`<div class="${i?'':'on'}">${s}</div>`).join('')}</div></div>`}
 const cats=[...new Set(MAN.map(m=>m.c))];
 return `<div class="col"><div style="text-align:center"><div class="tabs">${cats.map(c=>`<span class="${c===cat?'on':''}" data-cat="${c}">${c}</span>`).join('')}</div></div><h2 class="pt">Manual</h2><p class="ps">Como usar cada parte do Hangar, por tarefa.</p><div class="bar"><div class="find" style="margin-left:0;width:100%">${svg('search')}Buscar no manual</div></div>
 <div class="sec">${cat}</div><div class="grp">${MAN.filter(m=>m.c===cat).map(m=>`<div class="row" style="cursor:pointer" data-art="${MAN.indexOf(m)}"><div class="tile">${svg(m.i)}</div><div style="flex:1"><div class="rt">${m.t}</div><div class="rd">${m.d}</div></div><span class="rr" style="color:#6f6b79;align-self:center">›</span></div>`).join('')}</div>
 <div class="sec">Últimas atualizações<span>no Manual também</span></div><div class="grp">${N.filter(n=>n.k==='novo').slice(0,3).map(n=>`<div class="lrow" data-page="atual"><div class="tile" style="width:30px;height:30px">${svg(n.i)}</div><div class="rt" style="font-size:14px">${n.t}</div><span class="chev">${+n.d} nov ›</span></div>`).join('')}</div></div>`}
const OPTS={atual:[['A','Atualizações · A — feed com cartões'],['B','Atualizações · B — lista e detalhe']],manual:[['M','Manual — tarefas e artigo']]};
function render(){
 document.getElementById('opts').innerHTML=[['atual','A','A · Atualizações em cartões'],['atual','B','B · Atualizações em lista + detalhe'],['manual','M','C · Manual']].map(([p,o,l])=>`<button class="opt ${page===p&&(p==='manual'||opt===o)?'on':''}" data-go="${p}:${o}">${l}</button>`).join('')+'<span class="hint">tudo é clicável: filtros, linhas, correções, categorias e artigos</span>';
 document.getElementById('side').innerHTML=sideHTML();
 document.getElementById('main').innerHTML=page==='manual'?pageManual():opt==='A'?pageA():pageB();}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-page],[data-f],[data-fix],[data-d],[data-back],[data-cat],[data-art],[data-aback]');if(!t)return;const s=t.dataset;
 if(s.go){const[p,o]=s.go.split(':');page=p;if(p==='atual')opt=o;detail=null;article=null}
 if(s.page){page=s.page;detail=null;article=null}
 if(s.f){filt=s.f;detail=null}if(s.fix)openFix[s.fix]=!openFix[s.fix];if(s.d)detail=+s.d;if(s.back)detail=null;
 if(s.cat){cat=s.cat;article=null}if(s.art)article=+s.art;if(s.aback)article=null;
 render();document.getElementById('main').scrollTop=0});
function fit(){const k=Math.min(1,(document.documentElement.clientWidth)/1284);const f=document.getElementById('fit');f.style.transform=`scale(${k})`;document.body.style.height=(f.offsetHeight*k)+'px'}
render();fit();addEventListener('resize',fit);
</script></body></html>

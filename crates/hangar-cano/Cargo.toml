[package]
name = "hangar-cano"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "hangar-cano"
path = "src/main.rs"

# O filho falso dos testes de contrato (`claude` e `app-server`), no lugar do script Python.
[[bin]]
name = "hangar-cano-fake-agent"
path = "tests/fixtures/fake_agent.rs"
test = false
bench = false

[dependencies]
tokio = { workspace = true, features = ["rt", "net", "process", "signal", "io-util", "time", "sync", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Globalization"] }

[package]
name = "hangar-server"
version.workspace = true
edition.workspace = true
publish = false
# Os testes de integração são um executável só (tests/it/) mais os que precisam de processo próprio.
autotests = false

[[test]]
name = "usage_cli"
path = "tests/usage_cli.rs"

[[bin]]
name = "hangar-dictation-fixture"
path = "tests/fixtures/dictation_cli.rs"
test = false
bench = false

[[bin]]
name = "hangar-commands-fixture"
path = "tests/fixtures/commands_cli.rs"
test = false
bench = false

[[test]]
name = "diag_client"
path = "tests/diag_client.rs"

[[test]]
name = "other_terminal_drive"
path = "tests/other_terminal_drive.rs"

[[test]]
name = "other_terminal_lifecycle"
path = "tests/other_terminal_lifecycle.rs"

[dependencies]
hangar-scheduled-tasks.workspace = true
chrono-tz.workspace = true
iana-time-zone.workspace = true
hangar-conversation-transfer.workspace = true
hangar-codex-transfer.workspace = true
hangar-session-tools.workspace = true
hangar-projects.workspace = true
hangar-auth = { path = "../hangar-auth" }
# float_roundtrip: o float lido sai com o mesmo valor que o float() do Python, e o repr bate.
# alloc (aqui, no serde e o signal do tokio): as features que o resto do workspace pede. Sem elas,
# `cargo test -p hangar-server` e `cargo test --workspace` compilam o servidor com features diferentes
# e cada um guarda a sua cópia de tudo no target.
serde_json = { workspace = true, features = ["float_roundtrip", "alloc", "unbounded_depth", "arbitrary_precision", "raw_value"] }
indexmap.workspace = true
hangar-api.workspace = true
hangar-codex.workspace = true
hangar-core.workspace = true
hangar-codex-account-sync.workspace = true
hangar-transcript.workspace = true
hangar-omp-sync.workspace = true
hangar-plugins.workspace = true
hangar-workflows.workspace = true
hangar-http-file.workspace = true
hangar-desktop-theme.workspace = true
hangar-shortcut-transfer.workspace = true
hangar-opencode-cookie.workspace = true
hangar-deploy.workspace = true
hangar-port-preview.workspace = true
hangar-connect.workspace = true
toml = { version = "=1.1.7", default-features = false, features = ["parse", "std", "serde", "preserve_order"] }
hangar-workspace = { path = "../hangar-workspace" }
hangar-reviews.workspace = true
hangar-psmux.workspace = true
# Pacote por versão: índice, manifesto e extração conferida (`update/`).
hangar-package = { path = "../hangar-package" }
# O que cada atualização trouxe e o que cada aparelho já viu (`update_arrived`).
hangar-update-news = { path = "../hangar-update-news" }
regex.workspace = true
# A guarda conserva lookaround e grupos nomeados aceitos pelo re.search anterior.
fancy-regex = "=0.20.0"
# A consulta estrita conserva as grafias e os aliases aceitos pela referência.
unicode_names2 = "=1.3.0"
# Largura em células para cortar o pane na coluna da conversa (`plugin_screen.cell_width`).
unicode-width = "=0.2.2"
memchr.workspace = true
md-5.workspace = true
sha1_smol.workspace = true
# sha256 do workdir_key do Kimi; já vem pelo rustls, sem crate novo.
ring.workspace = true
qrcode = { version = "=0.14.1", default-features = false }
serde = { workspace = true, features = ["alloc"] }
serde-saphyr.workspace = true
axum = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
# Tela web baixada da release (`ui::fetch`); a mesma versão do `hangar-package`, sem xattr.
tar = { version = "=0.4.46", default-features = false }
form_urlencoded = { workspace = true }
futures-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
subtle = { workspace = true }
# io-std: o stdin é o cano que avisa a morte do Python.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "fs", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
eventsource-stream = { workspace = true }
http-body-util = { workspace = true }
notify = { workspace = true }
percent-encoding = { workspace = true }
mime_guess = "=2.0.5"
base64.workspace = true
# Servidor MCP `hangar` (`mcp/`): o SDK oficial e o transporte HTTP streamable; o `tower-service` chama o
# roteador público por dentro.
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tower-service = "=0.3.3"
rusqlite.workspace = true
rayon.workspace = true
reqwest = { workspace = true, features = ["rustls", "multipart"] }
# Painel de terminal real (`term/`): PTY no Unix, ConPTY no Windows.
portable-pty = "=0.9.0"
unicode-normalization = "=0.1.25"
socket2 = "=0.6.5"
# Perfil temporário e CDP do Chromium que mede e fotografa as páginas (`pages/chrome.rs`); mesma versão que o axum puxa.
tempfile.workspace = true
tokio-tungstenite.workspace = true
# Processos fora do Linux (`list/procs.rs`; no Linux o leitor é o /proc) e o `observe_system` da voz.
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
# Canal da voz que vários consumidores leem (`voice/rpc.rs`); mesma versão do nativo.
async-channel = "=2.5.0"
# Miniatura de imagem (`thumbnail.rs`); mesma versão e features do nativo.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
num-bigint.workspace = true
idevice.workspace = true
plist.workspace = true
# Login Apple e assinatura do SideStore (`device_install::apple`): a versão provada no iPad, sem o
# keyring do sistema (o estado fica em `~/.hangar/devices/apple`).
isideload = { version = "=0.5.0", default-features = false, features = ["install", "tokio-mt", "fs-storage"] }
rootcause = "=0.12.1"
# A pasta temporária onde o isideload extrai o IPA, para apagá-la.
isideload-vfs = "=0.0.1"
# A senha da Apple ID só em memória, zerada ao sair.
zeroize = { version = "=1.9.0", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_System_SystemInformation", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_Xps", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
hangar-core = { workspace = true, features = ["test-support"] }
# Pacote .zip do frp que o teste do supervisor monta (`tests/it/connect_supervisor.rs`).
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
rqrr = { version = "=0.11.0", default-features = false }
proptest.workspace = true
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
# Relógio pausado: as rodadas do `state::Monitor` contadas sem esperar o tempo real.
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

# Processo próprio: cada um mexe em estado do processo inteiro, que vazaria para os outros testes.
[[test]]
name = "workspace_unavailable"   # esvazia o PATH
path = "tests/workspace_unavailable.rs"

[[test]]
name = "worktree_fetch_process"
path = "tests/worktree_fetch_process.rs"

[[test]]
name = "runtime_diagnostics"   # logger global do tracing e contagem exata de avisos
path = "tests/runtime_diagnostics.rs"

[[test]]
name = "terminal_diagnostics"   # idem
path = "tests/terminal_diagnostics.rs"

[[test]]
name = "contract_local_policy"   # troca HOME, USERPROFILE e TZ
path = "tests/contract_local_policy.rs"

[[test]]
name = "contract_quotas_other"   # troca TZ
path = "tests/contract_quotas_other.rs"

[[test]]
name = "contract_credenciais"   # fixa HANGAR_RUNTIME_INSTANCE
path = "tests/contract_credenciais.rs"

[[test]]
name = "scope_retry"   # troca o PATH e o logger global
path = "tests/scope_retry.rs"

[[test]]
name = "costs_hook"   # gancho de pânico global (install_panic_hook)
path = "tests/costs_hook/main.rs"

[[test]]
name = "contract_orq_conductor"
path = "tests/contract_orq_conductor.rs"

[[test]]
name = "orq_bigint"
path = "tests/orq_bigint.rs"

[[test]]
name = "other_terminal"
path = "tests/other_terminal.rs"

[[test]]
name = "stats_agents"
path = "tests/stats_agents.rs"

[[test]]
name = "tail_agents"
path = "tests/tail_agents.rs"

[[test]]
name = "lifecycle_agents"
path = "tests/lifecycle_agents.rs"

[[test]]
name = "provider_hooks"
path = "tests/provider_hooks.rs"

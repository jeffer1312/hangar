[package]
name = "hangar-server"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# float_roundtrip: o float lido sai com o mesmo valor que o float() do Python, e o repr bate.
serde_json = { workspace = true, features = ["float_roundtrip"] }
hangar-api.workspace = true
hangar-workspace = { path = "../hangar-workspace" }
regex.workspace = true
md-5.workspace = true
sha1_smol.workspace = true
serde.workspace = true
axum = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
subtle = { workspace = true }
# io-std: o stdin é o cano que avisa a morte do Python.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
eventsource-stream = { workspace = true }
http-body-util = { workspace = true }
notify = { workspace = true }
percent-encoding = { workspace = true }
mime_guess = "=2.0.5"
base64 = "=0.23.1"

[dev-dependencies]
tempfile.workspace = true
reqwest = { workspace = true }

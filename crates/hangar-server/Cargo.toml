[package]
name = "hangar-server"
version.workspace = true
edition.workspace = true
publish = false
# Os testes de integração são um executável só (tests/it/) mais os que precisam de processo próprio.
autotests = false

[dependencies]
# float_roundtrip: o float lido sai com o mesmo valor que o float() do Python, e o repr bate.
# alloc (aqui, no serde e o signal do tokio): as features que o resto do workspace pede. Sem elas,
# `cargo test -p hangar-server` e `cargo test --workspace` compilam o servidor com features diferentes
# e cada um guarda a sua cópia de tudo no target.
serde_json = { workspace = true, features = ["float_roundtrip", "alloc"] }
indexmap.workspace = true
hangar-api.workspace = true
hangar-codex.workspace = true
toml = { version = "=1.1.7", default-features = false, features = ["parse", "std", "serde"] }
hangar-workspace = { path = "../hangar-workspace" }
regex.workspace = true
# Largura em células para cortar o pane na coluna da conversa (`plugin_screen.cell_width`).
unicode-width = "=0.2.2"
# Busca de bytes nos transcripts da lista; já vem pelo regex, sem crate novo.
memchr = "=2.8.3"
md-5.workspace = true
sha1_smol.workspace = true
# sha256 do workdir_key do Kimi; já vem pelo rustls, sem crate novo.
ring = "=0.17.14"
serde = { workspace = true, features = ["alloc"] }
serde-saphyr = "=1.3.0"
axum = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
subtle = { workspace = true }
# io-std: o stdin é o cano que avisa a morte do Python.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "fs", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
eventsource-stream = { workspace = true }
http-body-util = { workspace = true }
notify = { workspace = true }
percent-encoding = { workspace = true }
mime_guess = "=2.0.5"
base64 = "=0.23.1"
rusqlite.workspace = true
rayon.workspace = true
reqwest = { workspace = true, features = ["rustls", "multipart"] }
# Painel de terminal real (`term/`): PTY no Unix, ConPTY no Windows.
portable-pty = "=0.9.0"
unicode-normalization = "=0.1.25"
socket2 = "=0.6.5"
# Perfil temporário e CDP do Chromium que mede e fotografa as páginas (`pages/chrome.rs`); mesma versão que o axum puxa.
tempfile.workspace = true
tokio-tungstenite.workspace = true
# Processos fora do Linux (`list/procs.rs`; no Linux o leitor é o /proc) e o `observe_system` da voz.
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
# Canal da voz que vários consumidores leem (`voice/rpc.rs`); mesma versão do nativo.
async-channel = "=2.5.0"
# Miniatura de imagem (`thumbnail.rs`); mesma versão e features do nativo.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[dev-dependencies]
# Relógio pausado: as rodadas do `state::Monitor` contadas sem esperar o tempo real.
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

# Processo próprio: cada um mexe em estado do processo inteiro, que vazaria para os outros testes.
[[test]]
name = "workspace_unavailable"   # esvazia o PATH
path = "tests/workspace_unavailable.rs"

[[test]]
name = "runtime_diagnostics"   # logger global do tracing e contagem exata de avisos
path = "tests/runtime_diagnostics.rs"

[[test]]
name = "terminal_diagnostics"   # idem
path = "tests/terminal_diagnostics.rs"

[[test]]
name = "contract_local_policy"   # troca HOME, USERPROFILE e TZ
path = "tests/contract_local_policy.rs"

[[test]]
name = "costs_hook"   # gancho de pânico global (install_panic_hook)
path = "tests/costs_hook/main.rs"

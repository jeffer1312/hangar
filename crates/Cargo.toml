[workspace]
resolver = "3"
members = ["hangar-auth", "hangar-api", "hangar-core", "hangar-transcript", "hangar-omp-sync", "hangar-server", "hangar-cano", "hangar-workspace", "hangar-codex", "hangar-package", "hangar-psmux", "hangar-connect", "hangar-plugins", "hangar-update-news", "hangar-workflows", "hangar-http-file", "hangar-desktop-theme", "hangar-opencode-cookie", "hangar-deploy", "hangar-port-preview", "hangar-session-tools", "hangar-codex-account-sync"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
hangar-codex-account-sync = { path = "hangar-codex-account-sync" }
hangar-session-tools = { path = "hangar-session-tools" }
# Mesmas versões do desktop-native/Cargo.toml: o hangar-api entra nos dois builds.
serde = { version = "=1.0.229", features = ["derive"] }
# preserve_order: o tool_input reescrito sai com as chaves na ordem do dict do Python.
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
hangar-api = { path = "hangar-api" }
tokio = { version = "=1.53.1" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
regex = "=1.13.1"
md-5 = "=0.10.6"
sha1_smol = "=1.0.1"
# Busca de bytes nos transcripts; já vem pelo regex, sem crate novo.
memchr = "=2.8.3"
tempfile = "=3.27.0"
libc = "=0.2.189"
windows-sys = "=0.61.2"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "query", "ws"] }
bytes = "=1.12.1"
flate2 = "=1.1.10"
form_urlencoded = "=1.2.2"
futures-util = "=0.3.34"
hyper = { version = "=1.11.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["client-legacy", "http1", "tokio"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["stream"] }
subtle = "=2.6.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
eventsource-stream = "=0.2.3"
http-body-util = "=0.1.5"
notify = "=7.0.0"
percent-encoding = "=2.3.2"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rayon = "=1.12.0"
hangar-codex = { path = "hangar-codex" }
hangar-psmux = { path = "hangar-psmux" }
hangar-core = { path = "hangar-core" }
hangar-auth = { path = "hangar-auth" }
hangar-transcript = { path = "hangar-transcript" }
hangar-omp-sync = { path = "hangar-omp-sync" }
hangar-connect = { path = "hangar-connect" }
hangar-plugins = { path = "hangar-plugins" }
hangar-workflows = { path = "hangar-workflows" }
hangar-http-file = { path = "hangar-http-file" }
hangar-desktop-theme = { path = "hangar-desktop-theme" }
hangar-opencode-cookie = { path = "hangar-opencode-cookie" }
hangar-deploy = { path = "hangar-deploy" }
hangar-port-preview = { path = "hangar-port-preview" }
mime_guess = "=2.0.5"
serde-saphyr = "=1.3.0"
base64 = "=0.23.1"
proptest = "=1.12.0"
num-bigint = "=0.5.1"
ring = "=0.17.14"
tokio-tungstenite = "=0.29.0"
# Aparelho iOS pelo cabo (`device_install`): versão provada no iPad, a mesma que o isideload usa, e com o
# mesmo backend de cripto dele (ring).
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "usbmuxd", "house_arrest", "afc", "installation_proxy", "misagent", "core_device_proxy", "remote_pairing", "tcp", "tunnel_tcp_stack", "xpc", "rsd", "pair"] }
plist = "=1.10.2"

# Depuração só de linhas: o backtrace sai com arquivo e linha, e cada executável de teste cai a menos
# da metade. Nas dependências, nenhuma. Variáveis no depurador: CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true

# O binário publicado pela main: LTO completo e uma unidade de código. Fica em target/dist/, à parte do
# release comum (o da pré-release de branch), que continua rápido de compilar.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

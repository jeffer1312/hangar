[package]
name = "hangar-integrations"
version.workspace = true
edition.workspace = true
publish = false

# Servidor MCP stdio de prova dos testes de integração (`CARGO_BIN_EXE_hangar-fixture-mcp`).
[[bin]]
name = "hangar-fixture-mcp"
path = "src/bin/fixture_mcp.rs"
test = false
bench = false

# Mesmas features do hangar-server para não duplicar dependências no target.
[dependencies]
hangar-core.workspace = true
serde = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, features = ["float_roundtrip", "alloc", "unbounded_depth", "arbitrary_precision", "raw_value"] }
ring.workspace = true
base64.workspace = true
form_urlencoded.workspace = true
percent-encoding.workspace = true
zeroize = { version = "=1.9.0", features = ["serde"] }
futures-util = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "fs", "signal"] }
http = "=1.5.0"
reqwest = { workspace = true, features = ["rustls", "multipart"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "transport-async-rw", "server", "transport-io"] }

[dev-dependencies]
axum = { workspace = true }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-streamable-http-server", "transport-io"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

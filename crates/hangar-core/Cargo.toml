[package]
name = "hangar-core"
version.workspace = true
edition.workspace = true
publish = false

# Mesmas features do hangar-server: sem elas, compilar o core sozinho guarda outra cópia de cada
# dependência no target (ver o comentário do serde_json em hangar-server/Cargo.toml).
[dependencies]
axum = { workspace = true }
base64 = "=0.23.1"
chrono = { workspace = true }
flate2 = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true }
hangar-auth.workspace = true
http-body-util = { workspace = true }
hyper-util = { workspace = true }
md-5.workspace = true
num-bigint.workspace = true
percent-encoding = { workspace = true }
regex.workspace = true
ring.workspace = true
reqwest = { workspace = true, features = ["rustls", "multipart"] }
serde = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, features = ["float_roundtrip", "alloc", "unbounded_depth", "arbitrary_precision", "raw_value"] }
sha1_smol.workspace = true
subtle = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "fs", "signal"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_System_SystemInformation", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_Xps", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
# Ajudantes que só os testes do servidor usam; ligada só nas dev-dependencies dele.
test-support = []

[dev-dependencies]
tempfile.workspace = true
# Relógio pausado nos testes de `terminal_process`.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[package]
name = "hangar-ticket-actions"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
hangar-core.workspace = true
hangar-mission.workspace = true
hangar-connectors.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip", "alloc", "unbounded_depth", "arbitrary_precision", "raw_value"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
axum.workspace = true
form_urlencoded.workspace = true
percent-encoding.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

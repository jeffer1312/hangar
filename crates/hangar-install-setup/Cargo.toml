[package]
name = "hangar-install-setup"
version.workspace = true
edition.workspace = true
publish = false

# Mesmas features do hangar-server: sem elas o target guarda outra cópia de cada dependência.
[dependencies]
base64.workspace = true
hangar-core.workspace = true
ring.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip", "alloc", "unbounded_depth", "arbitrary_precision", "raw_value"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[package]
name = "hangar-delegation"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
hangar-core.workspace = true

# Mesmas features do hangar-server: sem elas, compilar este crate sozinho guarda outra cópia do
# serde_json no target (ver o comentário do serde_json em hangar-server/Cargo.toml).
[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip", "alloc", "unbounded_depth", "arbitrary_precision", "raw_value"] }

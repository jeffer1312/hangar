[package]
name = "hangar-connectors"
version.workspace = true
edition.workspace = true
publish = false

# O conector de teste do Help: um programa à parte, que o host só conhece pelo manifesto.
[[bin]]
name = "hangar-help-test-connector"
path = "src/bin/help_test_connector/main.rs"

# Conector de prova dos testes do host (`CARGO_BIN_EXE_*` só existe para binários).
[[bin]]
name = "hangar-fixture-connector"
path = "src/bin/fixture_connector.rs"

# Mesmas features do hangar-server: sem elas, compilar este crate sozinho guarda outra cópia de cada
# dependência no target (ver o comentário do serde_json em hangar-server/Cargo.toml).
[dependencies]
hangar-core.workspace = true
axum = { workspace = true }
chrono = { workspace = true }
percent-encoding = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "multipart"] }
serde = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, features = ["float_roundtrip", "alloc", "unbounded_depth", "arbitrary_precision", "raw_value"] }
sha1_smol.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "fs", "signal"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
